        if (sourceNumber === targetNumber) return;
        const lines = codeMirrorDocumentLines(doc);
        if (!codeMirrorTasksAreSiblings(lines, sourceNumber - 1, targetNumber - 1)) return;
        const source = codeMirrorTaskSubtree(lines, sourceNumber - 1);
        if (targetNumber - 1 >= source.from && targetNumber - 1 < source.to) return;
        const target = codeMirrorTaskSubtree(lines, targetNumber - 1);
        const moved = lines.splice(source.from, source.to - source.from);
        let insertionIndex = session.dropAfter ? target.to : target.from;
        if (source.from < insertionIndex) insertionIndex -= moved.length;
        insertionIndex = Math.max(0, Math.min(lines.length, insertionIndex));
        lines.splice(insertionIndex, 0, ...moved);
        const updated = lines.join("\n");
        const anchor = lines.slice(0, insertionIndex)
          .reduce((length, line) => length + line.length + 1, 0);
        dispatchCodeMirrorChange(
          { from: 0, to: doc.length, insert: updated }, { anchor });
        updateStatus(moved.length > 1 ? "Task group reordered" : "Task reordered");
      }

      async function writeText(handle, text) {
        const writable = await handle.createWritable();
        await writable.write(text);
        await writable.close();
      }

      function cancelAutoSave(file) {
        const timer = autoSaveTimers.get(file.id);
        if (timer) clearTimeout(timer);
        autoSaveTimers.delete(file.id);
      }

      function markdownPickerOptions(options = {}) {
        return {
          id: markdownPickerId,
          types: markdownPickerTypes,
          ...(session.lastOpenHandle ? { startIn: session.lastOpenHandle } : {}),
          ...options
        };
      }

      async function pickMarkdownFile(file, { reuseLastLocation = true } = {}) {
        if (typeof window.showSaveFilePicker !== "function") {
          updateStatus("Saving local files requires Chrome");
          return null;
        }
        try {
          const options = markdownPickerOptions({
            suggestedName: suggestedFileName(file),
            excludeAcceptAllOption: true
          });
          if (!reuseLastLocation) delete options.startIn;
          return await window.showSaveFilePicker(options);
        } catch (error) {
          if (error?.name === "AbortError") updateStatus();
          else updateStatus("Could not choose file name");
          return null;
        }
      }

      async function saveFile(file) {
        if (file.builtin || !file.handle) return false;
        const currentSave = activeSaves.get(file.id);
        if (currentSave) {
          if (!await currentSave) return false;
          return file.dirty ? saveFile(file) : true;
        }

        const operation = (async () => {
          if (!await waitForFileAttachments(file)) return false;
          const text = file.text;
          const storedText = serializeFile(file);
          try {
            await writeText(file.handle, storedText);
            file.name = file.handle.name;
            file.needsPermission = false;
            if (file.text === text) file.dirty = false;
            scheduleSessionSave();
            return true;
          } catch (error) {
            if (["NotAllowedError", "SecurityError"].includes(error?.name)) {
              file.needsPermission = true;
              scheduleSessionSave();
            }
            return false;
          }
        })();

        activeSaves.set(file.id, operation);
        try {
          return await operation;
        } finally {
          activeSaves.delete(file.id);
        }
      }

      function scheduleAutoSave(file) {
        if (file.builtin || !file.handle) return;
        cancelAutoSave(file);
        const timer = setTimeout(async () => {
          autoSaveTimers.delete(file.id);
          if (!session.files.includes(file) || !file.dirty) return;
          if (activeFile() === file) updateStatus("Saving…");
          const saved = await saveFile(file);
          if (activeFile() === file) {
            updateStatus(saved
              ? (file.dirty ? "Saving…" : "Saved")
              : (file.needsPermission ? "File access required" : "Couldn’t save"));
          }
          renderFiles();
          scheduleSessionSave();
          if (saved && file.dirty) scheduleAutoSave(file);
        }, autoSaveDelay);
        autoSaveTimers.set(file.id, timer);
      }

      async function saveActiveFile() {
        captureEditorValue();
        const file = activeFile();
        if (file.builtin || file.welcome) return;

        if (file.handle && !file.needsPermission) {
          if (!file.dirty) {
            updateStatus("Saved");
            return;
          }
          updateStatus("Saving…");
          const saved = await saveFile(file);
          renderFiles();
          updateStatus(saved
            ? (file.dirty ? "Saving…" : "Saved")
            : (file.needsPermission ? "File access required" : "Couldn’t save"));
          scheduleSessionSave();
          if (saved && file.dirty) scheduleAutoSave(file);
          return;
        }

        if (file.handle) {
          updateStatus("Reconnecting…");
          try {
            const permission = typeof file.handle.requestPermission === "function"
              ? await file.handle.requestPermission({ mode: "readwrite" })
              : "granted";
            if (permission !== "granted") {
              file.needsPermission = true;
              updateStatus("File access required");
              scheduleSessionSave();
              return;
            }

            file.needsPermission = false;
            let message = "Saved";
            if (file.dirty) {
              const saved = await saveFile(file);
              message = saved ? "Saved" : "Couldn’t save";
            } else {
              message = await loadFileFromHandle(file) || message;
              if (editorReady && activeFile() === file) setEditorValue(file);
              scheduleAttachmentPreviews();
            }
            renderFiles();
            updateStatus(message);
            scheduleSessionSave();
          } catch {
            file.needsPermission = true;
            updateStatus("Couldn’t reconnect");
            scheduleSessionSave();
          }
          return;
        }

        updateStatus("Choose where to save the file…");
        const previousName = file.name;
        const handle = await pickMarkdownFile(file);
        if (!handle || activeFile() !== file) return;
        file.handle = handle;
        file.name = handle.name;
        file.needsPermission = false;
        cancelAutoSave(file);
        updateStatus("Saving…");
        const saved = await saveFile(file);
        if (!saved) {
          file.handle = null;
          file.name = previousName;
        } else {
          session.lastOpenHandle = handle;
          syncSidebarFileAvailability(file);
        }
        renderFiles();
        updateStatus(saved
          ? (file.dirty ? "Saving…" : "Saved")
          : "Couldn’t save");
        scheduleSessionSave();
        if (saved && file.dirty) scheduleAutoSave(file);
      }

      async function saveActiveFileAs() {
        captureEditorValue();
        const file = activeFile();
        if (file.builtin || file.welcome) return;

        updateStatus("Choose a new file…");
        const handle = await pickMarkdownFile(file, { reuseLastLocation: false });
        if (!handle || activeFile() !== file) return;
        if (!await waitForFileAttachments(file)) {
          updateStatus("Couldn’t prepare the file");
          return;
        }

        const savedText = file.text;
        try {
          await writeText(handle, serializeFile(file));
        } catch {
          updateStatus("Couldn’t save as a new file");
          return;
        }

        cancelAutoSave(file);
        file.handle = handle;
        file.name = handle.name;
        file.needsPermission = false;
        if (file.text === savedText) file.dirty = false;
        session.lastOpenHandle = handle;
        syncSidebarFileAvailability(file);
        renderFiles();
        updateStatus(file.dirty
          ? `Saved as ${file.name} — newer changes not saved`
          : `Saved as ${file.name}`);
        scheduleSessionSave();
        if (file.dirty) scheduleAutoSave(file);
      }

      async function openLocalFile(sectionId = null) {
        if (typeof window.showOpenFilePicker !== "function") {
          updateStatus("Opening local files requires Chrome");
          return;
        }

        let handle;
        try {
          [handle] = await window.showOpenFilePicker(markdownPickerOptions({ multiple: false }));
        } catch (error) {
          if (error?.name === "AbortError") updateStatus();
          else updateStatus("Could not choose file");
          return;
        }

        for (const file of session.files) {
          if (!file.handle || typeof file.handle.isSameEntry !== "function") continue;
          try {
            if (await file.handle.isSameEntry(handle)) {
              captureEditorValue();
              activateFile(file, "File is already open");
              if (sectionId) moveFileToSection(file.id, sectionId);
              return;
            }
          } catch {}
        }

        captureEditorValue();
        updateStatus("Opening Markdown file…");
        try {
          const localFile = await handle.getFile();
          const parsed = parseStoredMarkdown(await localFile.text());
          const file = {
            id: createId(), name: localFile.name, text: parsed.text, handle,
            attachments: parsed.attachments, builtin: false, dirty: false,
            needsPermission: false
          };
          activateFile(file, parsed.warning || "Opened local file");
          if (sectionId) moveFileToSection(file.id, sectionId);
        } catch {
          updateStatus("Could not open file");
        }
      }

      async function requestedMarkdownName(currentName) {
        const requested = await requestFileDialog("rename", currentName);
        if (requested === null) return null;
        let name = requested.trim();
        if (!name) {
          updateStatus("A file name is required");
          return null;
        }
        if (/[\\/]/.test(name) || name === "." || name === "..") {
          updateStatus("File names cannot contain slashes");
          return null;
        }
        if (!/\.[^.]+$/.test(name)) {
          name += currentName.match(/\.(?:md|markdown)$/i)?.[0] || ".md";
        }
        if (!markdownFilePattern.test(name)) {
          updateStatus("Use a .md or .markdown file name");
          return null;
        }
        return name;
      }

      async function renameFileTarget(target) {
        const file = target.file;
        const currentName = file?.name;
        if (!currentName) return;
        const nextName = await requestedMarkdownName(currentName);
        if (!nextName || nextName === currentName) return;
        if (!file.handle) {
          file.name = nextName;
          renderFiles();
          updateStatus(`Renamed to ${nextName}`);
          scheduleSessionSave();
          return;
        }
        try {
          await file.handle.move(nextName);
          file.name = file.handle.name || nextName;
          renderFiles();
          updateStatus(`Renamed to ${file.name}`);
          scheduleSessionSave();
        } catch {
          updateStatus("Could not rename this file");
        }

      function handleCodeMirrorInput(value) {
        const file = activeFile();
        if (!file || codeMirrorInputSuppression) return;

        const transactionInput = resolveEditorHistoryValue(file, canonical);
        const synchronizeHistory = !transactionInput
          && consumeEditorHistorySynchronization(file);

        const wasDirty = file.dirty;
        file.text = canonical;

        }

        class MermaidWidget extends WidgetType {
          constructor(block) {
            super();

              && other.block.to === this.block.to
              && other.block.source === this.block.source;
          }

            const wrapper = document.createElement("div");
            wrapper.className = "LocalMarkdown-cm-mermaid-block";
            wrapper.dataset.renderState = "loading";
            wrapper.tabIndex = 0;
            wrapper.setAttribute("role", "group");
            wrapper.setAttribute("aria-label", "Mermaid diagram. Click to edit its source.");
            wrapper.title = "Click to edit Mermaid source";
            const status = document.createElement("pre");
            status.className = "LocalMarkdown-cm-mermaid-status";
            status.textContent = "Rendering Mermaid diagram…";
            wrapper.append(status);
            const edit = event => {
              if (event.target.closest?.(".LocalMarkdown-cm-mermaid-expand")) return;
              if (event.type === "mousedown" && event.button !== 0) return;
              event.preventDefault();
              event.stopPropagation();
              view.dispatch({
                selection: { anchor: Math.min(this.block.bodyFrom, view.state.doc.length) },
                scrollIntoView: true
              });
              requestAnimationFrame(() => view.focus());
            };
            wrapper.addEventListener("mousedown", edit);
            wrapper.addEventListener("keydown", event => {
              if (["Enter", " "].includes(event.key)) edit(event);
            });
            this.render(wrapper);
            return wrapper;

            try {
              const mermaid = await loadMermaid();
              const id = `LocalMarkdown-mermaid-${++mermaidRenderId}`;
              const { svg, bindFunctions } = await mermaid.render(id, this.block.source);
              if (!wrapper.isConnected) return;
              wrapper.innerHTML = svg;
              wrapper.dataset.renderState = "ready";
              const diagram = wrapper.querySelector("svg");
              diagram?.setAttribute("role", "img");
              diagram?.setAttribute("aria-label", "Mermaid diagram");
              bindFunctions?.(wrapper);
              const expand = document.createElement("button");
              expand.type = "button";
              expand.className = "LocalMarkdown-cm-mermaid-expand";
              expand.setAttribute("aria-label", "Enlarge Mermaid diagram");
              expand.title = "Enlarge Mermaid diagram";
              expand.innerHTML = `<svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M8 3H3v5m9-5h5v5M8 17H3v-5m9 5h5v-5"></path></svg>`;

              expand.addEventListener("keydown", event => event.stopPropagation());

        function appendTableCellText(cell, value) {
          cell.append(document.createTextNode(value.replace(/\\\|/g, "|")));
        }

        function appendTableCellContent(cell, value) {
          const tokenPattern = /!\[([^\]\n]*)\]\(\s*(<[^>\n]+>|[^\s)\n]+)(?:\s+(["'])(.*?)\3)?\s*\)|<img\b[^>]*>|<br\s*\/?\s*>/gi;
          let cursor = 0;
          for (const match of value.matchAll(tokenPattern)) {
            if (match.index > cursor) {
              appendTableCellText(cell, value.slice(cursor, match.index));
            }
            if (/^<br/i.test(match[0])) {
              cell.append(document.createElement("br"));
            } else {
              const image = document.createElement("img");
              if (/^<img/i.test(match[0])) {
                const source = htmlAttribute(match[0], "src");
                if (!source) {
                  cell.append(document.createTextNode(match[0]));
                  cursor = match.index + match[0].length;
                  continue;
                }
                image.src = source;
                image.alt = htmlAttribute(match[0], "alt");
                const title = htmlAttribute(match[0], "title");
                const width = Number.parseInt(htmlAttribute(match[0], "width"), 10);
                const style = htmlAttribute(match[0], "style");
                const alignment = /margin-left\s*:\s*auto/i.test(style)
                  ? (/margin-right\s*:\s*0/i.test(style) ? "right" : "center")
                  : (/margin-right\s*:\s*auto/i.test(style) ? "left" : null);
                if (title) image.title = title;
                if (Number.isFinite(width)) image.style.width = `${width}px`;
                if (alignment) {
                  image.dataset.imageAlign = alignment;
                  image.style.display = "block";
                  image.style.marginLeft = alignment === "left" ? "0" : "auto";
                  image.style.marginRight = alignment === "right" ? "0" : "auto";
                }
              } else {
                image.src = match[2].replace(/^<|>$/g, "");
                image.alt = match[1];
                if (match[4]) image.title = match[4];

              if (attachmentId) image.dataset.localMarkdownAttachment = attachmentId;
              image.dataset.markdownImage = match[0];
              configureCodeMirrorTableImage(image);
              cell.append(image);

        function tableTextNodeMarkdown(value) {

            .replace(/\u200b/g, "")
            .replace(/\r\n?|\n/g, "<br>")
            .replace(/\\*\|/g, match => {
              const slashes = match.length - 1;
              const escaped = slashes % 2 === 0 ? slashes + 1 : slashes;
              return `${"\\".repeat(escaped)}|`;

        function tableImageMarkdown(image) {
          const stored = image.dataset.markdownImage;
          const source = imageSourceReference(image, activeFile());
          if (!source) return stored || "";
          const width = Number.parseInt(image.style.width || image.getAttribute("width"), 10);
          const alignment = imageAlignment(image);
          if (Number.isFinite(width) || alignment) {
            return imageHtml(
              source,
              image.getAttribute("alt"),
              image.getAttribute("title"),
              Number.isFinite(width) ? width : null,
              alignment
            );
          }
          if (stored) return stored;
          const target = /[\s()]/.test(source) ? `<${source}>` : source;
          const title = image.getAttribute("title");
          const suffix = title ? ` "${title.replace(/"/g, "\\\"")}"` : "";
          return `![${(image.getAttribute("alt") || "").replace(/\]/g, "\\]")}](${target}${suffix})`;

        function tableCellNodeMarkdown(node) {
          if (node.nodeType === Node.TEXT_NODE) return tableTextNodeMarkdown(node.nodeValue || "");

          if (node.tagName === "IMG") return tableImageMarkdown(node);
          const content = Array.from(node.childNodes, tableCellNodeMarkdown).join("");
          return /^(?:DIV|P|LI)$/i.test(node.tagName) && node.nextSibling

            serializeCodeMirrorTableRow(rows[0], block.indent),
            serializeCodeMirrorTableRow(codeMirrorTableDelimiter(block.alignments), block.indent),

          if (replacement === null) return false;

          const fragment = document.createDocumentFragment();
          let lastNode = null;
          text.split(/\r\n?|\n/).forEach((part, index) => {
            if (index) {
              lastNode = document.createElement("br");
              fragment.append(lastNode);
            }
            if (part) {
              lastNode = document.createTextNode(part);
              fragment.append(lastNode);
            }

          if (lastNode?.nodeName === "BR") {
            lastNode = document.createTextNode("\u200b");
            fragment.append(lastNode);
          }
          if (!lastNode) {
            lastNode = document.createElement("br");
            fragment.append(lastNode);
          }
          range.insertNode(fragment);

            focusCodeMirrorTableCell(cells[nextIndex]);
            return;
          }
          if (event.shiftKey) {
            focusCodeMirrorTableCell(cells[0], false);
            return;
          }
          const tableIndex = Number(table.dataset.markdownTableIndex);
          const rowIndex = table.rows.length;
          tableHoverCell = cell;
          if (!updateCodeMirrorTableStructure("row-below", cell)) return;
          requestAnimationFrame(() => {
            const nextTable = editorElement.querySelector(
              `.LocalMarkdown-cm-table-widget[data-markdown-table-index="${tableIndex}"]`);
            focusCodeMirrorTableCell(tableCellAt(nextTable, rowIndex, 0), false);
          });
        }

        class TableWidget extends WidgetType {
          constructor(block) {
            super();
            this.block = block;
          }
          eq(other) {
            return other.block.start === this.block.start
              && other.block.tableIndex === this.block.tableIndex
              && other.block.renderStart === this.block.renderStart
              && other.block.end === this.block.end
              && JSON.stringify(other.block.rows) === JSON.stringify(this.block.rows)
              && JSON.stringify(other.block.alignments) === JSON.stringify(this.block.alignments)
              && JSON.stringify(other.block.widths) === JSON.stringify(this.block.widths)
              && other.block.tableWidth === this.block.tableWidth;
          }
          toDOM(view) {
            const wrapper = document.createElement("span");
            wrapper.className = "LocalMarkdown-cm-table-block";
            const table = document.createElement("table");
            table.className = "LocalMarkdown-cm-table-widget";
            const body = document.createElement("tbody");
            this.block.rows.forEach((row, rowIndex) => {
              const tr = document.createElement("tr");
              row.forEach((value, columnIndex) => {
                const cell = document.createElement(rowIndex === 0 ? "th" : "td");
                configureCodeMirrorTableCell(cell, rowIndex, columnIndex,
                  this.block.alignments[columnIndex]);
                appendTableCellContent(cell, value);
                tr.append(cell);
              });
              body.append(tr);
            });
            table.append(body);
            applyCodeMirrorTableLayout(table, this.block);
            table.addEventListener("input", event => {
              const cell = event.target.closest?.("td, th");
              if (cell && shouldDeferCodeMirrorTableCommit(event, cell)) return;
              if (cell && !commitCodeMirrorTableEdit(view, table)) {
                updateStatus("Could not update the table cell");
              }
            });
            table.addEventListener("focusout", event => {
              const cell = event.target.closest?.("td, th");
              if (cell && !commitCodeMirrorTableEdit(view, table)) {
                updateStatus("Could not update the table cell");
              }
            });
            table.addEventListener("keydown", event =>
              handleCodeMirrorTableKeydown(event, view, table));
            table.addEventListener("paste", event => {
              const cell = event.target.closest?.("td, th");
              if (!cell) return;
              const text = event.clipboardData?.getData("text/plain");
              if (text === undefined) return;
              event.preventDefault();
              event.stopPropagation();
              markEditorHistoryPending("insertFromPaste", "beforeinput");
              if (insertCodeMirrorTableCellText(cell, text)
                && !commitCodeMirrorTableEdit(view, table)) {
                updateStatus("Could not paste into the table cell");
              }
            });
            table.addEventListener("focusin", event => {
              const cell = event.target.closest?.("td, th");
              if (!cell) return;
              tableHoverCell = cell;
            });
            wrapper.append(table);
            return wrapper;
          }
          updateDOM(wrapper) {
            const table = wrapper.querySelector("table");
            if (!table || table.rows.length !== this.block.rows.length
              || this.block.rows.some((row, rowIndex) =>
                table.rows[rowIndex]?.cells.length !== row.length)) return false;
            this.block.rows.forEach((row, rowIndex) => {
              row.forEach((value, columnIndex) => {
                const cell = table.rows[rowIndex].cells[columnIndex];
                const currentValue = tableCellMarkdown(cell);
                configureCodeMirrorTableCell(cell, rowIndex, columnIndex,
                  this.block.alignments[columnIndex]);
                if (currentValue !== value) {
                  cell.replaceChildren();
                  appendTableCellContent(cell, value);
                }
                for (const image of cell.querySelectorAll("img")) {
                  configureCodeMirrorTableImage(image);
                }
              });
            });
            applyCodeMirrorTableLayout(table, this.block);
            return true;
          }
          ignoreEvent() { return true; }
        }

        function inlinePreviewDecorations(line, decorations) {
          const text = line.text;
          const occupied = [];
          const addImage = (start, end, source, alt, title, width = null, alignment = null) => {
            occupied.push([start, end]);
            decorations.push(Decoration.replace({
              widget: new ImageWidget(line.from + start, line.from + end,
                source, alt, title, width, alignment)
            }).range(line.from + start, line.from + end));
          };
          for (const match of text.matchAll(
            /!\[([^\]\n]*)\]\(\s*(<[^>\n]+>|[^\s)\n]+)(?:\s+(["'])(.*?)\3)?\s*\)/g
          )) {
            addImage(match.index, match.index + match[0].length,
              match[2].replace(/^<|>$/g, ""), match[1], match[4] || "");
          }
          for (const match of text.matchAll(/<img\b[^>]*>/gi)) {
            const source = htmlAttribute(match[0], "src");
            if (!source) continue;
            const width = Number.parseInt(htmlAttribute(match[0], "width"), 10) || null;
            const style = htmlAttribute(match[0], "style");
            const alignment = /margin-left\s*:\s*auto/i.test(style)
              ? (/margin-right\s*:\s*0/i.test(style) ? "right" : "center")
              : (/margin-right\s*:\s*auto/i.test(style) ? "left" : null);
            addImage(match.index, match.index + match[0].length, source,
              htmlAttribute(match[0], "alt"), htmlAttribute(match[0], "title"),
              width, alignment);
          }
          const overlapsImage = (from, to) =>
            occupied.some(([start, end]) => from < end && to > start);
          const paired = [
            { pattern: /\*\*([^*\n]+?)\*\*/g, marker: 2, className: "LocalMarkdown-cm-format-strong" },
            { pattern: /(?<!\*)\*([^*\n]+?)\*(?!\*)/g, marker: 1, className: "LocalMarkdown-cm-format-emphasis" },
            { pattern: /~~([^~\n]+?)~~/g, marker: 2, className: "LocalMarkdown-cm-format-strike" },
            { pattern: /`([^`\n]+?)`/g, marker: 1, className: "LocalMarkdown-cm-format-code" }
          ];
          for (const format of paired) {
            for (const match of text.matchAll(format.pattern)) {
              if (overlapsImage(match.index, match.index + match[0].length)) continue;
              const from = line.from + match.index;
              const contentFrom = from + format.marker;
              const contentTo = from + match[0].length - format.marker;
              decorations.push(
                Decoration.replace({}).range(from, contentFrom),
                Decoration.mark({ class: format.className }).range(contentFrom, contentTo),
                Decoration.replace({}).range(contentTo, from + match[0].length)
              );
            }
          }
          for (const match of text.matchAll(/(?<!!)\[([^\]\n]+?)\]\(([^)\n]+?)\)/g)) {
            if (overlapsImage(match.index, match.index + match[0].length)) continue;
            const from = line.from + match.index;
            const labelFrom = from + 1;
            const labelTo = labelFrom + match[1].length;
            decorations.push(
              Decoration.replace({}).range(from, labelFrom),
              Decoration.mark({ class: "LocalMarkdown-cm-format-link" }).range(labelFrom, labelTo),
              Decoration.replace({}).range(labelTo, from + match[0].length)
            );
          }
        }

        function buildDecorations(view) {
          const decorations = [];
          const doc = view.state.doc;
          const documentLines = codeMirrorDocumentLines(doc);
          const activeLine = doc.lineAt(view.state.selection.main.head).number;
          const activePosition = view.state.selection.main.head;
          const codeBlocks = codeMirrorPreviewCodeBlocks(doc);
          const setextHeadings = codeMirrorPreviewSetextHeadings(doc);
          const renderedMermaidBlocks = markdownMermaidRenderBlocks(doc.toString())
            .filter(block => !selectionTouchesBlock(view.state.selection, block));
          const activeCodeBlock = codeBlocks.find(block =>
            activePosition >= block.from && activePosition <= block.to);
          const tableBlocks = markdownTableRenderBlocks(doc.toString());
          for (const visible of view.visibleRanges) {
            let line = doc.lineAt(visible.from);
            while (line.from <= visible.to) {
              if (renderedMermaidBlocks.some(block =>
                line.from < block.to && line.to >= block.from)
                || tableBlocks.some(block =>
                line.from >= block.renderStart && line.from <= block.end)) {
                if (line.to >= doc.length) break;
                line = doc.line(line.number + 1);
                continue;
              }
              const classes = [];
              const codeBlock = codeBlocks.find(block =>
                line.from < block.to && line.to >= block.from);
              if (codeBlock) {
                classes.push("LocalMarkdown-cm-line-code", "LocalMarkdown-cm-code-block-line");
                const fence = codeBlock.type === "FencedCode"
                  && /^\s{0,3}(?:`{3,}|~{3,})/.test(line.text);
                if (fence && codeBlock !== activeCodeBlock) {
                  classes.push("LocalMarkdown-cm-code-fence-hidden");
                  if (line.to > line.from) {
                    decorations.push(Decoration.replace({}).range(line.from, line.to));
                  }
                }
                decorations.push(Decoration.line({ class: classes.join(" ") }).range(line.from));
                if (line.to >= doc.length) break;
                line = doc.line(line.number + 1);
                continue;
              }
              const setextHeading = setextHeadings.find(heading =>
                line.from < heading.to && line.to >= heading.from);
              const setextUnderline = setextHeading
                && /^\s{0,3}(?:=+|-+)\s*$/.test(line.text);
              if (setextHeading && !setextUnderline) {
                classes.push("LocalMarkdown-cm-line-heading",
                  `LocalMarkdown-cm-line-heading-${setextHeading.level}`);
              } else if (setextUnderline
                && !(activePosition >= setextHeading.from
                  && activePosition <= setextHeading.to)) {
                classes.push("LocalMarkdown-cm-markup-line-hidden");
                if (line.to > line.from) {
                  decorations.push(Decoration.replace({}).range(line.from, line.to));
                }
              }
              const heading = line.text.match(/^\s{0,3}(#{1,6})\s+/);
              if (heading) {
                classes.push("LocalMarkdown-cm-line-heading",
                  `LocalMarkdown-cm-line-heading-${heading[1].length}`);
                if (line.number !== activeLine) {
                  decorations.push(Decoration.replace({})
                    .range(line.from, line.from + heading[0].length));
                }
              }
              const quote = line.text.match(/^(\s*(?:>\s*)+)/);
              if (quote) {
                classes.push("LocalMarkdown-cm-line-quote");
                if (line.number !== activeLine) {
                  decorations.push(Decoration.replace({})
                    .range(line.from, line.from + quote[0].length));
                }
              }
              const previousText = line.number > 1 ? doc.line(line.number - 1).text : "";
              const horizontalRule = /^\s{0,3}([-*_])(?:\s*\1){2,}\s*$/.test(line.text)
                && !setextHeading
                && !(/^\s{0,3}(?:=+|-+)\s*$/.test(line.text) && previousText.trim());
              if (horizontalRule && line.number !== activeLine) {
                decorations.push(Decoration.replace({
                  widget: new HorizontalRuleWidget()
                }).range(line.from, line.to));
              }
              const task = markdownTaskLineMatch(line.text);
              if (task) {
                const markerIndex = task[0].indexOf("[");
                const markerFrom = line.from + markerIndex;
                const taskDepth = codeMirrorListDepth(documentLines, line.number - 1);
                classes.push("LocalMarkdown-cm-line-task");
                if (taskDepth) {
                  classes.push(`LocalMarkdown-cm-task-depth-${Math.min(taskDepth, 12)}`);
                }
                decorations.push(Decoration.replace({
                  widget: new TaskWidget(
                    markerFrom, task[2].toLowerCase() === "x", line.from)
                }).range(line.from + task[1].length, line.from + task[0].length));
              } else if (line.number !== activeLine) {
                const list = line.text.match(/^(\s*)([-+*]|\d+[.)])(\s+)/);
                if (list && !horizontalRule) {
                  const markerFrom = line.from + list[1].length;
                  decorations.push(Decoration.replace({
                    widget: new ListMarkerWidget(list[2])
                  }).range(markerFrom, markerFrom + list[2].length + list[3].length));
                }
                inlinePreviewDecorations(line, decorations);
              }
              if (classes.length) {
                decorations.push(Decoration.line({ class: classes.join(" ") }).range(line.from));
              }
              if (line.to >= doc.length) break;
              line = doc.line(line.number + 1);
            }
          }
          return Decoration.set(decorations, true);
        }

        const inlinePreview = ViewPlugin.fromClass(class {
          constructor(view) { this.decorations = buildDecorations(view); }
          update(update) {
            if (update.docChanged || update.selectionSet || update.viewportChanged) {
              this.decorations = buildDecorations(update.view);
            }
          }
        }, { decorations: value => value.decorations });

        function buildTableDecorations(state) {
          const decorations = markdownTableRenderBlocks(state.doc.toString())
            .map(block => Decoration.replace({
              widget: new TableWidget(block), block: true
            }).range(block.renderStart, block.end));
          return Decoration.set(decorations, true);
        }

        const tablePreview = StateField.define({
          create: buildTableDecorations,
          update(value, transaction) {
            return transaction.docChanged || transaction.selection
              ? buildTableDecorations(transaction.state) : value;
          },
          provide: field => EditorView.decorations.from(field)
        });

        function buildMermaidDecorations(state) {
          const decorations = markdownMermaidRenderBlocks(state.doc.toString())
            .filter(block => !selectionTouchesBlock(state.selection, block))
            .map(block => Decoration.replace({
              widget: new MermaidWidget(block), block: true
            }).range(block.from, block.to));
          return Decoration.set(decorations, true);
        }

        const mermaidPreview = StateField.define({
          create: buildMermaidDecorations,
          update(value, transaction) {
            return transaction.docChanged || transaction.selection
              ? buildMermaidDecorations(transaction.state) : value;
          },
          provide: field => EditorView.decorations.from(field)
        });
        return [inlinePreview, tablePreview, mermaidPreview];
      }

      function codeMirrorSelection() {
        return codeMirrorView?.state.selection.main || null;
      }

      function dispatchCodeMirrorChange(changes, selection = null) {
        if (!codeMirrorView) return false;
        markEditorHistoryPending("", "command");
        codeMirrorView.dispatch({
          changes,
          ...(selection ? { selection } : {}),
          scrollIntoView: true
        });
        codeMirrorView.focus();
        return true;
      }

      function wrapCodeMirrorSelection(open, close = open, placeholder = "text") {
        const selection = codeMirrorSelection();
        if (!selection) return false;
        const selected = codeMirrorView.state.doc.sliceString(selection.from, selection.to);
        if (selected && selected.startsWith(open) && selected.endsWith(close)
          && selected.length >= open.length + close.length) {
          const inner = selected.slice(open.length, selected.length - close.length);
          return dispatchCodeMirrorChange(
            { from: selection.from, to: selection.to, insert: inner },
            { anchor: selection.from, head: selection.from + inner.length });
        }
        const content = selected || placeholder;
        const insert = `${open}${content}${close}`;
        const from = selection.from + open.length;
        return dispatchCodeMirrorChange(
          { from: selection.from, to: selection.to, insert },
          { anchor: from, head: from + content.length });
      }

      function codeMirrorLineTransformPosition(position, blockFrom, inputLines, outputLines) {
        let inputFrom = blockFrom;
        let outputFrom = blockFrom;
        for (let index = 0; index < inputLines.length; index += 1) {
          const input = inputLines[index];
          const output = outputLines[index];
          const inputTo = inputFrom + input.length;
          if (position <= inputTo) {
            const relative = position - inputFrom;
            const prefixDelta = output.length - input.length;
            const mappedRelative = prefixDelta >= 0
              ? relative + prefixDelta
              : Math.max(0, relative + prefixDelta);
            return outputFrom + Math.min(output.length, mappedRelative);
          }
          inputFrom = inputTo + 1;
          outputFrom += output.length + 1;
        }
        return position + outputFrom - inputFrom;
      }

      function transformCodeMirrorLines(transform, { preserveSelection = false } = {}) {
        const selection = codeMirrorSelection();
        if (!selection) return false;
        const doc = codeMirrorView.state.doc;
        const first = doc.lineAt(selection.from);
        const lastPosition = selection.to > selection.from && selection.to === doc.lineAt(selection.to).from
          ? selection.to - 1 : selection.to;
        const last = doc.lineAt(Math.max(selection.from, lastPosition));
        const source = doc.sliceString(first.from, last.to);
        const inputLines = source.split("\n");
        const outputLines = inputLines.map(transform);
        const output = outputLines.join("\n");
        const lineEnd = first.from + output.length;
        const nextSelection = preserveSelection ? {
          anchor: codeMirrorLineTransformPosition(
            selection.anchor, first.from, inputLines, outputLines),
          head: codeMirrorLineTransformPosition(
            selection.head, first.from, inputLines, outputLines)
        } : { anchor: lineEnd };
        return dispatchCodeMirrorChange(
          { from: first.from, to: last.to, insert: output },
          nextSelection);
      }

      function removeCodeMirrorIndentationUnit(line) {
        let index = 0;
        let width = 0;
        while (index < line.length && width < 4) {
          if (line[index] === " ") width += 1;
          else if (line[index] === "\t") width += 4 - width % 4;
          else break;
          index += 1;
        }
        return line.slice(index);
      }

      function outdentCodeMirrorLines() {
        return transformCodeMirrorLines(removeCodeMirrorIndentationUnit, {
          preserveSelection: true
        });
      }

      function toggleCodeMirrorLinePrefix(prefix, matcher) {
        const selection = codeMirrorSelection();
        if (!selection) return false;
        const doc = codeMirrorView.state.doc;
        const first = doc.lineAt(selection.from);
        const last = doc.lineAt(selection.to);
        const lines = [];
        for (let number = first.number; number <= last.number; number += 1) {
          lines.push(doc.line(number).text);
        }
        const remove = lines.every(line => matcher.test(line));
        return transformCodeMirrorLines((line, index) => remove
          ? line.replace(matcher, "")
          : typeof prefix === "function" ? prefix(index, line) : `${prefix}${line}`);
      }

      function cycleCodeMirrorHeading() {
        return transformCodeMirrorLines(line => {
          const match = line.match(/^(\s{0,3})(#{1,6})\s+(.*)$/);
          if (!match) return `# ${line}`;
          if (match[2].length === 6) return `${match[1]}${match[3]}`;
          return `${match[1]}${"#".repeat(match[2].length + 1)} ${match[3]}`;
        });
      }

      function setCodeMirrorHeadingLevel(level) {
        return transformCodeMirrorLines(line => {
          const content = line.replace(/^\s{0,3}#{1,6}\s+/, "");
          return level ? `${"#".repeat(level)} ${content}` : content;
        });
      }

      function adjustCodeMirrorHeading(delta) {
        return transformCodeMirrorLines(line => {
          const match = line.match(/^\s{0,3}(#{1,6})\s+(.*)$/);
          const level = Math.max(0, Math.min(6, (match?.[1].length || 0) + delta));
          const content = match?.[2] ?? line;
          return level ? `${"#".repeat(level)} ${content}` : content;
        });
      }

      function toggleCodeMirrorTask() {
        return transformCodeMirrorLines(line => {
          if (/^\s*(?:[-+*]|\d+[.)])\s+\[[ xX]\]\s+/.test(line)) {
            return line.replace(/\[([ xX])\]/, (_, mark) =>
              mark.toLowerCase() === "x" ? "[ ]" : "[x]");
          }
          return `- [ ] ${line}`;
        });
      }

      function continueCodeMirrorMarkup() {
        const selection = codeMirrorSelection();
        if (!selection || !selection.empty) return false;
        const doc = codeMirrorView.state.doc;
        const line = doc.lineAt(selection.head);
        const beforeCursor = line.text.slice(0, selection.head - line.from);
        const list = beforeCursor.match(/^(\s*)([-+*]|\d+[.)])(\s+)(\[[ xX]\]\s+)?/);
        const quote = beforeCursor.match(/^(\s*(?:>\s*)+)/);
        const prefix = list
          ? `${list[1]}${/^\d/.test(list[2]) ? `${Number.parseInt(list[2], 10) + 1}${list[2].slice(-1)}` : list[2]}${list[3]}${list[4] ? "[ ] " : ""}`
          : quote?.[1];
        if (!prefix) return false;
        const currentPrefixLength = list ? list[0].length : quote[0].length;
        if (!line.text.slice(currentPrefixLength).trim()) {
          return dispatchCodeMirrorChange({
            from: line.from,
            to: line.from + currentPrefixLength,
            insert: ""
          }, { anchor: line.from });
        }
        return dispatchCodeMirrorChange(
          { from: selection.head, insert: `\n${prefix}` },
          { anchor: selection.head + prefix.length + 1 });
      }

      function insertCodeMirrorNewline() {
        const selection = codeMirrorSelection();
        if (!selection || !codeMirrorView) return false;
        const line = codeMirrorView.state.doc.lineAt(selection.from);
        const indent = line.text.match(/^[\t ]*/)?.[0] || "";
        const insert = `\n${indent}`;
        return dispatchCodeMirrorChange(
          { from: selection.from, to: selection.to, insert },
          { anchor: selection.from + insert.length });
      }

      function insertCodeMirrorBlock(text, caretOffset = text.length) {
        const selection = codeMirrorSelection();
        if (!selection) return false;
        const doc = codeMirrorView.state.doc;
        const before = selection.from > 0 && doc.sliceString(selection.from - 1, selection.from) !== "\n"
          ? "\n" : "";
        const after = selection.to < doc.length && doc.sliceString(selection.to, selection.to + 1) !== "\n"
          ? "\n" : "";
        const insert = `${before}${text}${after}`;
        const caret = selection.from + before.length + caretOffset;
        return dispatchCodeMirrorChange(
          { from: selection.from, to: selection.to, insert },
          { anchor: caret });
      }

      function insertCodeMirrorCodeBlock() {
        const selection = codeMirrorSelection();
        if (!selection || !codeMirrorView) return false;
        const doc = codeMirrorView.state.doc;
        const line = doc.lineAt(selection.head);
        const from = selection.empty ? line.from : selection.from;
        const to = selection.empty ? line.to : selection.to;
        const content = doc.sliceString(from, to);
        const before = from > 0 && doc.sliceString(from - 1, from) !== "\n" ? "\n" : "";
        const after = to < doc.length && doc.sliceString(to, to + 1) !== "\n" ? "\n" : "";
        const opening = "```\n";
        const insert = `${before}${opening}${content}\n\`\`\`${after}`;
        const contentEnd = from + before.length + opening.length + content.length;
        return dispatchCodeMirrorChange(
          { from, to, insert },
          { anchor: contentEnd });
      }

      function toggleCodeMirrorOutline(force = null) {
        if (!codeMirrorOutline) return;
        const open = force ?? codeMirrorOutline.hidden;
        codeMirrorOutline.hidden = !open;
        const button = editor?.toolbarElements?.outline?.querySelector("button");
        button?.setAttribute("aria-pressed", String(open));
        if (open) renderCodeMirrorOutline();
        requestAnimationFrame(() => {
          refreshEditorWidthBounds();
          codeMirrorView?.requestMeasure();
        });
        try { localStorage.setItem(outlineStorageKey, open ? "open" : "closed"); } catch {}
      }

      function outlineHeadingLabel(source, level, setext = false) {
        let label = source.split(/\r?\n/)[0].trim();
        if (!setext) {
          label = label
            .replace(new RegExp(`^#{${level}}\\s*`), "")
            .replace(/\s+#+\s*$/, "");
        }
        return label
          .replace(/!\[([^\]]*)\]\([^)]*\)/g, "$1")
          .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
          .replace(/`([^`]+)`/g, "$1")
          .replace(/[*_~]/g, "")
          .replace(/<[^>]+>/g, "")
          .trim() || "Untitled heading";
      }

      function codeMirrorOutlineHeadings() {
        if (!codeMirrorView || !codeMirrorMarkdownParser) return [];
        const source = codeMirrorView.state.doc.toString();
        const headings = [];
        codeMirrorMarkdownParser.parse(source).iterate({
          enter(node) {
            const match = node.name.match(/^(ATX|Setext)Heading([1-6])$/);
            if (!match) return;
            const level = Number(match[2]);
            headings.push({
              from: node.from,
              level,
              label: outlineHeadingLabel(
                source.slice(node.from, node.to), level, match[1] === "Setext")
            });
          }
        });
        return headings;
      }

      function updateCodeMirrorOutlineCurrent(position = codeMirrorSelection()?.head) {
        if (!codeMirrorOutline || codeMirrorOutline.hidden || !Number.isFinite(position)) return;
        const buttons = Array.from(codeMirrorOutline.querySelectorAll(
          ".LocalMarkdown-cm-outline-content button[data-markdown-from]"));
        let current = null;
        for (const button of buttons) {
          if (Number(button.dataset.markdownFrom) > position) break;
          current = button;
        }
        for (const button of buttons) {
          if (button === current) button.setAttribute("aria-current", "location");
          else button.removeAttribute("aria-current");
        }
        current?.scrollIntoView({ block: "nearest" });
      }

      function renderCodeMirrorOutline() {
        if (!codeMirrorOutline || codeMirrorOutline.hidden || !codeMirrorView) return;
        codeMirrorOutline.replaceChildren();
        const header = document.createElement("header");
        header.className = "LocalMarkdown-cm-outline-header";
        const title = document.createElement("span");
        title.textContent = "Outline";
        const close = document.createElement("button");
        close.type = "button";
        close.className = "LocalMarkdown-cm-outline-close";
        close.innerHTML = `<svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M5.5 5.5l9 9m0-9l-9 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>`;
        close.title = "Close outline";
        close.setAttribute("aria-label", "Close outline");
        close.addEventListener("click", () => toggleCodeMirrorOutline(false));
        header.append(title, close);
        const content = document.createElement("nav");
        content.className = "LocalMarkdown-cm-outline-content";
        content.setAttribute("aria-label", "Document headings");
        const headings = codeMirrorOutlineHeadings();
        for (const heading of headings) {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = heading.label;
          button.dataset.headingLevel = String(heading.level);
          button.dataset.markdownFrom = String(heading.from);
          button.style.paddingLeft = `${8 + (heading.level - 1) * 14}px`;
          button.addEventListener("click", () => {
            codeMirrorView.dispatch({
              selection: { anchor: heading.from },
              scrollIntoView: true
            });
            codeMirrorView.focus();
          });
          content.append(button);
        }
        if (!headings.length) {
          const empty = document.createElement("span");
          empty.className = "LocalMarkdown-status";
          empty.textContent = "No headings";
          content.append(empty);
        }
        codeMirrorOutline.append(header, content);
        updateCodeMirrorOutlineCurrent();
      }

      function toggleCodeMirrorEmojiMenu(force = null) {
        if (!codeMirrorEmojiMenu) return;
        codeMirrorEmojiMenu.hidden = !(force ?? codeMirrorEmojiMenu.hidden);
      }

      function openCodeMirrorImagePicker() {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = "image/*";
        input.multiple = true;
        input.addEventListener("change", () => void pasteEmbeddedImages(input.files), { once: true });
        input.click();
      }

      function runCodeMirrorToolbarCommand(name) {
        if (!codeMirrorView) return;
        if (name !== "emoji") toggleCodeMirrorEmojiMenu(false);
        switch (name) {
          case "emoji": toggleCodeMirrorEmojiMenu(); break;
          case "headings": cycleCodeMirrorHeading(); break;
          case "bold": wrapCodeMirrorSelection("**", "**", "bold text"); break;
          case "italic": wrapCodeMirrorSelection("*", "*", "italic text"); break;
          case "strike": wrapCodeMirrorSelection("~~", "~~", "struck text"); break;
          case "link": {
            const selection = codeMirrorSelection();
            const label = selection.from === selection.to ? "link text"
              : codeMirrorView.state.doc.sliceString(selection.from, selection.to);
            const insert = `[${label}](https://)`;
            const urlFrom = selection.from + label.length + 3;
            dispatchCodeMirrorChange(
              { from: selection.from, to: selection.to, insert },
              { anchor: urlFrom, head: urlFrom + 8 });
            break;
          }
          case "list": toggleCodeMirrorLinePrefix("- ", /^\s*[-+*]\s+/); break;
          case "ordered-list": toggleCodeMirrorLinePrefix(
            (index, line) => `${index + 1}. ${line}`, /^\s*\d+[.)]\s+/); break;
          case "check": toggleCodeMirrorLinePrefix("- [ ] ", /^\s*[-+*]\s+\[[ xX]\]\s+/); break;
          case "outdent": outdentCodeMirrorLines(); break;
          case "indent": transformCodeMirrorLines(line => `    ${line}`, {
            preserveSelection: true
          }); break;
          case "quote": toggleCodeMirrorLinePrefix("> ", /^\s*>\s?/); break;
          case "line": insertCodeMirrorBlock("\n---\n", 5); break;
          case "code": insertCodeMirrorCodeBlock(); break;
          case "inline-code": wrapCodeMirrorSelection("`", "`", "code"); break;
          case "insert-before": {
            const line = codeMirrorView.state.doc.lineAt(codeMirrorSelection().from);
            dispatchCodeMirrorChange({ from: line.from, insert: "\n" }, { anchor: line.from });
            break;
          }
          case "insert-after": {
            const line = codeMirrorView.state.doc.lineAt(codeMirrorSelection().to);
            const insert = "\n";
            dispatchCodeMirrorChange({ from: line.to, insert }, { anchor: line.to + 1 });
            break;
          }
          case "upload": openCodeMirrorImagePicker(); break;
          case "table": insertCodeMirrorBlock(
            "| Column 1 | Column 2 |\n| --- | --- |\n| Cell | Cell |", 2); break;
          case "draw": void openDrawingDialog(); break;
          case "history-undo": undoDocumentChange(); break;
          case "history-redo": redoDocumentChange(); break;
          case "fullscreen": {
            const open = editorElement.classList.toggle("LocalMarkdown-editor--fullscreen");
            editor.toolbarElements.fullscreen.querySelector("button")
              ?.setAttribute("aria-pressed", String(open));
            requestAnimationFrame(() => {
              refreshEditorWidthBounds();
              codeMirrorView.requestMeasure();
            });
            break;
          }
          case "outline": toggleCodeMirrorOutline(); break;
          case "export": void saveActiveFile(); break;
        }
      }

      const codeMirrorToolbarItems = [
        "emoji", "headings", "bold", "italic", "strike", "link", "|",
        "list", "ordered-list", "check", "outdent", "indent", "|",
        "quote", "line", "code", "inline-code", "insert-before", "insert-after", "|",
        "upload", "table", "draw", "|", "history-undo", "history-redo", "|",
        "fullscreen", "outline", "export"
      ];
      const codeMirrorToolbarTitles = {
        emoji: "Emoji", headings: "Cycle heading", bold: "Bold", italic: "Italic",
        strike: "Strikethrough", link: "Link", list: "Bulleted list",
        "ordered-list": "Numbered list", check: "Task list", outdent: "Outdent",
        indent: "Indent", quote: "Block quote", line: "Horizontal rule",
        code: "Code block", "inline-code": "Inline code",
        "insert-before": "Insert line before", "insert-after": "Insert line after",
        upload: "Insert image", table: "Insert table", draw: "Draw with Excalidraw",
        "history-undo": "Undo", "history-redo": "Redo", fullscreen: "Fullscreen",
        outline: "Outline", export: "Save Markdown"
      };

      function createCodeMirrorToolbar() {
        const toolbar = document.createElement("div");
        toolbar.className = "LocalMarkdown-cm-toolbar";
        toolbar.setAttribute("role", "toolbar");
        toolbar.setAttribute("aria-label", "Markdown formatting");
        const elements = {};
        for (const name of codeMirrorToolbarItems) {
          if (name === "|") {
            const divider = document.createElement("span");
            divider.className = "LocalMarkdown-cm-toolbar-divider";
            divider.setAttribute("aria-hidden", "true");
            toolbar.append(divider);
            continue;
          }
          const wrapper = document.createElement("span");
          wrapper.className = "LocalMarkdown-cm-toolbar-group";
          const button = document.createElement("button");
          button.type = "button";
          button.className = "LocalMarkdown-cm-tool";
          button.title = codeMirrorToolbarTitles[name] || name;
          button.setAttribute("aria-label", button.title);
          button.innerHTML = toolbarIcon(name.replace("history-", ""));
          button.addEventListener("pointerdown", event => event.preventDefault());
          button.addEventListener("click", () => runCodeMirrorToolbarCommand(name));
          wrapper.append(button);
          toolbar.append(wrapper);
          elements[name] = wrapper;
        }
        return { toolbar, elements };
      }

      function createCodeMirrorMenus() {
        codeMirrorOutline = document.createElement("aside");
        codeMirrorOutline.className = "LocalMarkdown-cm-outline";
        codeMirrorOutline.setAttribute("aria-label", "Document outline");
        codeMirrorOutline.hidden = true;
        codeMirrorView?.dom.parentElement?.append(codeMirrorOutline);

        codeMirrorEmojiMenu = document.createElement("div");
        codeMirrorEmojiMenu.className = "LocalMarkdown-cm-emoji-menu";
        codeMirrorEmojiMenu.setAttribute("role", "menu");
        codeMirrorEmojiMenu.setAttribute("aria-label", "Emoji");
        codeMirrorEmojiMenu.hidden = true;
        for (const [name, emoji] of Object.entries(emojiMap)) {
          const button = document.createElement("button");
          button.type = "button";
          button.title = name;
          button.textContent = emoji;
          button.addEventListener("pointerdown", event => event.preventDefault());
          button.addEventListener("click", () => {
            editor.insertMD(emoji);
            toggleCodeMirrorEmojiMenu(false);
          });
          codeMirrorEmojiMenu.append(button);
        }
        editorElement.append(codeMirrorEmojiMenu);
      }

      function createCodeMirrorAdapter(view, toolbarElements) {
        return {
          getValue() { return view.state.doc.toString(); },
          setValue(value) {
            const next = String(value ?? "");
            if (view.state.doc.toString() === next) return;
            codeMirrorInputSuppression += 1;
            try {
              view.dispatch({
                changes: { from: 0, to: view.state.doc.length, insert: next },
                selection: { anchor: Math.min(view.state.selection.main.head, next.length) }
              });
            } finally {
              codeMirrorInputSuppression -= 1;
            }
          },
          insertMD(markdown) {
            const selection = view.state.selection.main;
            const insert = String(markdown ?? "");
            dispatchCodeMirrorChange(
              { from: selection.from, to: selection.to, insert },
              { anchor: selection.from + insert.length });
          },
          focus() { view.focus(); },
          setTheme() { view.requestMeasure(); },
          toolbarElements
        };
      }

      async function initializeCodeMirror() {
        const [
          codeMirrorViewModule,
          codeMirrorStateModule,
          codeMirrorCommandsModule,
          codeMirrorMarkdownModule
        ] =
          await Promise.all([
          import(codeMirrorViewModuleUrl), import(codeMirrorStateModuleUrl),
          import(codeMirrorCommandsModuleUrl), import(codeMirrorMarkdownModuleUrl)
        ]);
        const {
          EditorView, drawSelection, dropCursor, highlightActiveLine,
          highlightSpecialChars, keymap
        } = codeMirrorViewModule;
        const { EditorState, StateField } = codeMirrorStateModule;
        codeMirrorMarkdownParser = codeMirrorMarkdownModule.parser;
        const standardEditingKeymap = codeMirrorCommandsModule.defaultKeymap
          .filter(binding => !["Enter", "Mod-Enter"].includes(binding.key));
        const livePreview = createCodeMirrorLivePreview({
          ...codeMirrorViewModule, StateField
        });
        editorElement.classList.add("LocalMarkdown-codemirror");
        const { toolbar, elements } = createCodeMirrorToolbar();
        const shell = document.createElement("div");
        shell.className = "LocalMarkdown-cm-shell";
        editorElement.replaceChildren(toolbar, shell);
        codeMirrorView = new EditorView({
          doc: activeFile().text,
          extensions: [
            highlightSpecialChars(),
            drawSelection(),
            dropCursor(),
            highlightActiveLine(),
            EditorView.lineWrapping,
            EditorState.allowMultipleSelections.of(true),
            keymap.of(standardEditingKeymap),
            livePreview,
            EditorView.updateListener.of(update => {
              if (update.docChanged) handleCodeMirrorInput(update.state.doc.toString());
              if (update.selectionSet) updateCodeMirrorOutlineCurrent(
                update.state.selection.main.head);
              else if (update.viewportChanged) updateCodeMirrorOutlineCurrent(
                update.view.viewport.from);
              scheduleCodeMirrorLineDecorations();
            })
          ],
          parent: shell
        });
        editor = createCodeMirrorAdapter(codeMirrorView, elements);
        codeMirrorView.contentDOM.setAttribute("aria-label", "Markdown editor");
        codeMirrorView.contentDOM.setAttribute("spellcheck", "true");
        createCodeMirrorMenus();
        editorReady = true;
        refreshEditorWidthBounds({ initialize: true });
        setTheme(document.documentElement.dataset.theme, { persist: false });
        setEditorValue(activeFile());
        documentHistoryFor(activeFile());
        updateDocumentHistoryControls();
        updateStatus();
        observeAttachmentPreviews();
        scheduleCodeMirrorLineDecorations();
        scheduleAttachmentPreviews();
        scheduleTableWidths();
        try {
          if (localStorage.getItem(outlineStorageKey) === "open") toggleCodeMirrorOutline(true);
        } catch {}
      }

      try {
        await initializeCodeMirror();
      } catch (error) {
        console.error(error);
        editorElement.dataset.initializationError = error?.message || String(error);
        updateStatus("Could not load CodeMirror 6");
        editorElement.textContent = "CodeMirror 6 could not be loaded. Check the network and refresh.";
      }

      function disposeRuntimeResources() {
        attachmentPreviewObserver?.disconnect();
        attachmentPreviewObserver = null;
        cancelAnimationFrame(codeMirrorLineDecorationFrame);
        codeMirrorLineDecorationFrame = null;
        cancelAnimationFrame(editorStateRestoreFrame);
        editorStateRestoreFrame = null;
        cancelAnimationFrame(tableWidthRefreshFrame);
        tableWidthRefreshFrame = null;
        if (tableResizeSession?.frameId != null) {
          cancelAnimationFrame(tableResizeSession.frameId);
        }
        tableResizeSession = null;
        clearTimeout(imagePreviewTimer);
        imagePreviewTimer = null;
        clearTimeout(attachmentPreviewTimer);
        attachmentPreviewTimer = null;
        clearTimeout(sessionSaveTimer);
        sessionSaveTimer = null;
        clearTimeout(editorHistorySynchronizationTimer);
        editorHistorySynchronizationTimer = null;
        editorHistorySynchronization = null;
        for (const timer of autoSaveTimers.values()) clearTimeout(timer);
        autoSaveTimers.clear();
        for (const request of imageWorkerRequests.values()) clearTimeout(request.timer);
        imageWorkerRequests.clear();
        for (const waiter of editorHistoryValueWaiters.values()) clearTimeout(waiter.timeout);
        editorHistoryValueWaiters.clear();
        sidebarDragPreview?.remove();
        sidebarDragPreview = null;
        releaseAttachmentPreviews();
        imageWorker?.terminate();
        imageWorker = null;
        if (imageWorkerUrl) URL.revokeObjectURL(imageWorkerUrl);
        imageWorkerUrl = null;
        drawingRoot?.unmount();
        drawingRoot = null;
        drawingSession = null;
        flushActiveCodeMirrorTableCell = () => false;
        codeMirrorView?.destroy();
        codeMirrorView = null;
        editor = null;
        editorReady = false;
      }

      addEventListener("unload", disposeRuntimeResources);
    })();
  </script>
</body>
</html>
