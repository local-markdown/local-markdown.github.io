        const commandKey = isMac ? event.metaKey : event.ctrlKey;
        if (!editorReady || !commandKey || !event.altKey || event.shiftKey) return;
        const mode = ({ Digit7: "wysiwyg", Digit8: "ir", Digit9: "sv" })[event.code];
        if (!mode) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        switchEditorMode(mode);
      }

      async function writeText(handle, text) {
        const writable = await handle.createWritable();
        await writable.write(text);
        await writable.close();
      }

      function cancelAutoSave(file) {
        const timer = autoSaveTimers.get(file.id);
        if (timer) clearTimeout(timer);
        autoSaveTimers.delete(file.id);
      }

      function markdownPickerOptions(options = {}) {
        return {
          id: markdownPickerId,
          types: markdownPickerTypes,
          ...(session.lastOpenHandle ? { startIn: session.lastOpenHandle } : {}),
          ...options
        };
      }

      async function pickMarkdownFile(file, { reuseLastLocation = true } = {}) {
        if (typeof window.showSaveFilePicker !== "function") {
          updateStatus("Saving local files requires Chrome");
          return null;
        }
        try {
          const options = markdownPickerOptions({
            suggestedName: suggestedFileName(file),
            excludeAcceptAllOption: true
          });
          if (!reuseLastLocation) delete options.startIn;
          return await window.showSaveFilePicker(options);
        } catch (error) {
          if (error?.name === "AbortError") updateStatus();
          else updateStatus("Could not choose file name");
          return null;
        }
      }

      async function saveFile(file) {
        if (file.builtin || !file.handle) return false;
        const currentSave = activeSaves.get(file.id);
        if (currentSave) {
          if (!await currentSave) return false;
          return file.dirty ? saveFile(file) : true;
        }

        const operation = (async () => {
          if (!await waitForFileAttachments(file)) return false;
          const text = file.text;
          const storedText = serializeFile(file);
          try {
            await writeText(file.handle, storedText);
            file.name = file.handle.name;
            file.needsPermission = false;
            if (file.text === text) file.dirty = false;
            syncWorkspaceSearchText(file);
            scheduleSessionSave();
            return true;
          } catch (error) {
            if (["NotAllowedError", "SecurityError"].includes(error?.name)) {
              file.needsPermission = true;
              scheduleSessionSave();
            }
            return false;
          }
        })();

        activeSaves.set(file.id, operation);
        try {
          return await operation;
        } finally {
          activeSaves.delete(file.id);
        }
      }

      function scheduleAutoSave(file) {
        if (file.builtin || !file.handle) return;
        cancelAutoSave(file);
        const timer = setTimeout(async () => {
          autoSaveTimers.delete(file.id);
          if (!session.files.includes(file) || !file.dirty) return;
          if (activeFile() === file) updateStatus("Saving…");
          const saved = await saveFile(file);
          if (activeFile() === file) {
            updateStatus(saved
              ? (file.dirty ? "Not saved to disk" : "Saved automatically")
              : "Could not autosave");
          }
          renderFiles();
          scheduleSessionSave();
          if (saved && file.dirty) scheduleAutoSave(file);
        }, autoSaveDelay);
        autoSaveTimers.set(file.id, timer);
      }

      async function saveActiveFile() {
        captureEditorValue();
        const file = activeFile();
        if (file.builtin) return;

        if (file.handle) {
          updateStatus("Reconnecting to local file…");
          try {
            const permission = typeof file.handle.requestPermission === "function"
              ? await file.handle.requestPermission({ mode: "readwrite" })
              : "granted";
            if (permission !== "granted") {
              file.needsPermission = true;
              updateStatus("File access was not restored");
              scheduleSessionSave();
              return;
            }

            file.needsPermission = false;
            let message = "Reconnected to local file";
            if (file.dirty) {
              const saved = await saveFile(file);
              message = saved ? "Saved" : "Could not save file";
            } else {
              message = await loadFileFromHandle(file) || message;
              if (editorReady && activeFile() === file) setEditorValue(file);
              scheduleAttachmentPreviews();
            }
            renderFiles();
            updateStatus(message);
            scheduleSessionSave();
          } catch {
            file.needsPermission = true;
            updateStatus("Could not reconnect local file");
            scheduleSessionSave();
          }
          return;
        }

        updateStatus("Choose a file name and folder…");
        const previousName = file.name;
        const handle = await pickMarkdownFile(file);
        if (!handle || activeFile() !== file) return;
        file.handle = handle;
        file.name = handle.name;
        file.needsPermission = false;
        cancelAutoSave(file);
        updateStatus("Saving…");
        const saved = await saveFile(file);
        if (!saved) {
          file.handle = null;
          file.name = previousName;
        } else {
          session.lastOpenHandle = handle;
          const workspaceLocation = await workspaceLocationForHandle(handle);
          file.workspaceId = workspaceLocation?.workspace.id || null;
          file.workspacePath = workspaceLocation?.node.path || null;
          syncSidebarFileAvailability(file);
          syncWorkspaceSearchText(file);
        }
        renderFiles();
        updateStatus(saved
          ? (file.dirty ? "Not saved to disk" : "Saved")
          : "Could not save file");
        scheduleSessionSave();
        if (saved && file.dirty) scheduleAutoSave(file);
      }

      async function saveActiveFileCopy() {
        captureEditorValue();
        const file = activeFile();
        if (file.builtin || file.welcome) return;

        updateStatus("Choose where to save a copy…");
        const handle = await pickMarkdownFile(file, { reuseLastLocation: false });
        if (!handle || activeFile() !== file) return;
        if (!await waitForFileAttachments(file)) {
          updateStatus("Could not prepare a copy");
          return;
        }

        const savedText = file.text;
        try {
          await writeText(handle, serializeFile(file));
        } catch {
          updateStatus("Could not save a copy");
          return;
        }

        cancelAutoSave(file);
        file.handle = handle;
        file.name = handle.name;
        file.needsPermission = false;
        if (file.text === savedText) file.dirty = false;
        session.lastOpenHandle = handle;
        const workspaceLocation = await workspaceLocationForHandle(handle);
        file.workspaceId = workspaceLocation?.workspace.id || null;
        file.workspacePath = workspaceLocation?.node.path || null;
        syncSidebarFileAvailability(file);
        syncWorkspaceSearchText(file);
        renderFiles();
        updateStatus(file.dirty ? "Copy saved; newer changes not saved" : `Saved a copy as ${file.name}`);
        scheduleSessionSave();
        if (file.dirty) scheduleAutoSave(file);
      }

      async function openLocalFile() {
        if (typeof window.showOpenFilePicker !== "function") {
          updateStatus("Opening local files requires Chrome");
          return;
        }

        let handle;
        try {
          [handle] = await window.showOpenFilePicker(markdownPickerOptions({ multiple: false }));
        } catch (error) {
          if (error?.name === "AbortError") updateStatus();
          else updateStatus("Could not choose file");
          return;
        }

        for (const file of session.files) {
          if (!file.handle || typeof file.handle.isSameEntry !== "function") continue;
          try {
            if (await file.handle.isSameEntry(handle)) {
              captureEditorValue();
              activateFile(file, "File is already open");
              return;
            }
          } catch {}
        }

        captureEditorValue();
        updateStatus("Opening Markdown file…");
        try {
          const file = await handle.getFile();
          const parsed = parseStoredMarkdown(await file.text());
          const workspaceLocation = await workspaceLocationForHandle(handle);
          activateFile({
            id: createId(), name: file.name, text: parsed.text, handle,
            attachments: parsed.attachments, builtin: false, dirty: false,
            needsPermission: false,
            workspaceId: workspaceLocation?.workspace.id || null,
            workspacePath: workspaceLocation?.node.path || null
          }, parsed.warning || "Opened local file");
        } catch {
          updateStatus("Could not open file");
        }
      }

      async function workspaceLocationForHandle(handle) {
        if (!handle || typeof handle.isSameEntry !== "function") return null;
        for (const workspace of session.workspaces) {
          if (typeof workspace.handle.resolve === "function") {
            try {
              const parts = await workspace.handle.resolve(handle);
              if (Array.isArray(parts) && parts.length) {
                const node = await workspaceNodeAtPath(workspace, parts);
                if (node?.kind === "file") {
                  revealWorkspacePath(workspace, node.path);
                  await hydrateExpandedWorkspaceDirectory(workspace);
                  return { workspace, node };
                }
              }
            } catch {}
          }
          for (const node of workspaceFileNodes(workspace)) {
            try {
              if (await node.handle.isSameEntry(handle)) {
                revealWorkspacePath(workspace, node.path);
                return { workspace, node };
              }
            } catch {}
          }
        }
        return null;
      }

      async function openWorkspaceFile(workspace, node, { closeMobileSidebar = true } = {}) {
        if (!workspace || !node || node.kind !== "file") return null;
        let file = openFileForWorkspaceNode(workspace, node);
        if (!file) {
          for (const candidate of session.files) {
            if (!candidate.handle || typeof candidate.handle.isSameEntry !== "function") continue;
            try {
              if (await candidate.handle.isSameEntry(node.handle)) {
                file = candidate;
                file.workspaceId = workspace.id;
                file.workspacePath = node.path;
                syncSidebarFileAvailability(file);
                break;
              }
            } catch {}
          }
        }

        if (!file) {
          updateStatus(`Opening ${node.name}…`);
          try {
            const diskFile = await node.handle.getFile();
            const parsed = parseStoredMarkdown(await diskFile.text());
            node.searchText = parsed.text;
            node.searchError = false;
            file = {
              id: createId(),
              name: diskFile.name,
              text: parsed.text,
              handle: node.handle,
              attachments: parsed.attachments,
              builtin: false,
              dirty: false,
              needsPermission: false,
              workspaceId: workspace.id,
              workspacePath: node.path
            };
            activateFile(file, parsed.warning || "Opened workspace file");
          } catch (error) {
            if (["NotAllowedError", "SecurityError"].includes(error?.name)) {
              workspace.needsPermission = true;
              renderFiles();
              updateStatus("Reconnect the folder to open this file");
            } else {
              updateStatus("Could not open workspace file");
            }
            return null;
          }
        } else if (file.id !== session.activeId) {
          captureEditorValue();
          activateFile(file);
        } else {
          renderFiles();
          updateStatus();
        }

        scheduleSessionSave();
        if (closeMobileSidebar && mobileSidebarQuery.matches) setSidebarOpen(false);
        return file;
      }

      function toggleFavorite(target) {
        const key = favoriteKeyForTarget(target);
        if (!key) return;
        const adding = !session.favoriteKeys.has(key);

        updateStatus(adding

      async function requestedMarkdownName(currentName) {
        const requested = await requestFileDialog("rename", currentName);
        if (requested === null) return null;
        let name = requested.trim();
        if (!name) {
          updateStatus("A file name is required");
          return null;
        }
        if (/[\\/]/.test(name) || name === "." || name === "..") {
          updateStatus("File names cannot contain slashes");
          return null;
        }
        if (!/\.[^.]+$/.test(name)) {
          name += currentName.match(/\.(?:md|markdown)$/i)?.[0] || ".md";
        }
        if (!markdownFilePattern.test(name)) {
          updateStatus("Use a .md or .markdown file name");
          return null;
        }
        return name;
      }

      function workspaceParentDirectory(workspace, node) {
        const parts = node.path.split("/");
        parts.pop();
        return workspace.nodesByPath.get(parts.join("/")) || null;
      }

      async function ensureWorkspaceWriteAccess(workspace) {
        try {
          const permission = typeof workspace.handle.requestPermission === "function"
            ? await workspace.handle.requestPermission({ mode: "readwrite" })
            : "granted";
          if (permission !== "granted") {
            workspace.needsPermission = true;
            renderFiles();
            updateStatus("Folder access was not granted");
            return false;
          }
          markWorkspaceAccessRestored(workspace);
          return true;
        } catch {
          updateStatus("Could not access the folder");
          return false;
        }
      }

      async function workspaceNameIsAvailable(parent, currentName, nextName) {
        if (currentName === nextName) return false;
        try {
          await parent.handle.getFileHandle(nextName);
          updateStatus(`A file named ${nextName} already exists`);
          return false;
        } catch (error) {
          if (error?.name === "NotFoundError") return true;
          updateStatus("Could not check the new file name");
          return false;
        }
      }

      async function renameWorkspaceFile(workspace, node, openFile, nextName) {
        const parent = workspaceParentDirectory(workspace, node);
        if (!parent || !await ensureWorkspaceWriteAccess(workspace)
            || !await workspaceNameIsAvailable(parent, node.name, nextName)) return;

        if (openFile) {
          if (activeFile() === openFile) captureEditorValue();
          cancelAutoSave(openFile);
          if (activeSaves.has(openFile.id) && !await activeSaves.get(openFile.id)) {
            if (openFile.dirty) scheduleAutoSave(openFile);
            updateStatus("Could not finish saving before rename");
            return;
          }
          if (!await waitForFileAttachments(openFile)) {
            if (openFile.dirty) scheduleAutoSave(openFile);
            updateStatus("Could not prepare the file for rename");
            return;
          }
        }

        updateStatus(`Renaming ${node.name}…`);
        let nextHandle = null;
        const textBeforeWrite = openFile?.text;
        try {
          nextHandle = await parent.handle.getFileHandle(nextName, { create: true });
          const writable = await nextHandle.createWritable();
          await writable.write(openFile ? serializeFile(openFile) : await node.handle.getFile());
          await writable.close();
          await parent.handle.removeEntry(node.name);
        } catch {
          if (nextHandle) {
            try { await parent.handle.removeEntry(nextName); } catch {}
          }
          if (openFile?.dirty) scheduleAutoSave(openFile);
          updateStatus(`Could not rename ${node.name}`);
          return;
        }

        const oldPath = node.path;
        const parentPath = parent.path;
        const nextPath = parentPath ? `${parentPath}/${nextName}` : nextName;
        const oldFavoriteKey = workspaceFavoriteKey(workspace, node);
        workspace.nodesByPath.delete(oldPath);
        node.name = nextName;
        node.path = nextPath;
        node.handle = nextHandle;
        workspace.nodesByPath.set(nextPath, node);
        parent.children?.sort(compareDirectoryEntries);
        if (session.favoriteKeys.delete(oldFavoriteKey)) {
          session.favoriteKeys.add(workspaceFavoriteKey(workspace, node));
        }
        if (openFile) {
          openFile.name = nextName;
          openFile.handle = nextHandle;
          openFile.workspacePath = nextPath;
          openFile.needsPermission = false;
          if (openFile.text === textBeforeWrite) openFile.dirty = false;
          else scheduleAutoSave(openFile);
        }
        revealWorkspacePath(workspace, nextPath);
        workspace.searchIndexed = false;
        workspace.indexGeneration += 1;
        renderFiles();
        updateStatus(`Renamed to ${nextName}`);
        scheduleSessionSave();
      }

      async function renameFileTarget(target) {
        const location = workspaceLocationForTarget(target);
        const file = target.file || (location
          ? openFileForWorkspaceNode(location.workspace, location.node) : null);
        const currentName = location?.node.name || file?.name;
        if (!currentName) return;
        const nextName = await requestedMarkdownName(currentName);
        if (!nextName || nextName === currentName) return;
        if (location) {
          await renameWorkspaceFile(location.workspace, location.node, file, nextName);
          return;
        }
        if (!file.handle) {
          file.name = nextName;
          renderFiles();
          updateStatus(`Renamed to ${nextName}`);
          scheduleSessionSave();
          return;
        }
        try {
          await file.handle.move(nextName);
          file.name = file.handle.name || nextName;
          renderFiles();
          updateStatus(`Renamed to ${file.name}`);
          scheduleSessionSave();
        } catch {
          updateStatus("Open the containing folder to rename this file");
        }
      }

      function removeSessionFile(file) {
        if (!file) return;
        const wasActive = file.id === session.activeId;
        cancelAutoSave(file);
        releaseAttachmentPreviews(file.id);
        removeFileFromSidebarLayout(file.id);
        session.files = session.files.filter(candidate => candidate !== file && !candidate.welcome);
        session.favoriteKeys.delete(`file:${file.id}`);
        if (!wasActive) return;
        let next = session.files.find(candidate => !candidate.builtin) || session.files[0];
        if (!next) {
          session.files.push(welcome);
          next = welcome;

        activateFile(next);

      async function deleteFileTarget(target) {
        const location = workspaceLocationForTarget(target);
        const file = target.file || (location
          ? openFileForWorkspaceNode(location.workspace, location.node) : null);
        const name = location?.node.name || file?.name;
        if (!name) return;
        if (!await requestFileDialog("delete", name, { dirty: file?.dirty })) {
          updateStatus("Delete cancelled");
          return;
        }

        if (location) {
          const { workspace, node } = location;
          const parent = workspaceParentDirectory(workspace, node);
          if (!parent || !await ensureWorkspaceWriteAccess(workspace)) return;
          updateStatus(`Deleting ${name}…`);
          try {
            await parent.handle.removeEntry(node.name);
            parent.children = parent.children?.filter(child => child !== node) || parent.children;
            workspace.nodesByPath.delete(node.path);
            session.favoriteKeys.delete(workspaceFavoriteKey(workspace, node));
            workspace.searchIndexed = false;
            workspace.indexGeneration += 1;
            removeSessionFile(file);
            renderFiles();
            updateStatus(`Deleted ${name}`);
            scheduleSessionSave();
          } catch {
            updateStatus(`Could not delete ${name}`);
          }
          return;
        }

        if (file.handle) {
          updateStatus(`Deleting ${name}…`);
          try {
            await file.handle.remove();
          } catch {
            updateStatus("Open the containing folder to delete this file");
            return;
          }
        }
        removeSessionFile(file);
        renderFiles();
        updateStatus(`Deleted ${name}`);
        scheduleSessionSave();
      }

      async function openLocalFolder() {
        if (typeof window.showDirectoryPicker !== "function") {

        let handle;

              scheduleSessionSave();

        captureEditorValue();
        const workspace = createWorkspace({ name: handle.name, handle });
        session.workspaces.push(workspace);
        renderFiles();
        updateStatus(`Opening ${workspace.name}…`);
        await loadWorkspaceDirectory(workspace, workspace.root);
        renderFiles();
        updateStatus(workspace.root.error

        scheduleSessionSave();

        renderFiles();
        scheduleSessionSave();
      });
      openFileButton.addEventListener("click", () => {
        closeFileContextMenu();
        closeSectionContextMenu();
        setNewMenuOpen(false);
        setThemeMenuOpen(false);
        void openLocalFile();
      });
      document.querySelector("#LocalMarkdown-save-file").addEventListener("click", saveActiveFile);
      saveCopyButton.addEventListener("click", saveActiveFileCopy);
      for (const button of viewButtons) {
        button.addEventListener("click", () => switchEditorMode(button.dataset.mode));
      }
      for (const tools of tableEdgeTools) {
        tools.addEventListener("pointerdown", event => event.preventDefault());
        tools.addEventListener("keydown", event => {
          if (event.key !== "Escape") return;
          event.preventDefault();
          hideTableEdgeTools();
          editor.focus();
        });
      }
      for (const button of tableToolButtons) {
        button.addEventListener("click", () => runTableAction(button.dataset.tableAction));
      }
      tableResizeHandle.addEventListener("pointerdown", startTableResize);
      for (const button of imageAlignButtons) {
        button.addEventListener("pointerdown", event => event.preventDefault());
        button.addEventListener("click", () => {
          const image = selectedImage;
          const alignment = button.dataset.imageAlign;
          if (!image || imageAlignment(image) === alignment) return;
          if (!commitImageAlignment(image, alignment)) {
            updateStatus("Could not align this image");
          }
        });
      }
      for (const handle of imageResizeHandles) {
        handle.addEventListener("pointerdown", startImageResize);
        handle.addEventListener("pointermove", continueImageResize);
        handle.addEventListener("pointerup", event => finishImageResize(event));
        handle.addEventListener("pointercancel", event => finishImageResize(event, false));
      }
      editorElement.addEventListener("beforeinput", rememberIrScrollPosition, true);
      editorElement.addEventListener("input", () => {
        restoreIrScrollPosition();
        hideTableEdgeTools();
        hideTableResizeHandle();
        hideImageResizer();
        scheduleTableWidths();
      });
      editorElement.addEventListener("keydown", handleEditorViewShortcut, true);
      editorElement.addEventListener("keydown", handleEditorKeydown, true);
      editorElement.addEventListener("click", handleTaskCheckboxClick, true);
      editorElement.addEventListener("paste", event => void pasteFormattedLink(event), true);
      editorElement.addEventListener("pointerover", event => {
        const image = editableImageFromNode(event.target);
        if (image && image !== selectedImage && !imageResizeSession) showImageResizer(image);
      }, true);
      editorElement.addEventListener("pointerout", event => {
        const image = editableImageFromNode(event.target);
        if (!image || image !== selectedImage) return;
        if (imageResizer.contains(event.relatedTarget)) return;
        hideImageResizerAfterHover();
      }, true);
      imageResizer.addEventListener("pointerleave", hideImageResizerAfterHover);
      editorElement.addEventListener("pointerdown", event => {
        if (event.button !== 0) return;
        const image = editableImageFromNode(event.target);
        if (image) showImageResizer(image, true);
      }, true);
      editorElement.addEventListener("click", event => {
        const image = editableImageFromNode(event.target);
        if (!image?.closest("a") || event.metaKey || event.ctrlKey || event.shiftKey) return;
        event.preventDefault();
      }, true);
      editorElement.addEventListener("click", event => {
        const image = editableImageFromNode(event.target);
        if (!image || event.metaKey || event.ctrlKey || event.shiftKey) return;
        event.preventDefault();
        if (image.classList.contains("LocalMarkdown-excalidraw-image")) {
          clearTimeout(imagePreviewTimer);
          imagePreviewTimer = setTimeout(() => openImagePreview(image), 220);
          return;
        }
        openImagePreview(image);
      }, true);
      editorElement.addEventListener("click", event => {
        if (!excalidrawAttachmentFromEvent(event)) return;
        event.preventDefault();
        event.stopImmediatePropagation();
      }, true);
      editorElement.addEventListener("dblclick", event => {
        const attachment = excalidrawAttachmentFromEvent(event);
        if (!attachment) return;
        clearTimeout(imagePreviewTimer);
        imagePreviewTimer = null;
        event.preventDefault();
        event.stopImmediatePropagation();
        void openDrawingDialog(attachment.id);
      }, true);
      drawingCancelButton.addEventListener("click", () => closeDrawingDialog());
      drawingSaveButton.addEventListener("click", () => void commitDrawing());
      drawingDialog.addEventListener("cancel", event => {
        event.preventDefault();
        closeDrawingDialog();
      });
      imagePreviewClose.addEventListener("click", closeImagePreview);
      imagePreviewDialog.addEventListener("click", event => {
        if (event.target === imagePreviewDialog) closeImagePreview();
      });
      imagePreviewDialog.addEventListener("cancel", event => {
        event.preventDefault();
        closeImagePreview();
      });

      closeButton.addEventListener("click", async () => {
        captureEditorValue();
        const file = activeFile();
        if (file.builtin || file.welcome) return;
        if (!file.builtin && file.dirty) {
          cancelAutoSave(file);
          if (file.handle) {
            updateStatus("Saving…");
            await saveFile(file);
          }
        }
        if (!file.builtin && file.dirty && !confirm(`Close “${file.name}” without saving?`)) {
          scheduleAutoSave(file);
          updateStatus();
          return;
        }

        cancelAutoSave(file);
        releaseAttachmentPreviews(file.id);
        syncWorkspaceSearchText(file, { invalidate: file.dirty });
        removeFileFromSidebarLayout(file.id);
        session.files = session.files.filter(item => item !== file && !item.welcome);
        session.favoriteKeys.delete(`file:${file.id}`);
        let next = session.files.find(item => !item.builtin) || session.files[0];
        if (!next) {
          session.files.push(welcome);
          next = welcome;
        }
        activateFile(next);
      });

      addEventListener("beforeunload", event => {
        captureEditorValue();
        void persistSessionNow();
        if (!session.files.some(file => !file.builtin && file.dirty)) return;
        event.preventDefault();
        event.returnValue = "";
      });

      addEventListener("pagehide", () => {
        captureEditorValue();
        void persistSessionNow();
      });

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState !== "hidden") return;
        captureEditorValue();
        void persistSessionNow();
      });

      await restoreSession();
      renderFiles();
      updateStatus();

      const toolbarIconPaths = {
        emoji: '<circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/>',
        headings: '<path d="M6 4v16M18 4v16M6 12h12"/>',
        bold: '<path d="M6 4h8a4 4 0 0 1 0 8H6zM6 12h9a4 4 0 0 1 0 8H6z"/>',
        italic: '<path d="M19 4h-9M14 20H5M15 4 9 20"/>',
        strike: '<path d="M16 4H9a3 3 0 0 0-2.83 4M14 12a4 4 0 0 1 0 8H6M4 12h16"/>',
        link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
        list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
        "ordered-list": '<path d="M10 6h11M10 12h11M10 18h11M4 6h1v4M4 10h2M6 18H4c0-1 2-2 2-3s-.75-1.5-2-1.5"/>',
        check: '<path d="M10 6h11M10 12h11M10 18h11M3 6l1 1 2-2M3 12l1 1 2-2M3 18l1 1 2-2"/>',
        outdent: '<path d="M3 5h18M10 12h11M10 19h11M3 12l4-3v6Z"/>',
        indent: '<path d="M3 5h18M10 12h11M10 19h11M7 12l-4-3v6Z"/>',
        quote: '<path d="M3 21c3 0 7-1 7-8V5a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h3c0 3-1 4-4 4v4ZM14 21c3 0 7-1 7-8V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h3c0 3-1 4-4 4v4Z"/>',
        line: '<path d="M5 12h14"/>',
        code: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="m10 8-4 4 4 4M14 8l4 4-4 4"/>',
        "inline-code": '<path d="m8 9-3 3 3 3M16 9l3 3-3 3M14 5l-4 14"/>',
        "insert-before": '<path d="M5 4h14M12 20V8M7 13l5-5 5 5"/>',
        "insert-after": '<path d="M5 20h14M12 4v12M7 11l5 5 5-5"/>',
        upload: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21M16 3v6M13 6h6"/>',
        table: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>',
        draw: '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/>',
        undo: '<path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-2"/>',
        redo: '<path d="m15 14 5-5-5-5M20 9H10a6 6 0 0 0 0 12h2"/>',
        fullscreen: '<path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>',
        outline: '<path d="M3 5h18M3 12h12M3 19h8M17 16l4 3-4 3"/>',
        export: '<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>'
      };

      function toolbarIcon(name) {
        const paths = toolbarIconPaths[name];
        if (!paths) return "";
        return `<svg class="LocalMarkdown-toolbar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${paths}</svg>`;
      }

      const toolbarTips = {
        "ordered-list": "Numbered list",
        line: "Horizontal rule",
        upload: "Insert image"
      };

      function toolbarControl(name, tipPosition = "n") {
        return {
          name,
          tipPosition,
          icon: toolbarIcon(name),
          ...(toolbarTips[name] ? { tip: toolbarTips[name] } : {})
        };
      }

      function drawingToolbarControl() {
        return {
          name: "draw",
          tip: "Draw with Excalidraw",
          tipPosition: "n",
          icon: toolbarIcon("draw"),
          click() {
            void openDrawingDialog();
          }
        };
      }

      const emojiMap = {
        red_circle: "🔴", orange_circle: "🟠", yellow_circle: "🟡", green_circle: "🟢",
        check_mark: "✅", warning: "⚠️", x: "❌", exclamation: "❗",
        "+1": "👍", fire: "🔥", target: "🎯", pin: "📌",
        tada: "🎉", bulb: "💡", eyes: "👀", thinking: "🤔",
        smile: "😄", grin: "😁", joy: "😂", rofl: "🤣", relaxed: "☺️",
        blush: "😊", slightly_smiling_face: "🙂", upside_down_face: "🙃",
        wink: "😉", heart_eyes: "😍", star_struck: "🤩", kissing_heart: "😘",
        yum: "😋", stuck_out_tongue: "😛", zany_face: "🤪",
        raised_eyebrow: "🤨", neutral_face: "😐", expressionless: "😑",
        unamused: "😒", roll_eyes: "🙄", grimacing: "😬", relieved: "😌",
        pensive: "😔", sleepy: "😪", sleeping: "😴", drooling_face: "🤤",
        mask: "😷", thermometer_face: "🤒", hot_face: "🥵", cold_face: "🥶",
        sunglasses: "😎", nerd_face: "🤓", monocle_face: "🧐", confused: "😕",
        worried: "😟", frowning: "☹️", open_mouth: "😮", flushed: "😳",
        pleading_face: "🥺", cry: "😢", sob: "😭", scream: "😱",
        angry: "😠", rage: "😡", exploding_head: "🤯", party_face: "🥳",
        heart: "❤️", orange_heart: "🧡", yellow_heart: "💛", green_heart: "💚",
        blue_heart: "💙", purple_heart: "💜", broken_heart: "💔", sparkles: "✨",
        hundred: "💯", confetti_ball: "🎊", "-1": "👎", ok_hand: "👌",
        victory_hand: "✌️",
        crossed_fingers: "🤞", love_you_gesture: "🤟", call_me_hand: "🤙",
        clap: "👏", raised_hands: "🙌", open_hands: "👐", palms_up: "🤲",
        handshake: "🤝", pray: "🙏", muscle: "💪", wave: "👋",
        point_up: "☝️", point_right: "👉", point_left: "👈", point_down: "👇",
        brain: "🧠", speech_balloon: "💬", thought_balloon: "💭", question: "❓",
        link: "🔗",
        memo: "📝", books: "📚", calendar: "📅", chart_up: "📈",
        chart_down: "📉", trophy: "🏆", medal: "🏅",
        gift: "🎁", bell: "🔔", lock: "🔒", unlock: "🔓",
        key: "🔑", gear: "⚙️", hammer_and_wrench: "🛠️", magnifying_glass: "🔍",
        laptop: "💻", phone: "📱", camera: "📷", hourglass: "⏳",
        coffee: "☕", pizza: "🍕", cake: "🎂", seedling: "🌱",
        sun: "☀️", moon: "🌙", star: "⭐", rainbow: "🌈", earth: "🌍",
        rocket: "🚀", airplane: "✈️", car: "🚗", house: "🏠"
      };

      editor = new Vditor("LocalMarkdown-editor", {
        cdn: vditorCdn,
        mode: "ir",
        value: activeFile().text,
        height: "100%",
        minHeight: 200,
        hint: { emoji: emojiMap },
        toolbar: [
          toolbarControl("emoji", "ne"), toolbarControl("headings", "ne"),
          toolbarControl("bold", "ne"), toolbarControl("italic", "ne"),
          toolbarControl("strike", "ne"), toolbarControl("link"), "|",
          toolbarControl("list"), toolbarControl("ordered-list"), toolbarControl("check"),
          toolbarControl("outdent"), toolbarControl("indent"), "|",
          toolbarControl("quote"), toolbarControl("line"), toolbarControl("code"),
          toolbarControl("inline-code"), toolbarControl("insert-before"),
          toolbarControl("insert-after"), "|", toolbarControl("upload"),
          toolbarControl("table"), drawingToolbarControl(), "|",
          toolbarControl("undo", "nw"), toolbarControl("redo", "nw"), "|",
          toolbarControl("fullscreen", "nw"),
          toolbarControl("outline", "nw"), toolbarControl("export", "nw"),
          { name: "edit-mode", className: "LocalMarkdown-internal-edit-mode" }
        ],
        customWysiwygToolbar() {},
        cache: { enable: false },
        counter: { enable: false },
        outline: { enable: false, position: "right" },
        preview: {
          actions: ["desktop", "tablet", "mobile"],
          theme: {
            current: document.documentElement.dataset.theme === "solarized-dark" ? "dark" : "light"
          },
          hljs: {
            style: document.documentElement.dataset.theme === "white"
              ? "github"
              : `base16/${document.documentElement.dataset.theme}`
          }
        },
        resize: { enable: false },
        upload: {
          multiple: true,
          handler: pasteEmbeddedImages
        },
        theme: "classic",
        lang: "en_US",
        placeholder: "Write Markdown…",
        input(value) {
          const file = activeFile();
          const canonical = canonicalEditorText(value, file);
          if (canonical === file.text) return;
          file.text = canonical;
          if (!file.builtin) {
            file.dirty = true;
            scheduleAutoSave(file);
            scheduleSessionSave();
          }
          renderFiles();
          updateStatus();
          scheduleAttachmentPreviews();
          scheduleTableWidths();
        },
        after() {
          editorReady = true;
          setTheme(document.documentElement.dataset.theme, { persist: false });
          for (const button of viewButtons) button.disabled = false;
          updateViewButtons(editor.getCurrentMode());
          observeAttachmentPreviews();
          setEditorValue(activeFile());
          updateStatus();
          scheduleAttachmentPreviews();
          scheduleTableWidths();
        }
      });

      addEventListener("unload", () => {
        attachmentPreviewObserver?.disconnect();
        cancelAnimationFrame(irScrollRestoreFrame);
        clearTimeout(tableWidthRefreshTimer);
        releaseAttachmentPreviews();
        imageWorker?.terminate();
        if (imageWorkerUrl) URL.revokeObjectURL(imageWorkerUrl);
      });
    })();
  </script>
</body>
