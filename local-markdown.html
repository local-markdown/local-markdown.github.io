          editor.setTheme(dark ? "dark" : "classic", dark ? "dark" : "light", codeTheme);

      function fileContextActionAvailable(action, target) {
        const file = target?.file;
        if (action === "save") return Boolean(file
          && (!file.handle || file.needsPermission || file.dirty));
        if (action === "save-as") return Boolean(file?.handle && file.needsPermission);
        if (action === "close") return Boolean(file);
        if (action === "rename") {
          return Boolean(file && (!file.handle || typeof file.handle.move === "function"));
        }
        if (action === "delete") {
          return Boolean(file && (!file.handle || typeof file.handle.remove === "function"));
        }
        return false;

        sectionContextTrigger = null;
      }

      function openFileContextMenu(event, target, trigger) {
        setNewMenuOpen(false);
        setThemeMenuOpen(false);
        closeSectionContextMenu();
        fileContextTarget = target;
        fileContextTrigger = trigger;
        const file = target?.file;
        const needsReconnect = Boolean(file?.handle && file.needsPermission);
        fileSaveLabel.textContent = needsReconnect
          ? "Reconnect"
          : (file?.handle ? "Save" : "Save…");
        fileSaveAsItem.hidden = !needsReconnect;
        for (const item of fileContextItems) {
          if (item.hidden) continue;
          item.disabled = !fileContextActionAvailable(item.dataset.action, target);

        fileContextMenu.hidden = false;
        const triggerBounds = trigger.getBoundingClientRect();
        const menuBounds = fileContextMenu.getBoundingClientRect();
        const requestedLeft = event.clientX || triggerBounds.left + 12;
        const requestedTop = event.clientY || triggerBounds.top + triggerBounds.height;
        fileContextMenu.style.left = `${Math.max(6, Math.min(requestedLeft, innerWidth - menuBounds.width - 6))}px`;
        fileContextMenu.style.top = `${Math.max(6, Math.min(requestedTop, innerHeight - menuBounds.height - 6))}px`;
        fileContextItems.find(item => !item.hidden && !item.disabled)?.focus();
      }

      function openSectionContextMenu(event, section, trigger) {
        setNewMenuOpen(false);
        setThemeMenuOpen(false);
        closeFileContextMenu();
        sectionContextTarget = section;
        sectionContextTrigger = trigger;
        for (const item of sectionContextItems) {

          startOffset: range.startOffset,

        const ungroupedFileIds = [];
        for (const fileId of session.sidebar.ungroupedFileIds) {
          if (!eligibleIds.has(fileId) || seenFileIds.has(fileId)) {
            changed = true;
            continue;
          }
          seenFileIds.add(fileId);
          ungroupedFileIds.push(fileId);
        }
        for (const file of session.files) {
          if (!eligibleIds.has(file.id) || seenFileIds.has(file.id)) continue;
          seenFileIds.add(file.id);
          ungroupedFileIds.push(file.id);
          changed = true;
        }
        session.sidebar = {
          sections,
          ungroupedFileIds
        };
        return changed;
      }

      function sidebarFiles(fileIds) {
        const filesById = new Map(session.files.map(file => [file.id, file]));
        return fileIds.map(id => filesById.get(id)).filter(Boolean);
      }

      async function createSection() {
        const name = await requestFileDialog("create-section", "");
        if (name === null) return;
        const section = { id: createId(), name: name.trim(), collapsed: false, fileIds: [] };
        session.sidebar.sections.push(section);
        renderFiles();
        updateStatus(`Created section ${section.name}`);
        scheduleSessionSave();
      }

      async function renameSection(section) {
        if (!sectionForId(section.id)) return;
        const name = await requestFileDialog("rename-section", section.name, { sectionId: section.id });
        const current = sectionForId(section.id);
        if (!current) return;
        if (name === null || name.trim() === current.name) return;
        current.name = name.trim();
        renderFiles();
        updateStatus(`Renamed section to ${current.name}`);
        scheduleSessionSave();
      }

      function deleteSection(sectionId) {
        const section = sectionForId(sectionId);
        if (!section) return false;
        if (section.fileIds.length) {
          updateStatus("Move or close all files before deleting this section");
          return false;
        }
        session.sidebar.sections = session.sidebar.sections.filter(item => item !== section);
        renderFiles();
        updateStatus(`Deleted section ${section.name}`);
        scheduleSessionSave();
        return true;
      }

      function moveSectionRelative(sectionId, targetId, placeAfter) {
        if (sectionId === targetId) return;
        const sections = session.sidebar.sections;
        const index = sections.findIndex(section => section.id === sectionId);
        if (index < 0) return;
        const [section] = sections.splice(index, 1);
        const targetIndex = sections.findIndex(candidate => candidate.id === targetId);
        if (targetIndex < 0) sections.push(section);
        else sections.splice(targetIndex + (placeAfter ? 1 : 0), 0, section);
        renderFiles();
        scheduleSessionSave();
      }

      function moveFileToSection(fileId, sectionId, targetFileId = null, placeAfter = true) {
        const file = session.files.find(candidate => candidate.id === fileId);
        const section = sectionId ? sectionForId(sectionId) : null;
        if (!isStandaloneSidebarFile(file) || (sectionId && !section)) return;
        removeFileFromSidebarLayout(fileId);
        const fileIds = section ? section.fileIds : session.sidebar.ungroupedFileIds;
        const targetIndex = targetFileId ? fileIds.indexOf(targetFileId) : -1;
        if (targetIndex < 0) fileIds.push(fileId);
        else fileIds.splice(targetIndex + (placeAfter ? 1 : 0), 0, fileId);
        renderFiles();
        scheduleSessionSave();
      }

      function targetName(target) {
        return target?.file?.name || "file";
      }

      function openSessionDatabase() {
        if (!sessionDatabasePromise) {
          sessionDatabasePromise = new Promise((resolve, reject) => {
            if (typeof indexedDB === "undefined") {
              reject(new Error("Browser storage is unavailable"));
              return;
            }

            const request = indexedDB.open(sessionDatabaseName, 1);
            request.addEventListener("upgradeneeded", () => {
              if (!request.result.objectStoreNames.contains(sessionStoreName)) {
                request.result.createObjectStore(sessionStoreName);
              }
            });
            request.addEventListener("success", () => {
              const database = request.result;
              database.addEventListener("versionchange", () => database.close());
              resolve(database);
            });
            request.addEventListener("error", () => reject(request.error));
            request.addEventListener("blocked", () => reject(new Error("Browser storage is blocked")));
          });
        }
        return sessionDatabasePromise;
      }

      async function readStoredSession() {
        const database = await openSessionDatabase();
        return new Promise((resolve, reject) => {
          const transaction = database.transaction(sessionStoreName, "readonly");
          const request = transaction.objectStore(sessionStoreName).get(sessionStorageKey);
          request.addEventListener("success", () => resolve(request.result || null));
          request.addEventListener("error", () => reject(request.error));
          transaction.addEventListener("abort", () => reject(transaction.error));
        });
      }

      async function writeStoredSession(snapshot) {
        const database = await openSessionDatabase();
        return new Promise((resolve, reject) => {
          const transaction = database.transaction(sessionStoreName, "readwrite");
          transaction.objectStore(sessionStoreName).put(snapshot, sessionStorageKey);
          transaction.addEventListener("complete", resolve);
          transaction.addEventListener("abort", () => reject(transaction.error));
          transaction.addEventListener("error", () => reject(transaction.error));
        });
      }

      function storedAttachments(file) {
        const referenced = referencedAttachmentIds(file.text);
        return Array.from(file.attachments.values())
          .filter(attachment => referenced.has(attachment.id) && attachment.data)
          .map(attachment => ({
            id: attachment.id,
            type: attachment.type,
            data: attachment.data,
            ...(attachment.kind === "excalidraw" ? { kind: "excalidraw" } : {})
          }));
      }

      function sessionSnapshot() {
        return {
          version: 2,
          activeId: session.activeId,
          lastOpenHandle: session.lastOpenHandle,
          sidebar: {
            sections: session.sidebar.sections.map(section => ({
              id: section.id,
              name: section.name,
              collapsed: section.collapsed,
              fileIds: [...section.fileIds]
            })),
            ungroupedFileIds: [...session.sidebar.ungroupedFileIds]
          },
          fileOrder: session.files
            .filter(file => !file.welcome)
            .map(file => file.id),
          files: session.files
            .filter(file => !file.builtin && !file.welcome)
            .map(file => ({
              id: file.id,
              name: file.name,
              text: file.text,
              handle: file.handle || null,
              dirty: Boolean(file.dirty),
              attachments: storedAttachments(file)
            }))
        };
      }

      function persistSessionNow() {
        if (!sessionRestored || !sessionNeedsSave) return sessionWritePromise;
        clearTimeout(sessionSaveTimer);
        sessionSaveTimer = null;
        const snapshot = sessionSnapshot();
        sessionNeedsSave = false;
        sessionWritePromise = sessionWritePromise
          .catch(() => {})
          .then(() => writeStoredSession(snapshot))
          .catch(() => {
            sessionNeedsSave = true;
            console.warn("Local Markdown could not use browser session storage.");
          });
        return sessionWritePromise;
      }

      function scheduleSessionSave() {
        if (!sessionRestored) return;
        sessionNeedsSave = true;
        clearTimeout(sessionSaveTimer);
        sessionSaveTimer = setTimeout(persistSessionNow, sessionSaveDelay);
      }

      function restoredAttachments(items) {
        const attachments = new Map();
        for (const item of Array.isArray(items) ? items : []) {
          if (!item || typeof item.id !== "string"
              || typeof item.type !== "string" || !item.type.startsWith("image/")
              || typeof item.data !== "string") continue;
          attachments.set(item.id, {
            id: item.id,
            type: item.type,
            data: item.data,
            kind: item.kind === "excalidraw" ? "excalidraw" : null,
            blob: null,
            pending: null,
            error: false
          });
        }
        return attachments;
      }

      async function handlePermission(handle, mode) {
        if (!handle || typeof handle.queryPermission !== "function") return null;
        try {
          return await handle.queryPermission({ mode });
        } catch {
          return null;
        }
      }

      async function loadFileFromHandle(file) {
        const diskFile = await file.handle.getFile();
        const parsed = parseStoredMarkdown(await diskFile.text());
        file.name = diskFile.name;
        file.text = parsed.text;
        file.attachments = parsed.attachments;
        file.dirty = false;
        resetDocumentHistory(file);
        return parsed.warning;
      }

      async function refreshRestoredFile(file) {
        if (!file.handle) return false;
        const [readPermission, writePermission] = await Promise.all([
          handlePermission(file.handle, "read"),
          handlePermission(file.handle, "readwrite")
        ]);
        file.needsPermission = writePermission !== null && writePermission !== "granted";
        if (file.dirty || readPermission !== "granted") return false;
        try {
          await loadFileFromHandle(file);
          return true;
        } catch {
          file.needsPermission = true;
          return false;
        }
      }

      async function restoreSession() {
        let storedSession = null;
        try {
          storedSession = await readStoredSession();
        } catch {
          console.warn("Local Markdown could not use browser session storage.");
        }

        if ([1, 2].includes(storedSession?.version) && Array.isArray(storedSession.files)) {
          const restoredFiles = storedSession.files
            .filter(file => file && typeof file.id === "string"
              && typeof file.name === "string" && typeof file.text === "string")
            .map(file => ({
              id: file.id,
              name: file.name,
              text: file.text,
              handle: file.handle || null,
              attachments: restoredAttachments(file.attachments),
              builtin: false,
              dirty: Boolean(file.dirty),
              needsPermission: false
            }));

          const refreshedFiles = await Promise.all(restoredFiles.map(refreshRestoredFile));
          const availableFiles = [example, ...restoredFiles];
          const filesById = new Map(availableFiles.map(file => [file.id, file]));
          const orderedFiles = [];
          for (const id of Array.isArray(storedSession.fileOrder) ? storedSession.fileOrder : []) {
            const file = filesById.get(id);
            if (!file) continue;
            orderedFiles.push(file);
            filesById.delete(id);
          }
          session.files = [...orderedFiles, ...filesById.values()];
          if (storedSession.version === 2 && storedSession.sidebar
              && typeof storedSession.sidebar === "object") {
            session.sidebar = {
              sections: Array.isArray(storedSession.sidebar.sections)
                ? storedSession.sidebar.sections : [],
              ungroupedFileIds: Array.isArray(storedSession.sidebar.ungroupedFileIds)
                ? storedSession.sidebar.ungroupedFileIds : []
            };
          } else {
            session.sidebar = {
              sections: [],
              ungroupedFileIds: Array.isArray(storedSession.fileOrder)
                ? [...storedSession.fileOrder] : []
            };
            sessionNeedsSave = true;
          }
          if (normalizeSidebarLayout()) sessionNeedsSave = true;
          session.activeId = session.files.some(file => file.id === storedSession.activeId)
            ? storedSession.activeId
            : (restoredFiles[0]?.id || example.id);
          session.lastOpenHandle = storedSession.lastOpenHandle?.kind === "file"
            ? storedSession.lastOpenHandle
            : (activeFile()?.handle || restoredFiles.find(file => file.handle)?.handle || null);
          if (refreshedFiles.some(Boolean)) {
            sessionNeedsSave = true;
          }
        }

        sessionRestored = true;
        if (sessionNeedsSave) scheduleSessionSave();
        for (const file of session.files) {
          if (!file.builtin && file.dirty && file.handle && !file.needsPermission) {
            scheduleAutoSave(file);
          }
        }
      }

      function captureEditorValue(options = null) {
        if (!editorReady) return;
        const file = activeFile();
        const value = canonicalEditorText(editor.getValue(), file);
        if (value === file.text) {
          if (pendingEditorHistoryInput?.fileId === file.id) pendingEditorHistoryInput = null;
          return;
        }
        if (!options && pendingEditorHistoryInput?.fileId !== file.id) {
          synchronizeDocumentHistoryPresent(file, value);
          return;
        }
        const details = options || editorHistoryDetails(file);
        const before = documentSnapshot(file, { captureSelection: false });
        file.text = value;
        if (!file.builtin) {
          file.dirty = true;
          scheduleAutoSave(file);
          scheduleSessionSave();
        }
        recordDocumentMutation(file, before, details);
        if (pendingEditorHistoryInput?.fileId === file.id) pendingEditorHistoryInput = null;
      }

      function updateStatus(message = null) {
        const file = activeFile();
        const filename = file.name || (file.welcome ? "Local Markdown" : "Untitled.md");
        filenameElement.textContent = filename;
        filenameElement.title = filename;
        if (message) statusElement.textContent = message;
        else if (file.welcome) statusElement.textContent = "Open a file or view Examples";
        else if (file.builtin) statusElement.textContent = "Examples";
        else if (file.needsPermission) statusElement.textContent = "File access required";
        else if (file.dirty) statusElement.textContent = file.handle ? "Saving…" : "Not saved";
        else statusElement.textContent = "Saved";
      }

      function renderFiles() {
        filesElement.replaceChildren();
        const query = searchInput.value.trim();
        searchClear.hidden = !query;
        if (query) {
          renderSearchResults(query);
          return;
        }
        filesElement.setAttribute("aria-label", "Files");
        if (normalizeSidebarLayout()) scheduleSessionSave();
        const ungroupedFiles = sidebarFiles(session.sidebar.ungroupedFileIds);
        const exampleFile = session.files.find(file => file === example);
        const looseFiles = document.createElement("div");
        looseFiles.className = "LocalMarkdown-loose-files";
        attachFileSectionDropZone(looseFiles, null);
        if (exampleFile) appendOpenFileButton(exampleFile, null, looseFiles);
        for (const file of ungroupedFiles) appendOpenFileButton(file, null, looseFiles);
        if (looseFiles.childElementCount) filesElement.append(looseFiles);
        for (const section of session.sidebar.sections) renderTopicSection(section);
      }

      function appendActionsMenuIcon(button) {
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 20 20");
        svg.setAttribute("aria-hidden", "true");
        svg.setAttribute("focusable", "false");
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", "m5 7.5 5 5 5-5");
        svg.append(path);
        button.append(svg);
      }

      function renderTopicSection(section) {
        const container = document.createElement("div");
        container.className = "LocalMarkdown-topic-section";
        container.dataset.sectionId = section.id;

        const header = document.createElement("div");
        header.className = "LocalMarkdown-topic-header";
        header.draggable = true;
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "LocalMarkdown-topic-toggle";
        toggle.setAttribute("aria-expanded", String(!section.collapsed));
        const filesId = `LocalMarkdown-section-files-${section.id}`;
        toggle.setAttribute("aria-controls", filesId);
        toggle.title = `${section.collapsed ? "Expand" : "Collapse"} ${section.name}`;
        const name = document.createElement("span");
        name.className = "LocalMarkdown-topic-name";
        name.textContent = section.name;
        toggle.append(name);
        toggle.addEventListener("click", () => {
          section.collapsed = !section.collapsed;
          renderFiles();
          scheduleSessionSave();
        });

        const menu = document.createElement("button");
        menu.type = "button";
        menu.className = "LocalMarkdown-topic-menu-button";
        menu.setAttribute("aria-label", `Actions for section ${section.name}`);
        menu.setAttribute("aria-haspopup", "menu");
        menu.title = "Section actions";
        appendActionsMenuIcon(menu);
        menu.addEventListener("click", event => openSectionContextMenu(event, section, menu));
        header.addEventListener("contextmenu", event => {
          event.preventDefault();
          openSectionContextMenu(event, section, header);
        });
        header.append(toggle, menu);
        container.append(header);

        const sectionFiles = document.createElement("div");
        sectionFiles.className = "LocalMarkdown-topic-files";
        sectionFiles.id = filesId;
        sectionFiles.hidden = section.collapsed;
        if (!section.collapsed) {
          for (const file of sidebarFiles(section.fileIds)) {
            appendOpenFileButton(file, section.id, sectionFiles);
          }
        }
        container.append(sectionFiles);
        enableSectionReordering(header, container, section);
        attachFileSectionDropZone(container, section.id);
        filesElement.append(container);
      }

      function appendOpenFileButton(file, sectionId = null, container = filesElement) {
        const row = document.createElement("div");
        row.className = "LocalMarkdown-file-row";
        row.dataset.fileId = file.id;
        const button = document.createElement("button");
        button.type = "button";
        button.className = "LocalMarkdown-file";
        if (file === example) button.id = "LocalMarkdown-examples";
        button.dataset.fileId = file.id;
        const name = document.createElement("span");
        name.className = "LocalMarkdown-file-name";
        name.textContent = file === example
          ? "Examples"
          : file.name;
        button.append(name);
        appendUnsavedMark(button, !file.builtin && file.dirty);
        button.title = file.builtin ? "Examples" : "Drag to reorder or move to a section";
        button.setAttribute("aria-current", String(file.id === session.activeId));
        button.addEventListener("click", file === example
          ? showExamples
          : () => selectFile(file.id));
        if (!file.builtin) attachFileContextMenu(button, { file });
        row.append(button);
        if (!file.builtin) {
          const menu = document.createElement("button");
          menu.type = "button";
          menu.className = "LocalMarkdown-file-menu-button";
          menu.setAttribute("aria-label", `Actions for ${file.name}`);
          menu.setAttribute("aria-haspopup", "menu");
          menu.title = "File actions";
          appendActionsMenuIcon(menu);
          menu.addEventListener("click", event => {
            event.stopPropagation();
            openFileContextMenu(event, { file }, menu);
          });
          row.append(menu);
          enableFileReordering(button, row, file.id, sectionId);
        }
        container.append(row);
      }

      function appendUnsavedMark(element, dirty) {
        if (!dirty) return;
        const marker = document.createElement("span");
        marker.className = "LocalMarkdown-unsaved-mark";
        marker.title = "Unsaved changes";
        marker.textContent = "Unsaved";
        element.append(marker);
      }

      function normalizedSearchText(value) {
        return String(value || "").toLocaleLowerCase();
      }

      function fuzzyNameScore(name, query) {
        const normalizedName = normalizedSearchText(name);
        const normalizedQuery = normalizedSearchText(query);
        const directIndex = normalizedName.indexOf(normalizedQuery);
        if (directIndex !== -1) return directIndex;

        let nameIndex = 0;
        let gapScore = 0;
        for (const character of normalizedQuery) {
          const foundIndex = normalizedName.indexOf(character, nameIndex);
          if (foundIndex === -1) return null;
          gapScore += foundIndex - nameIndex;
          nameIndex = foundIndex + 1;
        }
        return 100 + gapScore;
      }

      function searchableFileText(file) {
        return String(file.text || "")
          .replace(/<!-- LocalMarkdown attachments:v1[\s\S]*?-->/gi, "")
          .replace(/(!?\[[^\]]*\]\()data:image\/[^)]*(\))/gi, "$1$2")
          .replace(new RegExp(`(!?\\[[^\\]]*\\]\\()(?:${attachmentPathPrefixPattern})[^)]*(\\))`, "gi"), "$1$2");
      }

      function contentSearchMatches(file, query, limit = 5) {
        const text = searchableFileText(file);
        const normalizedQuery = normalizedSearchText(query);
        const matches = [];
        let occurrence = 0;
        let hasMore = false;

        for (const [lineIndex, rawLine] of text.split("\n").entries()) {
          const normalizedLine = normalizedSearchText(rawLine);
          const firstMatchIndex = normalizedLine.indexOf(normalizedQuery);
          if (firstMatchIndex === -1) continue;

          if (matches.length >= limit) {
            hasMore = true;
            break;
          }

          const line = rawLine.trim();
          const lineMatchIndex = normalizedSearchText(line).indexOf(normalizedQuery);
          const snippetStart = Math.max(0, lineMatchIndex - 42);
          const snippetEnd = Math.min(line.length, lineMatchIndex + query.length + 58);
          matches.push({
            lineNumber: lineIndex + 1,
            occurrence,
            snippet: `${snippetStart ? "…" : ""}${line.slice(snippetStart, snippetEnd)}${snippetEnd < line.length ? "…" : ""}`
          });

          let lineFromIndex = firstMatchIndex;
          while (lineFromIndex !== -1) {
            occurrence += 1;
            lineFromIndex = normalizedLine.indexOf(
              normalizedQuery,
              lineFromIndex + Math.max(1, normalizedQuery.length)
            );
          }
        }
        return { matches, hasMore };
      }

      function appendHighlightedText(element, value, query) {
        const text = String(value || "");
        const matchIndex = normalizedSearchText(text).indexOf(normalizedSearchText(query));
        if (matchIndex === -1) {
          element.textContent = text;
          return;
        }
        element.append(document.createTextNode(text.slice(0, matchIndex)));
        const mark = document.createElement("mark");
        mark.textContent = text.slice(matchIndex, matchIndex + query.length);
        element.append(mark, document.createTextNode(text.slice(matchIndex + query.length)));
      }

      function searchCandidates() {
        const candidates = [];
        let order = 0;
        for (const file of session.files) {
          if (file.welcome) continue;
          const name = file === example ? "Examples" : file.name;
          candidates.push({
            id: file.id,
            name,
            searchName: name,
            path: name,
            text: file.text,
            file,
            order: order++
          });
        }
        return candidates;
      }

      function renderSearchResults(query) {
        filesElement.setAttribute("aria-label", `Search results for ${query}`);
        const results = searchCandidates()
          .map(candidate => {
            const contentResults = contentSearchMatches(candidate, query);
            return {
              candidate,
              nameScore: fuzzyNameScore(candidate.searchName, query),
              matches: contentResults.matches,
              hasMoreMatches: contentResults.hasMore
            };
          })
          .filter(result => result.nameScore !== null || result.matches.length)
          .sort((left, right) => {
            if (left.nameScore !== null && right.nameScore === null) return -1;
            if (left.nameScore === null && right.nameScore !== null) return 1;
            if (left.nameScore !== null && right.nameScore !== null
                && left.nameScore !== right.nameScore) return left.nameScore - right.nameScore;
            return left.candidate.order - right.candidate.order;
          });

        if (!results.length) {
          const empty = document.createElement("div");
          empty.className = "LocalMarkdown-search-empty";
          empty.textContent = "No matching files or content";
          filesElement.append(empty);
          return;
        }

        const summary = document.createElement("div");
        summary.className = "LocalMarkdown-search-summary";
        summary.textContent = `${results.length} matching ${results.length === 1 ? "file" : "files"}`;
        filesElement.append(summary);

        for (const { candidate, nameScore, matches, hasMoreMatches } of results) {
          const result = document.createElement("div");
          result.className = "LocalMarkdown-search-result";
          const contextTarget = { file: candidate.file };

          const fileButton = document.createElement("button");
          fileButton.type = "button";
          fileButton.className = "LocalMarkdown-search-file";
          fileButton.title = candidate.path;
          fileButton.setAttribute("aria-current", String(candidate.file?.id === session.activeId));
          const name = document.createElement("span");
          name.className = "LocalMarkdown-search-file-name";
          const displayName = candidate.name;
          if (nameScore !== null) appendHighlightedText(name, displayName, query);
          else name.textContent = displayName;
          fileButton.append(name);
          appendUnsavedMark(fileButton, candidate.file?.dirty);
          if (matches.length) {
            const count = document.createElement("span");
            count.className = "LocalMarkdown-search-count";
            count.textContent = hasMoreMatches ? `${matches.length}+` : String(matches.length);
            fileButton.append(count);
          }
          fileButton.addEventListener("click", () => void openSearchResult(candidate));
          if (candidate.file !== example) {
            attachFileContextMenu(fileButton, contextTarget);
          }
          result.append(fileButton);

          for (const match of matches) {
            const hit = document.createElement("button");
            hit.type = "button";
            hit.className = "LocalMarkdown-search-hit";
            hit.title = `Open ${displayName} at line ${match.lineNumber}`;
            const line = document.createElement("span");
            line.className = "LocalMarkdown-search-line";
            line.textContent = String(match.lineNumber);
            const snippet = document.createElement("span");
            snippet.className = "LocalMarkdown-search-snippet";
            appendHighlightedText(snippet, match.snippet, query);
            hit.append(line, snippet);
            hit.addEventListener("click", () => void openSearchResult(candidate, match, query));
            result.append(hit);
          }
          filesElement.append(result);
        }
      }

      function nthTextIndex(text, query, occurrence) {
        const normalizedText = normalizedSearchText(text);
        const normalizedQuery = normalizedSearchText(query);
        let fromIndex = 0;
        for (let index = 0; index <= occurrence; index += 1) {
          const matchIndex = normalizedText.indexOf(normalizedQuery, fromIndex);
          if (matchIndex === -1) return -1;
          if (index === occurrence) return matchIndex;
          fromIndex = matchIndex + Math.max(1, normalizedQuery.length);
        }
        return -1;
      }

      function revealSearchMatch(query, occurrence) {
        if (!editorReady) return false;
        const mode = editor.getCurrentMode();
        const root = editor.vditor?.[mode]?.element;
        if (!root) return false;

        const textNodes = [];
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        let node;
        let text = "";
        while ((node = walker.nextNode())) {
          textNodes.push({ node, start: text.length, end: text.length + node.data.length });
          text += node.data;
        }
        const matchIndex = nthTextIndex(text, query, occurrence);
        if (matchIndex === -1) return false;
        const matchEnd = matchIndex + query.length;
        const start = textNodes.find(item => matchIndex >= item.start && matchIndex < item.end);
        const end = textNodes.find(item => matchEnd > item.start && matchEnd <= item.end);
        if (!start || !end) return false;

        const range = document.createRange();
        range.setStart(start.node, matchIndex - start.start);
        range.setEnd(end.node, matchEnd - end.start);
        const selection = getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        root.focus({ preventScroll: true });
        start.node.parentElement?.scrollIntoView({ block: "center", behavior: "smooth" });
        return true;
      }

      async function openSearchResult(candidate, match = null, query = searchInput.value.trim()) {
        captureEditorValue();
        const file = candidate.file;
        if (!file) return;
        if (file === example) showExamples();
        else if (file.id !== session.activeId) activateFile(file);
        else updateStatus();
        if (mobileSidebarQuery.matches) setSidebarOpen(false);

        requestAnimationFrame(() => requestAnimationFrame(() => {
          if (match && query) {
            const revealed = revealSearchMatch(query, match.occurrence);
            updateStatus(revealed ? `Match in ${file.name || "Examples"}` : `Opened ${file.name || "Examples"}`);
          } else {
            editor?.focus();
          }
        }));
      }

      function dropAfter(button, event) {
        const bounds = button.getBoundingClientRect();
        return event.clientY >= bounds.top + bounds.height / 2;
      }

      function clearSidebarDropTargets() {
        filesElement.classList.remove("LocalMarkdown-drop-target");
        for (const element of filesElement.querySelectorAll(".LocalMarkdown-drop-target")) {
          element.classList.remove("LocalMarkdown-drop-target");
        }
      }

      function markSidebarDropTarget(element) {
        clearSidebarDropTargets();
        element.classList.add("LocalMarkdown-drop-target");
      }

      function enableFileReordering(button, row, fileId, sectionId) {
        button.draggable = true;
        button.addEventListener("dragstart", event => {
          draggedSidebarItem = { kind: "file", fileId, sectionId };
          button.classList.add("LocalMarkdown-dragging");
          if (event.dataTransfer) {
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData("text/plain", fileId);
          }
        });
        row.addEventListener("dragover", event => {
          if (draggedSidebarItem?.kind !== "file" || draggedSidebarItem.fileId === fileId) return;
          event.preventDefault();
          event.stopPropagation();
          if (event.dataTransfer) event.dataTransfer.dropEffect = "move";
          markSidebarDropTarget(button);
        });
        row.addEventListener("drop", event => {
          if (draggedSidebarItem?.kind !== "file" || draggedSidebarItem.fileId === fileId) return;
          event.preventDefault();
          event.stopPropagation();
          const draggedFileId = draggedSidebarItem.fileId;
          draggedSidebarItem = null;
          clearSidebarDropTargets();
          moveFileToSection(draggedFileId, sectionId, fileId, dropAfter(row, event));
        });
        button.addEventListener("dragend", () => {
          draggedSidebarItem = null;
          clearSidebarDropTargets();
          button.classList.remove("LocalMarkdown-dragging");
        });
      }

      function attachFileSectionDropZone(element, sectionId) {
        element.addEventListener("dragover", event => {
          if (!draggedSidebarItem) return;
          if (draggedSidebarItem.kind === "file"
              && event.target.closest(".LocalMarkdown-file-row[data-file-id]")) return;
          if (draggedSidebarItem.kind === "section" && draggedSidebarItem.sectionId === sectionId) return;
          event.preventDefault();
          if (event.dataTransfer) event.dataTransfer.dropEffect = "move";
          markSidebarDropTarget(element);
        });
        element.addEventListener("drop", event => {
          if (!draggedSidebarItem) return;
          if (draggedSidebarItem.kind === "file"
              && event.target.closest(".LocalMarkdown-file-row[data-file-id]")) return;
          event.preventDefault();
          event.stopPropagation();
          const dragged = draggedSidebarItem;
          draggedSidebarItem = null;
          clearSidebarDropTargets();
          if (dragged.kind === "file") moveFileToSection(dragged.fileId, sectionId);
          else if (sectionId) moveSectionRelative(
            dragged.sectionId, sectionId, dropAfter(element.querySelector(".LocalMarkdown-topic-header"), event));
        });
      }

      function enableSectionReordering(header, container, section) {
        header.addEventListener("dragstart", event => {
          draggedSidebarItem = { kind: "section", sectionId: section.id };
          container.classList.add("LocalMarkdown-dragging");
          if (event.dataTransfer) {
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData("text/plain", section.id);
          }
        });
        header.addEventListener("dragend", () => {
          draggedSidebarItem = null;
          clearSidebarDropTargets();
          container.classList.remove("LocalMarkdown-dragging");
        });
      }

      function activateFile(file, message = null) {
        const previous = activeFile();
        pendingEditorHistoryInput = null;
        if (previous) releaseAttachmentPreviews(previous.id);
        if (tableResizeSession) finishTableResize(null, false);
        else hideTableResizeHandle();
        hideImageResizer();
        if (!(file.attachments instanceof Map)) file.attachments = new Map();
        if (!session.files.includes(file)) {
          session.files.push(file);
          syncSidebarFileAvailability(file);
        }
        session.activeId = file.id;
        if (file.handle) session.lastOpenHandle = file.handle;
        if (editorReady) setEditorValue(file);
        documentHistoryFor(file);
        renderFiles();
        updateStatus(message);
        scheduleAttachmentPreviews();
        scheduleTableWidths();
        scheduleSessionSave();
        updateDocumentHistoryControls();
      }

      function selectFile(id) {
        if (id === session.activeId) return;
        captureEditorValue();
        const file = session.files.find(item => item.id === id);
        if (file) activateFile(file);
      }

      function showExamples() {
        if (activeFile() === example) return;
        captureEditorValue();
        example.text = exampleText;
        example.attachments.clear();
        resetDocumentHistory(example);
        activateFile(example);
      }

      function updateViewButtons(mode = "ir") {
        for (const button of viewButtons) {
          button.setAttribute("aria-pressed", String(button.dataset.mode === mode));
        }
        const label = viewNames[mode] || viewNames.ir;
        viewLabel.textContent = label;
        viewToggle.setAttribute("aria-label", `Editor view: ${label}`);
      }

      function rememberEditorMode(mode) {
        if (!Object.hasOwn(viewNames, mode)) return;
        try { localStorage.setItem(editorModeStorageKey, mode); } catch {}
      }

      function rememberIrScrollPosition() {
        if (!editorReady || editor.getCurrentMode() !== "ir") return;
        const anchor = document.getSelection()?.anchorNode;
        const element = anchor?.nodeType === 1 ? anchor : anchor?.parentElement;
        if (!element?.closest?.('.vditor-ir [data-type="code-block"]')) return;
        const scroller = editorElement.querySelector(".vditor-ir > .vditor-reset");
        irScrollTopBeforeInput = scroller?.scrollTop ?? null;
      }

      function restoreIrScrollPosition() {
        if (irScrollTopBeforeInput === null) return;
        const scrollTop = irScrollTopBeforeInput;
        irScrollTopBeforeInput = null;
        cancelAnimationFrame(irScrollRestoreFrame);
        irScrollRestoreFrame = requestAnimationFrame(() => {
          irScrollRestoreFrame = null;
          const scroller = editorElement.querySelector(".vditor-ir > .vditor-reset");
          if (scroller) scroller.scrollTop = scrollTop;
        });
      }

      function handleOutlineNavigation(event) {
        const item = event.target.closest?.(
          ".vditor-outline__content [data-target-id]");
        if (!item || event.target.closest?.(".vditor-outline__action")) return;
        const target = document.getElementById(item.dataset.targetId);
        if (!target) return;
        const scroller = target.closest(".vditor-reset, .vditor-sv");
        if (!scroller) return;
        requestAnimationFrame(() => {
          const targetTop = target.getBoundingClientRect().top;
          const scrollerTop = scroller.getBoundingClientRect().top;
          scroller.scrollTop += targetTop - scrollerTop - outlineScrollOffset;
        });
      }

      function outlineIsOpen(outline = editorElement.querySelector(".vditor-outline")) {
        return Boolean(outline && getComputedStyle(outline).display !== "none");
      }

      function persistOutlineStatus(outline) {
        try {
          localStorage.setItem(outlineStorageKey,
            outlineIsOpen(outline) ? "open" : "closed");
        } catch {}
      }

      function synchronizeOutlineHeadingLevels() {
        outlineRefreshFrame = null;
        const items = editorElement.querySelectorAll(
          ".vditor-outline__content [data-target-id]");
        for (const item of items) {
          const target = document.getElementById(item.dataset.targetId);
          const match = target?.tagName.match(/^H([1-6])$/);
          if (match) item.dataset.headingLevel = match[1];
          else delete item.dataset.headingLevel;
        }
      }

      function scheduleOutlineHeadingLevels() {
        cancelAnimationFrame(outlineRefreshFrame);
        outlineRefreshFrame = requestAnimationFrame(synchronizeOutlineHeadingLevels);
      }

      function observeOutline() {
        const outline = editorElement.querySelector(".vditor-outline");
        const toggle = editorElement.querySelector(
          '.vditor-toolbar button[data-type="outline"]');
        if (!outline || !toggle) return;

        let shouldOpen = false;
        try { shouldOpen = localStorage.getItem(outlineStorageKey) === "open"; } catch {}
        if (outlineIsOpen(outline) !== shouldOpen) toggle.click();
        scheduleOutlineHeadingLevels();

        outlineObserver?.disconnect();
        outlineObserver = new MutationObserver(records => {
          if (records.some(record =>
            record.type === "attributes" && record.target === outline)) {
            persistOutlineStatus(outline);
          }
          if (records.some(record => record.type === "childList")) {
            scheduleOutlineHeadingLevels();
          }
        });
        outlineObserver.observe(outline, {
          subtree: true,
          childList: true,
          attributes: true,
          attributeFilter: ["style"]
        });
      }

      function handleSplitViewScroll(event) {
        if (!editorReady || editor.getCurrentMode() !== "sv") return;
        const sourcePane = editorElement.querySelector(".vditor-sv");
        const previewPane = editorElement.querySelector(".vditor-preview > .vditor-reset");
        const leader = event.target;
        if (!sourcePane || !previewPane || (leader !== sourcePane && leader !== previewPane)) return;

        if (leader === splitScrollFollower
            && Math.abs(leader.scrollTop - splitScrollFollowerTop) <= 1) {
          splitScrollFollower = null;
          splitScrollFollowerTop = null;
          return;
        }

        splitScrollFollower = null;
        splitScrollFollowerTop = null;
        const follower = leader === sourcePane ? previewPane : sourcePane;
        const leaderRange = Math.max(0, leader.scrollHeight - leader.clientHeight);
        const followerRange = Math.max(0, follower.scrollHeight - follower.clientHeight);
        const nextScrollTop = leaderRange
          ? (leader.scrollTop / leaderRange) * followerRange
          : 0;
        if (Math.abs(follower.scrollTop - nextScrollTop) <= 1) return;

        splitScrollFollower = follower;
        splitScrollFollowerTop = nextScrollTop;
        follower.scrollTop = nextScrollTop;
      }

      function switchEditorMode(mode) {
        if (!editorReady || editor.getCurrentMode() === mode) return;
        captureEditorValue();
        hideTableEdgeTools();
        hideTableResizeHandle();
        hideImageResizer();
        const editModeElement = editor.vditor?.toolbar?.elements?.["edit-mode"];
        const modeButton = editModeElement?.querySelector(`button[data-mode="${mode}"]`);
        if (!modeButton) {
          updateStatus("Could not change editor view");
          return;
        }

        modeButton.click();
        const currentMode = editor.getCurrentMode();
        updateViewButtons(currentMode);
        if (currentMode !== mode) {
          updateStatus("Could not change editor view");
          return;
        }
        rememberEditorMode(currentMode);
        scheduleAttachmentPreviews();
        scheduleTableWidths();
        editor.focus();
      }

      function markdownLineRecords(value) {
        const records = [];
        const pattern = /[^\r\n]*(?:\r\n|\n|\r|$)/g;
        for (const match of value.matchAll(pattern)) {
          const raw = match[0];
          if (!raw) break;
          const newline = raw.match(/(?:\r\n|\n|\r)$/)?.[0] || "";
          records.push({
            text: newline ? raw.slice(0, -newline.length) : raw,
            newline,
            start: match.index,
            end: match.index + raw.length
          });
        }
        return records;
      }

      function characterIsEscaped(value, index) {
        let slashCount = 0;
        for (let cursor = index - 1; cursor >= 0 && value[cursor] === "\\"; cursor -= 1) {
          slashCount += 1;
        }
        return slashCount % 2 === 1;
      }

      function markdownTableCells(line) {
        let value = line.trim();
        if (!value || /^ {4}/.test(line)) return null;
        let hasBoundary = false;
        if (value.startsWith("|")) {
          hasBoundary = true;
          value = value.slice(1);
        }
        if (value.endsWith("|") && !characterIsEscaped(value, value.length - 1)) {
          hasBoundary = true;
          value = value.slice(0, -1);
        }

        const cells = [];
        let start = 0;
        let codeTicks = 0;
        for (let index = 0; index < value.length; index += 1) {
          if (value[index] === "`" && !characterIsEscaped(value, index)) {
            let end = index + 1;
            while (value[end] === "`") end += 1;
            const count = end - index;
            if (!codeTicks) codeTicks = count;
            else if (codeTicks === count) codeTicks = 0;
            index = end - 1;
            continue;
          }
          if (value[index] !== "|" || codeTicks || characterIsEscaped(value, index)) continue;
          hasBoundary = true;
          cells.push(value.slice(start, index).trim());
          start = index + 1;
        }
        cells.push(value.slice(start).trim());
        return hasBoundary ? cells : null;
      }

      function normalizedTableWidths(widths, columnCount = widths?.length) {
        if (!Array.isArray(widths) || widths.length !== columnCount
          || widths.some(width => !Number.isFinite(width) || width <= 0)) return null;
        const total = widths.reduce((sum, width) => sum + width, 0);
        if (!total) return null;
        const normalized = widths.map(width => Math.round(width / total * 10000) / 100);
        const difference = Math.round((100 - normalized.reduce((sum, width) => sum + width, 0)) * 100) / 100;
        normalized[normalized.length - 1] = Math.round(
          (normalized[normalized.length - 1] + difference) * 100) / 100;
        return normalized.every(width => width > 0) ? normalized : null;
      }

      function normalizedTableWidth(width = 100) {
        const value = Number(width);
        if (!Number.isFinite(value) || value <= 0) return null;
        return Math.round(value * 100) / 100;
      }

      function resizedTableColumnLayout(
        columnPixels, columnIndex, deltaPixels, tablePixels, widthBasisPixels
      ) {
        const initialColumnPixels = columnPixels[columnIndex];
        if (!initialColumnPixels || !tablePixels || !widthBasisPixels) return null;
        const nextColumnPixels = Math.max(
          minimumTableColumnWidth, initialColumnPixels + deltaPixels);
        const appliedDelta = nextColumnPixels - initialColumnPixels;
        const nextTablePixels = tablePixels + appliedDelta;
        const nextWidths = columnPixels.map((width, index) =>
          index === columnIndex ? nextColumnPixels : width);
        const widths = normalizedTableWidths(nextWidths, nextWidths.length);
        const tableWidth = normalizedTableWidth(
          nextTablePixels / widthBasisPixels * 100);
        return widths && tableWidth ? { widths, tableWidth, appliedDelta } : null;
      }

      function tableLayoutAfterColumnAction(
        widths, tableWidth, action, columnIndex, defaultColumnWidth
      ) {
        const physicalWidths = widths.map(width => width * tableWidth / 100);
        if (["column-left", "column-right"].includes(action)) {
          if (!Number.isFinite(defaultColumnWidth) || defaultColumnWidth <= 0) return null;
          const insertionIndex = action === "column-left" ? columnIndex : columnIndex + 1;
          physicalWidths.splice(insertionIndex, 0, defaultColumnWidth);
        } else if (action === "delete-column") {
          physicalWidths.splice(columnIndex, 1);
        } else {
          return null;
        }
        const nextTableWidth = normalizedTableWidth(
          physicalWidths.reduce((sum, width) => sum + width, 0));
        const nextWidths = normalizedTableWidths(physicalWidths, physicalWidths.length);
        return nextWidths && nextTableWidth
          ? { widths: nextWidths, tableWidth: nextTableWidth }
          : null;
      }

      function parseTableWidthsComment(line, columnCount) {
        const match = line.match(/^([ \t]*)<!--\s*local-markdown:table-widths\s*=\s*([\d.]+(?:\s*,\s*[\d.]+)*)(?:\s*;\s*table-width\s*=\s*([\d.]+))?\s*-->[ \t]*$/i);
        if (!match) return null;
        const values = match[2].split(",").map(value => Number(value.trim()));
        return {
          indent: match[1],
          widths: normalizedTableWidths(values, columnCount),
          tableWidth: normalizedTableWidth(match[3] ?? 100) || 100
        };
      }

      function markdownTableBlocks(value) {
        const lines = markdownLineRecords(value);
        const tables = [];
        let fence = null;
        for (let index = 0; index < lines.length - 1; index += 1) {
          const line = lines[index].text;
          const fenceMatch = line.match(/^ {0,3}(`{3,}|~{3,})/);
          if (fenceMatch) {
            const marker = fenceMatch[1];
            if (!fence) fence = { character: marker[0], length: marker.length };
            else if (marker[0] === fence.character && marker.length >= fence.length) fence = null;
            continue;
          }
          if (fence) continue;

          const header = markdownTableCells(line);
          const delimiter = markdownTableCells(lines[index + 1].text);
          if (!header || !delimiter || header.length !== delimiter.length
            || !delimiter.every(cell => /^:?-+:?$/.test(cell))) continue;

          let metadataIndex = index - 1;
          while (metadataIndex >= 0 && !lines[metadataIndex].text.trim()) metadataIndex -= 1;
          const metadataLine = metadataIndex >= 0 ? lines[metadataIndex] : null;
          const metadataMatch = metadataLine?.text.match(
            /^([ \t]*)<!--\s*local-markdown:table-widths\s*=/i);
          const metadata = metadataLine
            ? parseTableWidthsComment(metadataLine.text, header.length)
            : null;
          const hasMetadata = Boolean(metadataMatch);
          const firstBodyLine = lines[index + 2];
          const firstBodyCells = firstBodyLine
            ? markdownTableCells(firstBodyLine.text)
            : null;
          const hasFirstBodyRow = firstBodyCells?.length === header.length;
          tables.push({
            start: lines[index].start,
            headerEnd: lines[index].end,
            delimiterStart: lines[index + 1].start,
            delimiterEnd: lines[index + 1].end,
            firstBodyStart: hasFirstBodyRow ? firstBodyLine.start : null,
            firstBodyEnd: hasFirstBodyRow ? firstBodyLine.end : null,
            newline: lines[index].newline || (value.includes("\r\n") ? "\r\n" : "\n"),
            indent: line.match(/^[ \t]*/)?.[0] || "",
            columnCount: header.length,
            widths: metadata?.widths || null,
            tableWidth: metadata?.tableWidth || 100,
            metadataStart: hasMetadata ? metadataLine.start : null,
            metadataEnd: hasMetadata ? metadataLine.end : null,
            metadataIndent: metadata?.indent || metadataMatch?.[1] || ""
          });
          index += 1;
        }
        return tables;
      }

      function formattedTableWidth(width) {
        return Number(width.toFixed(2)).toString();
      }

      function replaceTableWidthsMetadata(value, table, widths, tableWidth = table.tableWidth) {
        const normalized = normalizedTableWidths(widths, table.columnCount);
        const normalizedWidth = normalizedTableWidth(tableWidth) || 100;
        if (!normalized) return null;
        const indent = table.metadataStart === null ? table.indent : table.metadataIndent;
        const widthSetting = normalizedWidth !== 100
          ? `;table-width=${formattedTableWidth(normalizedWidth)}`
          : "";
        const comment = `${indent}<!-- ${tableWidthsCommentName}=${normalized.map(formattedTableWidth).join(",")}${widthSetting} -->${table.newline}`;
        if (table.metadataStart !== null) {
          return value.slice(0, table.metadataStart) + comment + value.slice(table.metadataEnd);
        }
        return value.slice(0, table.start) + comment + value.slice(table.start);
      }

      function tableColumnCount(table) {
        return table.rows[0]?.cells.length || 0;
      }

      function tableWidthBasisPixels(table) {
        const container = table.parentElement;
        if (!container) return table.getBoundingClientRect().width;
        const style = getComputedStyle(container);
        const horizontalPadding = Number.parseFloat(style.paddingLeft)
          + Number.parseFloat(style.paddingRight);
        const width = container.clientWidth - horizontalPadding;
        return width > 0 ? width : table.getBoundingClientRect().width;
      }

      function setTableColumnWidths(table, widths, tableWidth = 100) {
        const normalized = normalizedTableWidths(widths, tableColumnCount(table));
        const normalizedWidth = normalizedTableWidth(tableWidth);
        const widthBasisPixels = tableWidthBasisPixels(table);
        if (!normalized || !normalizedWidth || !widthBasisPixels) return false;
        const tablePixels = widthBasisPixels * normalizedWidth / 100;
        for (const cell of table.rows[0]?.cells || []) {
          cell.style.setProperty(
            "--lm-table-column-width",
            `${tablePixels * normalized[cell.cellIndex] / 100}px`);
        }
        return true;
      }

      function clearTableWidths(table) {
        table.classList.remove("LocalMarkdown-sized-table");
        table.style.removeProperty("--lm-table-width");
        for (const cell of table.querySelectorAll("th, td")) {
          cell.style.removeProperty("--lm-table-column-width");
        }
      }

      function applyTableWidths(table, widths, tableWidth = 100) {
        const normalized = normalizedTableWidths(widths, tableColumnCount(table));
        const normalizedWidth = normalizedTableWidth(tableWidth);
        if (!normalized || !normalizedWidth) {
          clearTableWidths(table);
          return false;
        }
        table.classList.add("LocalMarkdown-sized-table");
        table.style.setProperty("--lm-table-width", `${normalizedWidth}%`);
        return setTableColumnWidths(table, normalized, normalizedWidth);
      }

      function tableSurface(table) {
        return table?.closest?.(".vditor-ir, .vditor-wysiwyg, .vditor-preview") || null;
      }

      function tablesInSurface(surface) {
        return Array.from(surface?.querySelectorAll("table") || [])
          .filter(table => tableSurface(table) === surface);
      }

      function tableFromNode(node) {
        const element = node?.nodeType === Node.ELEMENT_NODE ? node : node?.parentElement;
        const table = element?.closest?.("table");
        return table && editorElement.contains(table) && tableSurface(table) ? table : null;
      }

      function tableCellExportText(cell) {
        const clone = cell.cloneNode(true);
        for (const checkbox of clone.querySelectorAll('input[type="checkbox"]')) {
          checkbox.replaceWith(document.createTextNode(checkbox.checked ? "TRUE" : "FALSE"));
        }
        for (const image of clone.querySelectorAll("img")) {
          image.replaceWith(document.createTextNode(image.alt || ""));
        }
        for (const lineBreak of clone.querySelectorAll(
          "br, .LocalMarkdown-table-line-break")) {
          lineBreak.replaceWith(document.createTextNode("\n"));
        }
        for (const marker of clone.querySelectorAll(
          ".vditor-ir__marker, .vditor-wysiwyg__marker, script, style")) {
          marker.remove();
        }
        return clone.textContent
          .replace(/\u00a0/g, " ")
          .replace(/\r\n?/g, "\n")
          .replace(/[ \t]+\n/g, "\n")
          .trim();
      }

      function tableExportData(table, selectedCells = null) {
        const rows = Array.from(table?.rows || []);
        if (!rows.length) return null;
        let rowStart = 0;
        let rowEnd = rows.length - 1;
        let columnStart = 0;
        let columnEnd = Math.max(0, ...rows.map(row => row.cells.length - 1));
        if (selectedCells) {
          const positions = [];
          rows.forEach((row, rowIndex) => {
            Array.from(row.cells).forEach((cell, columnIndex) => {
              if (selectedCells.has(cell)) positions.push({ rowIndex, columnIndex });
            });
          });
          if (!positions.length) return null;
          rowStart = Math.min(...positions.map(position => position.rowIndex));
          rowEnd = Math.max(...positions.map(position => position.rowIndex));
          columnStart = Math.min(...positions.map(position => position.columnIndex));
          columnEnd = Math.max(...positions.map(position => position.columnIndex));
        }
        return {
          rows: rows.slice(rowStart, rowEnd + 1).map(row =>
            Array.from(row.cells).slice(columnStart, columnEnd + 1).map(cell => ({
              text: tableCellExportText(cell),
              header: cell.tagName === "TH"
            })))
        };
      }

      function delimitedTableText(data, delimiter) {
        return data.rows.map(row => row.map(cell => {
          const value = cell.text;
          return value.includes(delimiter) || /["\r\n]/.test(value)
            ? `"${value.replace(/"/g, '""')}"`
            : value;
        }).join(delimiter)).join("\r\n");
      }

      function escapedTableHtml(value) {
        return value
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/\n/g, '<br style="mso-data-placement:same-cell">');
      }

      function tableClipboardHtml(data) {
        const rows = data.rows.map(row => `<tr>${row.map(cell => {
          const tag = cell.header ? "th" : "td";
          return `<${tag}>${escapedTableHtml(cell.text)}</${tag}>`;
        }).join("")}</tr>`).join("");
        return '<html xmlns:o="urn:schemas-microsoft-com:office:office" '
          + 'xmlns:x="urn:schemas-microsoft-com:office:excel">'
          + '<head><meta charset="utf-8"><style>'
          + 'br{mso-data-placement:same-cell;}</style></head>'
          + `<body><table>${rows}</table></body></html>`;
      }

      function selectedTableExportData() {
        const selection = getSelection();
        if (!selection || selection.isCollapsed || selection.rangeCount !== 1) return null;
        const range = selection.getRangeAt(0);
        const startTable = tableFromNode(range.startContainer);
        const endTable = tableFromNode(range.endContainer);
        if (!startTable || startTable !== endTable) return null;
        const selectedCells = new Set(Array.from(startTable.querySelectorAll("th, td"))
          .filter(cell => {
            try { return range.intersectsNode(cell); } catch { return false; }
          }));
        if (selectedCells.size < 2) return null;
        const data = tableExportData(startTable, selectedCells);
        return data ? { table: startTable, data } : null;
      }

      function handleTableCopy(event) {
        const selected = selectedTableExportData();
        if (!selected || !event.clipboardData) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        event.clipboardData.setData("text/plain", delimitedTableText(selected.data, "\t"));
        event.clipboardData.setData("text/html", tableClipboardHtml(selected.data));
        updateStatus("Table copied for Excel");
      }

      function copyTableWithSelectionFallback(data) {
        const selection = getSelection();
        const savedRanges = selection
          ? Array.from({ length: selection.rangeCount }, (_, index) =>
            selection.getRangeAt(index).cloneRange())
          : [];
        const clipboardContent = document.createElement("div");
        clipboardContent.contentEditable = "true";
        clipboardContent.setAttribute("aria-hidden", "true");
        clipboardContent.style.cssText = "position:fixed;left:-10000px;top:0;";
        clipboardContent.innerHTML = tableClipboardHtml(data);
        document.body.append(clipboardContent);
        const range = document.createRange();
        range.selectNodeContents(clipboardContent);
        selection?.removeAllRanges();
        selection?.addRange(range);
        let copied = false;
        try { copied = document.execCommand("copy"); } catch {}
        clipboardContent.remove();
        selection?.removeAllRanges();
        for (const savedRange of savedRanges) selection?.addRange(savedRange);
        return copied;
      }

      async function copyTableForExcel(table) {
        const data = tableExportData(table);
        if (!data) return false;
        const text = delimitedTableText(data, "\t");
        const html = tableClipboardHtml(data);
        let copied = false;
        if (navigator.clipboard?.write && window.ClipboardItem) {
          try {
            await navigator.clipboard.write([new ClipboardItem({
              "text/plain": new Blob([text], { type: "text/plain" }),
              "text/html": new Blob([html], { type: "text/html" })
            })]);
            copied = true;
          } catch {}
        }
        if (!copied) copied = copyTableWithSelectionFallback(data);
        updateStatus(copied ? "Table copied for Excel" : "Could not copy this table");
        return copied;
      }

      function tableCsvFilename(table) {
        const file = activeFile();
        const base = (file?.name || "table")
          .replace(/\.(?:md|markdown)$/i, "")
          .replace(/[<>:"/\\|?*\u0000-\u001F]/g, "-")
          .replace(/[.\s]+$/, "")
          .slice(0, 72) || "table";
        const index = Math.max(0, tablesInSurface(tableSurface(table)).indexOf(table)) + 1;
        return `${base}-table-${index}.csv`;
      }

      function downloadTableCsv(table) {
        const data = tableExportData(table);
        if (!data) return false;
        const url = URL.createObjectURL(new Blob([
          "\uFEFF", delimitedTableText(data, ",")
        ], { type: "text/csv;charset=utf-8" }));
        const link = document.createElement("a");
        link.href = url;
        link.download = tableCsvFilename(table);
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        updateStatus("CSV downloaded");
        return true;
      }

      function setTableExportMenuOpen(open, { focus = false } = {}) {
        tableExportMenu.hidden = !open;
        tableExportToggle.setAttribute("aria-expanded", String(open));
        if (open && focus) tableExportActions[0]?.focus();
      }

      function hideTableExportTools() {
        setTableExportMenuOpen(false);
        tableExportTools.hidden = true;
        tableExportTarget = null;
      }

      function showTableExportTools(table) {
        const surface = tableSurface(table);
        const topLeftCell = table.rows[0]?.cells[0];
        if (!surface || !topLeftCell) {
          hideTableExportTools();
          return;
        }
        const cellRect = topLeftCell.getBoundingClientRect();
        const surfaceRect = surface.getBoundingClientRect();
        if (tableExportTarget !== table) setTableExportMenuOpen(false);
        tableExportTarget = table;
        tableExportTools.hidden = false;
        const toggleRect = tableExportToggle.getBoundingClientRect();
        const top = cellRect.top + 4;
        const left = cellRect.left + 4;
        if (top < Math.max(2, surfaceRect.top)
          || left < Math.max(2, surfaceRect.left)
          || top + toggleRect.height > Math.min(innerHeight - 2, surfaceRect.bottom)
          || left + toggleRect.width > Math.min(innerWidth - 2, surfaceRect.right)) {
          hideTableExportTools();
          return;
        }
        tableExportTools.style.top = `${Math.round(top)}px`;
        tableExportTools.style.left = `${Math.round(left)}px`;
      }

      function handleTableExportPointerMove(event) {
        if (tableExportTools.contains(event.target) || !tableExportMenu.hidden) return;
        const table = tableFromNode(event.target);
        if (table) showTableExportTools(table);
        else hideTableExportTools();
      }

      async function runTableExportAction(action) {
        const table = tableExportTarget;
        setTableExportMenuOpen(false);
        if (!table?.isConnected) {
          hideTableExportTools();
          return;
        }
        if (action === "copy") await copyTableForExcel(table);
        else if (action === "csv") downloadTableCsv(table);
      }

      function markdownTableContext(table, value) {
        const surface = tableSurface(table);
        const tableIndex = tablesInSurface(surface).indexOf(table);
        if (tableIndex < 0) return null;
        const block = markdownTableBlocks(value)[tableIndex];
        if (!block || block.columnCount !== tableColumnCount(table)) return null;
        return { tableIndex, block };
      }

      function applyTableStructureUpdate(file, updated, message) {
        if (!file || !updated || updated === file.text) return false;
        const before = documentSnapshot(file);
        file.text = updated;
        if (!file.builtin) {
          file.dirty = true;
          scheduleAutoSave(file);
          scheduleSessionSave();
        }
        hideTableEdgeTools();
        setEditorValue(file, updated);
        renderFiles();
        updateStatus(message);
        scheduleAttachmentPreviews();
        scheduleTableWidths();
        recordDocumentMutation(file, before, { label: message.toLocaleLowerCase() });
        return true;
      }

      function updateTableHeaderRow(cell, action) {
        if (cell?.tagName !== "TH"
          || !["row-above", "delete-row"].includes(action)) return false;
        const table = cell.closest("table");
        const file = activeFile();
        if (!table || !file || !editorReady) return false;
        captureEditorValue();
        const value = canonicalEditorText(editor.getValue(), file);
        const context = markdownTableContext(table, value);
        if (!context) return false;
        const block = context.block;
        const header = value.slice(block.start, block.headerEnd);
        const delimiter = value.slice(block.delimiterStart, block.delimiterEnd);
        let updated;
        let message;
        if (action === "row-above") {
          const emptyHeader = `${block.indent}| ${Array(block.columnCount)
            .fill("").join(" | ")} |${block.newline}`;
          updated = value.slice(0, block.start) + emptyHeader + delimiter + header
            + value.slice(block.delimiterEnd);
          message = "Header row added";
        } else {
          if (block.firstBodyStart === null || block.firstBodyEnd === null) return false;
          const nextHeader = value.slice(block.firstBodyStart, block.firstBodyEnd);
          updated = value.slice(0, block.start) + nextHeader + delimiter
            + value.slice(block.firstBodyEnd);
          message = "Header row deleted";
        }
        return applyTableStructureUpdate(file, updated, message);
      }

      function refreshTableWidths() {
        if (!editorReady) return;
        const file = activeFile();
        if (!file) return;
        const blocks = markdownTableBlocks(file.text);
        for (const metadata of editorElement.querySelectorAll(
          '.vditor-ir [data-type="html-block"], .vditor-wysiwyg [data-type="html-block"]')) {
          metadata.classList.toggle("LocalMarkdown-table-widths-metadata",
            /^<!--\s*local-markdown:table-widths\s*=/i.test(metadata.textContent.trim()));
        }
        for (const inlineHtml of editorElement.querySelectorAll(
          '.vditor-ir table [data-type="html-inline"], .vditor-wysiwyg table [data-type="html-inline"]')) {
          inlineHtml.classList.toggle("LocalMarkdown-table-line-break",
            /^<br\s*\/?>$/i.test(inlineHtml.textContent.trim()));
        }
        const surfaces = editorElement.querySelectorAll(".vditor-ir, .vditor-wysiwyg, .vditor-preview");
        for (const surface of surfaces) {
          const tables = tablesInSurface(surface);
          tables.forEach((table, index) => {
            if (tableResizeSession?.table === table) return;
            const block = blocks[index];
            if (!block?.widths || block.columnCount !== tableColumnCount(table)) clearTableWidths(table);
            else applyTableWidths(table, block.widths, block.tableWidth);
          });
        }
      }

      function scheduleTableWidths() {
        cancelAnimationFrame(tableWidthRefreshFrame);
        tableWidthRefreshFrame = requestAnimationFrame(() => {
          tableWidthRefreshFrame = null;
          refreshTableWidths();
        });
      }

      function tableCellFromNode(node) {
        const element = node?.nodeType === Node.ELEMENT_NODE ? node : node?.parentElement;
        const cell = element?.closest?.("td, th");
        if (!cell || !editorElement.contains(cell)
          || !cell.closest(".vditor-ir, .vditor-wysiwyg")) return null;
        return cell;
      }

      function hideTableEdgeTools() {
        for (const tools of tableEdgeTools) tools.hidden = true;
        tableHoverCell = null;
      }

      function hideTableResizeHandle() {
        if (tableResizeSession) return;
        tableResizeHandle.hidden = true;
        tableResizeCell = null;
      }

      function positionTableResizeHandle(cell) {
        const table = cell?.closest("table");
        const surface = table?.closest(".vditor-ir")?.querySelector(":scope > .vditor-reset");
        const columnIndex = cell?.cellIndex ?? -1;
        const columnCount = tableColumnCount(table);
        if (!table || !surface || columnIndex < 0 || columnIndex >= columnCount) {
          hideTableResizeHandle();
          return false;
        }

        const cellRect = cell.getBoundingClientRect();
        const tableRect = table.getBoundingClientRect();
        const surfaceRect = surface.getBoundingClientRect();
        const top = Math.max(tableRect.top, surfaceRect.top, 2);
        const bottom = Math.min(tableRect.bottom, surfaceRect.bottom, innerHeight - 2);
        if (bottom <= top) {
          hideTableResizeHandle();
          return false;
        }

        tableResizeCell = cell;
        tableResizeHandle.hidden = false;
        tableResizeHandle.dataset.edge = "column";
        tableResizeHandle.setAttribute("aria-label", "Resize column");
        tableResizeHandle.title = "Resize column";
        tableResizeHandle.style.left = `${Math.round(cellRect.right)}px`;
        tableResizeHandle.style.top = `${Math.round(top)}px`;
        tableResizeHandle.style.height = `${Math.round(bottom - top)}px`;
        return true;
      }

      function showTableEdgeTools(axis, cell, action) {
        const surface = editorElement.querySelector(".vditor-ir > .vditor-reset");
        const table = cell.closest("table");
        if (!surface || !table) {
          hideTableEdgeTools();
          return;
        }

        tableHoverCell = cell;
        hideTableResizeHandle();
        const tools = axis === "row" ? tableRowTools : tableColumnTools;
        const otherTools = axis === "row" ? tableColumnTools : tableRowTools;
        otherTools.hidden = true;
        for (const handle of tools.querySelectorAll("[data-table-action]")) {
          handle.hidden = handle.dataset.tableAction !== action;
        }
        tools.hidden = false;

        const cellRect = cell.getBoundingClientRect();
        const tableRect = table.getBoundingClientRect();
        const surfaceRect = surface.getBoundingClientRect();
        const toolsRect = tools.getBoundingClientRect();
        let top;
        let left;
        if (axis === "row") {
          const rowRect = cell.parentElement.getBoundingClientRect();
          const targetY = action === "row-above" ? rowRect.top
            : action === "row-below" ? rowRect.bottom
            : rowRect.top + rowRect.height / 2;
          top = targetY - toolsRect.height / 2;
          left = tableRect.left - toolsRect.width + 6;
          const onlyTableRowSelected = cell.tagName === "TH" && table.rows.length <= 1;
          deleteTableRowHandle.setAttribute("aria-disabled", String(onlyTableRowSelected));
          deleteTableRowHandle.tabIndex = onlyTableRowSelected ? -1 : 0;
          deleteTableRowHandle.title = onlyTableRowSelected
            ? "The table's only row cannot be deleted"
            : "Delete row";
        } else {
          top = tableRect.top - toolsRect.height + 6;
          const targetX = action === "column-left" ? cellRect.left
            : action === "column-right" ? cellRect.right
            : cellRect.left + cellRect.width / 2;
          left = targetX - toolsRect.width / 2;
        }
        const minTop = Math.max(2, surfaceRect.top - toolsRect.height);
        const maxTop = Math.min(innerHeight - toolsRect.height - 2,
          surfaceRect.bottom - toolsRect.height);
        const minLeft = Math.max(2, surfaceRect.left - toolsRect.width);
        const maxLeft = Math.min(innerWidth - toolsRect.width - 2,
          surfaceRect.right - toolsRect.width);
        top = Math.max(minTop, Math.min(top, maxTop));
        left = Math.max(minLeft, Math.min(left, maxLeft));
        tools.style.top = `${Math.round(top)}px`;
        tools.style.left = `${Math.round(left)}px`;
      }

      function handleTableEdgePointerMove(event) {
        if (tableResizeSession || tableResizeHandle.contains(event.target)
          || tableEdgeTools.some(tools => tools.contains(event.target))) return;
        if (!editorReady || editor.getCurrentMode() !== "ir") {
          hideTableEdgeTools();
          hideTableResizeHandle();
          return;
        }

        const cell = tableCellFromNode(event.target);
        const table = cell?.closest("table");
        if (!cell || !table) {
          hideTableEdgeTools();
          hideTableResizeHandle();
          return;
        }

        const tableRect = table.getBoundingClientRect();
        const cellRect = cell.getBoundingClientRect();
        const rowRect = cell.parentElement.getBoundingClientRect();
        const edgeSize = 20;
        const intersectionSize = 10;
        const resizeEdgeSize = 5;
        const rowDistance = Math.abs(event.clientX - tableRect.left);
        const columnDistance = Math.abs(event.clientY - tableRect.top);
        const leftResizeDistance = Math.abs(event.clientX - cellRect.left);
        const rightResizeDistance = Math.abs(event.clientX - cellRect.right);
        const useLeftResizeEdge = cell.cellIndex > 0 && leftResizeDistance < rightResizeDistance;
        const resizeCell = useLeftResizeEdge
          ? cell.parentElement.cells[cell.cellIndex - 1]
          : cell;
        const resizeDistance = useLeftResizeEdge ? leftResizeDistance : rightResizeDistance;
        const onRowEdge = rowDistance <= edgeSize
          && event.clientY >= rowRect.top && event.clientY <= rowRect.bottom;
        const onColumnEdge = columnDistance <= edgeSize
          && event.clientX >= cellRect.left && event.clientX <= cellRect.right;

        if (onRowEdge && (!onColumnEdge || rowDistance <= columnDistance)) {
          const topDistance = Math.abs(event.clientY - rowRect.top);
          const bottomDistance = Math.abs(event.clientY - rowRect.bottom);
          const action = Math.min(topDistance, bottomDistance) <= intersectionSize
            ? (topDistance <= bottomDistance ? "row-above" : "row-below")
            : "delete-row";
          showTableEdgeTools("row", cell, action);
        } else if (onColumnEdge) {
          const leftDistance = Math.abs(event.clientX - cellRect.left);
          const rightDistance = Math.abs(event.clientX - cellRect.right);
          const action = Math.min(leftDistance, rightDistance) <= intersectionSize
            ? (leftDistance <= rightDistance ? "column-left" : "column-right")
            : "delete-column";
          showTableEdgeTools("column", cell, action);
        } else if (resizeDistance <= resizeEdgeSize) {
          hideTableEdgeTools();
          positionTableResizeHandle(resizeCell);
        } else {
          hideTableEdgeTools();
          hideTableResizeHandle();
        }
      }

      function tableColumnWidthsFromLayout(table) {
        const cells = Array.from(table.rows[0]?.cells || []);
        const widths = cells.map(cell => cell.getBoundingClientRect().width);
        return normalizedTableWidths(widths, cells.length);
      }

      function applyTableWidthTextUpdate(
        file, value, updated, message, { rerender = true, mergeHistory = false } = {}
      ) {
        if (!updated || updated === value) return false;
        const before = documentSnapshot(file);
        file.text = updated;
        if (!file.builtin) {
          file.dirty = true;
          scheduleAutoSave(file);
          scheduleSessionSave();
        }
        if (rerender) setEditorValue(file, updated);
        else file.tableWidthsOutOfSync = true;
        renderFiles();
        updateStatus(message);
        scheduleAttachmentPreviews();
        scheduleTableWidths();
        recordDocumentMutation(file, before, {
          label: "table resize",
