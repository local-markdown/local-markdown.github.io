          mergeWithPrevious: mergeHistory
        });
        return true;
      }

      function startTableResize(event) {
        if (tableResizeSession || event.button !== 0
          || !tableResizeCell?.isConnected || !editorReady) return;
        const table = tableResizeCell.closest("table");
        const file = activeFile();
        if (!table || !file) return;
        captureEditorValue();
        const value = file.text;
        const context = markdownTableContext(table, value);
        const columnIndex = tableResizeCell.cellIndex;
        const layoutWidths = tableColumnWidthsFromLayout(table);
        const widths = context?.block.widths || layoutWidths;
        const firstRow = table.rows[0];
        const resizedCell = firstRow?.cells[columnIndex];
        if (!context || !widths || !resizedCell) return;

        event.preventDefault();
        hideTableEdgeTools();
        const tablePixels = table.getBoundingClientRect().width;
        const columnPixels = Array.from(firstRow.cells,
          cell => cell.getBoundingClientRect().width);
        const widthBasisPixels = tableWidthBasisPixels(table);
        if (!tablePixels || !widthBasisPixels) return;
        const handleLeft = Number.parseFloat(tableResizeHandle.style.left);
        tableResizeSession = {
          table,
          tableIndex: context.tableIndex,
          columnIndex,
          initialWidths: [...widths],
          widths: [...widths],
          initialTableWidth: context.block.tableWidth,
          tableWidth: context.block.tableWidth,
          hadStoredWidths: Boolean(context.block.widths),
          startX: event.clientX,
          columnPixels,
          tablePixels,
          widthBasisPixels,
          handleLeft: Number.isFinite(handleLeft) ? handleLeft : event.clientX,
          pointerX: event.clientX,
          renderedX: event.clientX,
          frameId: null,
          changed: false
        };
        tableResizeHandle.setPointerCapture(event.pointerId);
      }

      function renderTableResize(resize, clientX) {
        const deltaPixels = clientX - resize.startX;
        resize.renderedX = clientX;
        const layout = resizedTableColumnLayout(
          resize.columnPixels, resize.columnIndex, deltaPixels,
          resize.tablePixels, resize.widthBasisPixels);
        if (!layout) return;
        resize.widths = layout.widths;
        resize.tableWidth = layout.tableWidth;
        resize.table.classList.add("LocalMarkdown-sized-table");
        resize.table.style.setProperty("--lm-table-width", `${layout.tableWidth}%`);
        setTableColumnWidths(resize.table, layout.widths, layout.tableWidth);
        resize.changed = Math.abs(layout.appliedDelta) >= 1;
        tableResizeHandle.style.left = `${Math.round(
          resize.handleLeft + layout.appliedDelta)}px`;
      }

      function continueTableResize(event) {
        const resize = tableResizeSession;
        if (!resize || !resize.tablePixels) return;
        event.preventDefault();
        resize.pointerX = event.clientX;
        if (resize.frameId !== null) return;
        resize.frameId = requestAnimationFrame(() => {
          resize.frameId = null;
          if (tableResizeSession === resize) renderTableResize(resize, resize.pointerX);
        });
      }

      function commitTableResize(resize) {
        const file = activeFile();
        if (!file || !editorReady) return false;
        const value = file.text;
        const table = markdownTableBlocks(value)[resize.tableIndex];
        if (!table || table.columnCount !== resize.widths.length) return false;
        const widths = normalizedTableWidths(resize.widths, table.columnCount);
        const tableWidth = normalizedTableWidth(resize.tableWidth);
        if (!widths || !tableWidth) return false;
        const updated = replaceTableWidthsMetadata(
          value, table, widths, tableWidth);
        const committed = applyTableWidthTextUpdate(
          file, value, updated, "Column width updated", { rerender: false });
        if (committed && resize.table.isConnected) {
          applyTableWidths(resize.table, widths, tableWidth);
        }
        return committed;
      }

      function finishTableResize(event, commit = true) {
        const resize = tableResizeSession;
        if (!resize) return;
        event?.preventDefault();
        if (resize.frameId !== null) {
          cancelAnimationFrame(resize.frameId);
          resize.frameId = null;
        }
        if (commit && Number.isFinite(event?.clientX)) resize.pointerX = event.clientX;
        if (commit && resize.pointerX !== resize.renderedX) {
          renderTableResize(resize, resize.pointerX);
        }
        tableResizeSession = null;
        if (commit && resize.changed && commitTableResize(resize)) {
          hideTableResizeHandle();
          return;
        }
        if (resize.table.isConnected) {
          if (resize.hadStoredWidths) {
            applyTableWidths(resize.table, resize.initialWidths, resize.initialTableWidth);
          }
          else clearTableWidths(resize.table);
        }
        hideTableResizeHandle();
        if (commit && resize.changed) updateStatus("Could not resize this table");
      }

      function selectHoveredTableCell() {
        const surface = editorElement.querySelector(".vditor-ir > .vditor-reset");
        if (!surface || !tableHoverCell?.isConnected) return null;
        surface.focus({ preventScroll: true });
        const range = document.createRange();
        range.selectNodeContents(tableHoverCell);
        range.collapse(true);
        const selection = getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        return surface;
      }

      function tableActionWidthContext(action) {
        if (!tableHoverCell || ![
          "row-above", "row-below", "delete-row",
          "column-left", "column-right", "delete-column"
        ].includes(action)) return null;
        const file = activeFile();
        const table = tableHoverCell.closest("table");
        if (!file || !table) return null;
        const value = canonicalEditorText(editor.getValue(), file);
        const context = markdownTableContext(table, value);
        const widths = context?.block.widths || tableColumnWidthsFromLayout(table);
        if (!context || !widths) return null;
        const widthBasisPixels = tableWidthBasisPixels(table);
        return {
          action,
          file,
          tableIndex: context.tableIndex,
          columnIndex: tableHoverCell.cellIndex,
          widths: [...widths],
          tableWidth: context.block.tableWidth,
          defaultColumnWidth: defaultTableColumnWidth / widthBasisPixels * 100
        };
      }

      function synchronizeTableWidthsAfterAction(context, message) {
        if (activeFile() !== context.file || !editorReady) return;
        const value = canonicalEditorText(editor.getValue(), context.file);
        const table = markdownTableBlocks(value)[context.tableIndex];
        if (!table) return;
        let widths = context.widths;
        let tableWidth = context.tableWidth;
        const columnAdded = ["column-left", "column-right"].includes(context.action)
          && table.columnCount === widths.length + 1;
        const columnDeleted = context.action === "delete-column"
          && table.columnCount === widths.length - 1;
        if (columnAdded || columnDeleted) {
          const layout = tableLayoutAfterColumnAction(
            widths, tableWidth, context.action, context.columnIndex,
            context.defaultColumnWidth);
          if (!layout) return;
          widths = layout.widths;
          tableWidth = layout.tableWidth;
        } else if (!["row-above", "row-below", "delete-row"].includes(context.action)
          || table.columnCount !== widths.length) {
          scheduleTableWidths();
          return;
        }
        const updated = replaceTableWidthsMetadata(value, table, widths, tableWidth);
        applyTableWidthTextUpdate(
          context.file, value, updated, message, { mergeHistory: true });
      }

      function runTableAction(action) {
        if (["row-above", "delete-row"].includes(action)
          && tableHoverCell?.tagName === "TH") {
          if (!updateTableHeaderRow(tableHoverCell, action)) {
            hideTableEdgeTools();
            updateStatus("Could not update the table header");
          }
          return;
        }
        const shortcuts = {
          "row-above": { key: "f", code: "KeyF", shiftKey: true, status: "Row added above" },
          "row-below": { key: "=", code: "Equal", shiftKey: false, status: "Row added below" },
          "column-left": { key: "g", code: "KeyG", shiftKey: true, status: "Column added before" },
          "column-right": { key: "=", code: "Equal", shiftKey: true, status: "Column added after" },
          "delete-row": { key: "-", code: "Minus", shiftKey: false, status: "Row deleted" },
          "delete-column": { key: "-", code: "Minus", shiftKey: true, status: "Column deleted" }
        };
        const shortcut = shortcuts[action];
        const widthContext = tableActionWidthContext(action);
        const surface = shortcut && selectHoveredTableCell();
        if (!surface) {
          hideTableEdgeTools();
          return;
        }

        const isMac = /Mac|iPhone|iPad|iPod/.test(navigator.platform);
        // Vditor matches shifted punctuation differently on macOS and other platforms.
        const shiftedKey = shortcut.key === "=" ? "+"
          : shortcut.key === "-" ? "_"
          : shortcut.key.toUpperCase();
        const keyVariants = shortcut.shiftKey
          ? [shiftedKey, shortcut.key]
          : [shortcut.key];
        const handled = keyVariants.some(key => {
          const event = new KeyboardEvent("keydown", {
            key,
            code: shortcut.code,
            metaKey: isMac,
            ctrlKey: !isMac,
            shiftKey: shortcut.shiftKey,
            bubbles: true,
            cancelable: true
          });
          surface.dispatchEvent(event);
          return event.defaultPrevented;
        });
        if (handled) {
          updateStatus(shortcut.status);
          if (widthContext) {
            setTimeout(() => synchronizeTableWidthsAfterAction(
              widthContext, shortcut.status), 0);
          } else {
            scheduleTableWidths();
          }
        }
        hideTableEdgeTools();
      }

      function editableImageFromNode(node) {
        const element = node?.nodeType === Node.ELEMENT_NODE ? node : node?.parentElement;
        const image = element?.closest?.("img");
        if (!image || !editorElement.contains(image)) return null;
        const surface = image.closest(".vditor-ir, .vditor-wysiwyg, .vditor-preview");
        if (!surface || getComputedStyle(surface).display === "none") return null;
        return image;
      }

      function positionImageResizer() {
        if (!selectedImage?.isConnected || imageResizer.hidden) {
          hideImageResizer();
          return;
        }
        const rect = selectedImage.getBoundingClientRect();
        if (!rect.width || !rect.height) {
          hideImageResizer();
          return;
        }
        imageResizer.style.left = `${rect.left}px`;
        imageResizer.style.top = `${rect.top}px`;
        imageResizer.style.width = `${rect.width}px`;
        imageResizer.style.height = `${rect.height}px`;
      }

      function imageAlignment(image) {
        if (image.style.display !== "block") return null;
        const left = image.style.marginLeft;
        const right = image.style.marginRight;
        const zero = value => value === "0" || value === "0px";
        if (zero(left) && right === "auto") return "left";
        if (left === "auto" && right === "auto") return "center";
        if (left === "auto" && zero(right)) return "right";
        return null;
      }

      function showImageResizer(image, selected = false) {
        selectedImage = image;
        const alignment = imageAlignment(image);
        for (const button of imageAlignButtons) {
          button.setAttribute("aria-pressed", String(button.dataset.imageAlign === alignment));
        }
        imageResizer.toggleAttribute("data-selected", selected);
        imageResizer.hidden = false;
        positionImageResizer();
      }

      function hideImageResizer() {
        if (imageResizeSession) return;
        selectedImage = null;
        imageResizer.removeAttribute("data-selected");
        imageResizer.hidden = true;
      }

      function hideImageResizerAfterHover() {
        requestAnimationFrame(() => {
          if (imageResizeSession || imageResizer.hasAttribute("data-selected")
            || selectedImage?.matches(":hover")
            || imageResizer.matches(":hover")) return;
          hideImageResizer();
        });
      }

      function openImagePreview(image) {
        if (!image?.isConnected) return;
        clearTimeout(imagePreviewTimer);
        imagePreviewTimer = null;
        imagePreviewContent.src = image.currentSrc || image.src;
        imagePreviewContent.alt = image.getAttribute("alt") || "Full-screen image";
        if (!imagePreviewDialog.open) imagePreviewDialog.showModal();
      }

      function closeImagePreview() {
        clearTimeout(imagePreviewTimer);
        imagePreviewTimer = null;
        if (imagePreviewDialog.open) imagePreviewDialog.close();
        imagePreviewContent.removeAttribute("src");
      }

      function escapeHtmlAttribute(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/"/g, "&quot;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function imageAlignmentStyle(alignment) {
        const margins = {
          left: ["0", "auto"],
          center: ["auto", "auto"],
          right: ["auto", "0"]
        }[alignment];
        return margins
          ? `display: block; margin-left: ${margins[0]}; margin-right: ${margins[1]};`
          : "";
      }

      function imageHtml(source, alt, title, width = null, alignment = null) {
        const attributes = [
          `src="${escapeHtmlAttribute(source)}"`,
          `alt="${escapeHtmlAttribute(alt || "")}"`
        ];
        if (title) attributes.push(`title="${escapeHtmlAttribute(title)}"`);
        if (width !== null) attributes.push(`width="${width}"`);
        if (alignment) attributes.push(`style="${imageAlignmentStyle(alignment)}"`);
        return `<img ${attributes.join(" ")}>`;
      }

      function replaceOccurrence(value, search, replacement, occurrence) {
        let index = -1;
        for (let count = 0; count <= occurrence; count += 1) {
          index = value.indexOf(search, index + 1);
          if (index < 0) return value;
        }
        return value.slice(0, index) + replacement + value.slice(index + search.length);
      }

      function directMarkdownImageReplacement(image, value, tag) {
        const imageNode = image.closest('.vditor-ir [data-type="img"]');
        if (!imageNode?.contains(image)) return null;
        const linkNode = imageNode.parentElement?.matches('[data-type="a"]')
          ? imageNode.parentElement
          : null;
        const targetNode = linkNode || imageNode;
        const raw = targetNode.textContent;
        if (!raw) return null;

        const root = image.closest(".vditor-ir");
        const selector = linkNode ? '[data-type="a"]' : '[data-type="img"]';
        const matches = Array.from(root.querySelectorAll(selector))
          .filter(node => node.textContent === raw);
        const occurrence = matches.indexOf(targetNode);
        if (occurrence < 0) return null;

        let replacement = tag;
        if (linkNode) {
          const href = Array.from(linkNode.children)
            .find(child => child.matches(".vditor-ir__marker--link"))?.textContent;
          if (href) replacement = `<a href="${escapeHtmlAttribute(href)}">${tag}</a>`;
        }
        const updated = replaceOccurrence(value, raw, replacement, occurrence);
        return updated === value ? null : updated;
      }

      function decodedHtmlAttribute(value) {
        const textarea = document.createElement("textarea");
        textarea.innerHTML = value;
        return textarea.value;
      }

      function htmlAttribute(tag, name) {
        const pattern = new RegExp(
          `(?:^|\\s)${name}\\s*=\\s*(?:"([^"]*)"|'([^']*)'|([^\\s"'=<>\u0060]+))`,
          "i"
        );
        const match = tag.match(pattern);
        return match ? decodedHtmlAttribute(match[1] ?? match[2] ?? match[3] ?? "") : "";
      }

      function imageMarkupCandidates(value) {
        const candidates = [];
        const htmlPattern = /<img\b[^>]*>/gi;
        for (const match of value.matchAll(htmlPattern)) {
          candidates.push({
            type: "html",
            start: match.index,
            end: match.index + match[0].length,
            markup: match[0],
            source: htmlAttribute(match[0], "src")
          });
        }

        const markdownPattern = /!\[([^\]\n]*)\]\(\s*(<[^>\n]+>|[^\s)\n]+)(?:\s+(["'])(.*?)\3)?\s*\)/g;
        for (const match of value.matchAll(markdownPattern)) {
          candidates.push({
            type: "markdown",
            start: match.index,
            end: match.index + match[0].length,
            markup: match[0],
            source: match[2].replace(/^<|>$/g, "")
          });
        }
        return candidates.sort((left, right) => left.start - right.start);
      }

      function imageSourceReference(image, file) {
        const attachmentId = attachmentIdForImage(image, file);
        return attachmentId ? attachmentPath(attachmentId) : (image.getAttribute("src") || "");
      }

      function imageMarkupCandidate(image, value, file) {
        const source = imageSourceReference(image, file);
        if (!source) return null;
        const root = image.closest(".vditor-ir, .vditor-wysiwyg, .vditor-preview");
        const occurrence = Array.from(root.querySelectorAll("img"))
          .filter(candidate => imageSourceReference(candidate, file) === source)
          .indexOf(image);
        const candidate = imageMarkupCandidates(value)
          .filter(item => item.source === source)[occurrence];
        return candidate ? { candidate, source } : null;
      }

      function replaceMarkdownImageCandidate(value, candidate, tag) {
        let start = candidate.start;
        let end = candidate.end;
        let replacement = tag;
        if (value[start - 1] === "[") {
          const linkSuffix = value.slice(end).match(
            /^\]\(\s*(<[^>\n]+>|[^\s)\n]+)(?:\s+(["'])(.*?)\2)?\s*\)/
          );
          if (linkSuffix) {
            start -= 1;
            end += linkSuffix[0].length;
            const href = linkSuffix[1].replace(/^<|>$/g, "");
            replacement = `<a href="${escapeHtmlAttribute(href)}">${tag}</a>`;
          }
        }
        return value.slice(0, start) + replacement + value.slice(end);
      }

      function setHtmlImageWidth(tag, width) {
        let updated = tag.replace(
          /\s+(?:width|height)\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]+)/gi,
          ""
        );
        const close = updated.endsWith("/>") ? "/>" : ">";
        updated = updated.slice(0, -close.length).replace(/\s+$/, "");
        return `${updated} width="${width}"${close}`;
      }

      function setHtmlImageAlignment(tag, alignment) {
        const preservedStyles = htmlAttribute(tag, "style")
          .split(";")
          .map(declaration => declaration.trim())
          .filter(Boolean)
          .filter(declaration => !/^(?:display|margin(?:-left|-right)?)\s*:/i.test(declaration));
        preservedStyles.push(imageAlignmentStyle(alignment).replace(/;$/, ""));
        const style = `${preservedStyles.join("; ")};`;
        let updated = tag.replace(
          /\s+style\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]+)/i,
          ""
        );
        const close = updated.endsWith("/>") ? "/>" : ">";
        updated = updated.slice(0, -close.length).replace(/\s+$/, "");
        return `${updated} style="${escapeHtmlAttribute(style)}"${close}`;
      }

      function genericImageResize(image, value, width, file) {
        const match = imageMarkupCandidate(image, value, file);
        if (!match) return null;
        const { candidate, source } = match;

        if (candidate.type === "html") {
          const replacement = setHtmlImageWidth(candidate.markup, width);
          return value.slice(0, candidate.start) + replacement + value.slice(candidate.end);
        }

        const tag = imageHtml(source, image.getAttribute("alt"), image.getAttribute("title"), width);
        return replaceMarkdownImageCandidate(value, candidate, tag);
      }

      function genericImageAlignment(image, value, alignment, file) {
        const match = imageMarkupCandidate(image, value, file);
        if (!match) return null;
        const { candidate, source } = match;
        if (candidate.type === "html") {
          const replacement = setHtmlImageAlignment(candidate.markup, alignment);
          return value.slice(0, candidate.start) + replacement + value.slice(candidate.end);
        }
        const tag = imageHtml(
          source,
          image.getAttribute("alt"),
          image.getAttribute("title"),
          null,
          alignment
        );
        return replaceMarkdownImageCandidate(value, candidate, tag);
      }

      function applyImageUpdate(file, value, updated, message) {
        if (!updated || updated === value) return false;
        const before = documentSnapshot(file);
        file.text = updated;
        if (!file.builtin) {
          file.dirty = true;
          scheduleAutoSave(file);
          scheduleSessionSave();
        }
        imageResizeSession = null;
        hideImageResizer();
        setEditorValue(file, updated);
        renderFiles();
        updateStatus(message);
        scheduleAttachmentPreviews();
        recordDocumentMutation(file, before, { label: message.toLocaleLowerCase() });
        return true;
      }

      function commitImageResize(image, width) {
        const file = activeFile();
        if (!file || !editorReady) return false;
        const value = canonicalEditorText(editor.getValue(), file);
        const source = imageSourceReference(image, file);
        const tag = source
          ? imageHtml(source, image.getAttribute("alt"), image.getAttribute("title"), width)
          : null;
        const updated = (tag && directMarkdownImageReplacement(image, value, tag))
          || genericImageResize(image, value, width, file);
        return applyImageUpdate(file, value, updated, `Image resized to ${width}px`);
      }

      function commitImageAlignment(image, alignment) {
        if (!image || !["left", "center", "right"].includes(alignment)) return false;
        const file = activeFile();
        if (!file || !editorReady) return false;
        const value = canonicalEditorText(editor.getValue(), file);
        const source = imageSourceReference(image, file);
        const tag = source
          ? imageHtml(
            source,
            image.getAttribute("alt"),
            image.getAttribute("title"),
            null,
            alignment
          )
          : null;
        const updated = (tag && directMarkdownImageReplacement(image, value, tag))
          || genericImageAlignment(image, value, alignment, file);
        const label = alignment === "center" ? "centre" : alignment;
        return applyImageUpdate(file, value, updated, `Image aligned ${label}`);
      }

      function startImageResize(event) {
        if (!selectedImage?.isConnected || event.button !== 0) return;
        event.preventDefault();
        event.stopPropagation();
        const image = selectedImage;
        const rect = image.getBoundingClientRect();
        const corner = event.currentTarget.dataset.corner;
        const container = image.closest("td, th, [data-block]") || image.parentElement;
        const maximumWidth = Math.max(
          minimumImageWidth,
          Math.floor((container?.getBoundingClientRect().width || innerWidth) - 8)
        );
        imageResizeSession = {
          image,
          pointerId: event.pointerId,
          corner,
          startX: event.clientX,
          startY: event.clientY,
          startWidth: rect.width,
          aspectRatio: rect.width / rect.height,
          maximumWidth,
          inlineWidth: image.style.width,
          inlineHeight: image.style.height,
          width: Math.round(rect.width)
        };
        event.currentTarget.setPointerCapture(event.pointerId);
      }

      function continueImageResize(event) {
        const resize = imageResizeSession;
        if (!resize || resize.pointerId !== event.pointerId) return;
        event.preventDefault();
        const horizontalDirection = resize.corner.endsWith("e") ? 1 : -1;
        const verticalDirection = resize.corner.startsWith("s") ? 1 : -1;
        const diagonalY = verticalDirection / resize.aspectRatio;
        const delta = ((event.clientX - resize.startX) * horizontalDirection
          + (event.clientY - resize.startY) * diagonalY)
          / (1 + diagonalY ** 2);
        const width = Math.round(Math.max(
          minimumImageWidth,
          Math.min(resize.maximumWidth, resize.startWidth + delta)
        ));
        resize.width = width;
        resize.image.style.width = `${width}px`;
        resize.image.style.height = "auto";
        positionImageResizer();
      }

      function finishImageResize(event, commit = true) {
        const resize = imageResizeSession;
        if (!resize || resize.pointerId !== event.pointerId) return;
        event.preventDefault();
        imageResizeSession = null;
        if (commit && resize.width === Math.round(resize.startWidth)) commit = false;
        if (commit && commitImageResize(resize.image, resize.width)) return;
        resize.image.style.width = resize.inlineWidth;
        resize.image.style.height = resize.inlineHeight;
        hideImageResizer();
        if (commit) updateStatus("Could not resize this image");
      }

      function noteTitle(file) {
        const first = file.text.split("\n").find(line => line.trim()) || "Untitled";
        return first.replace(/^#{1,6}\s+/, "").trim() || "Untitled";
      }

      function suggestedFileName(file) {
        const preferred = file.name !== "Untitled.md"
          ? file.name.replace(/\.(?:md|markdown)$/i, "")
          : noteTitle(file);
        const safe = preferred
          .replace(/[<>:"/\\|?*\u0000-\u001F]/g, "-")
          .replace(/[.\s]+$/, "")
          .slice(0, 80);
        return `${safe || "Untitled"}.md`;
      }

      function nextUntitledName() {
        const names = new Set(session.files.map(file => file.name.toLowerCase()));
        for (let number = 1; number <= 1000; number += 1) {
          const name = number === 1 ? "Untitled.md" : `Untitled-${number}.md`;
          if (!names.has(name.toLowerCase())) return name;
        }
        return `Untitled-${Date.now()}.md`;
      }

      function createAttachmentId(file) {
        let id;
        do {
          if (typeof crypto.getRandomValues === "function") {
            const bytes = crypto.getRandomValues(new Uint8Array(6));
            id = Array.from(bytes, byte => byte.toString(16).padStart(2, "0")).join("");
          } else {
            id = `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}`;
          }
        } while (file.attachments.has(id));
        return id;
      }

      function attachmentPath(id) {
        return `${attachmentPathPrefix}${id}`;
      }

      function markdownTextWithoutAttachments(storedText) {
        const blockIndex = storedText.lastIndexOf(attachmentBlockStart);
        if (blockIndex === -1) return storedText;
        const body = storedText.slice(0, blockIndex);
        const block = storedText.slice(blockIndex).trimEnd();
        if ((blockIndex && !body.endsWith("\n\n"))
            || !block.startsWith(`${attachmentBlockStart}\n`)
            || !block.endsWith(`\n${attachmentBlockEnd}`)) {
          return storedText;
        }
        return body.replace(/\n+$/, "");
      }

      function parseStoredMarkdown(storedText) {
        const match = storedText.match(
          /(?:\n{2,}|^)<!-- LocalMarkdown attachments:v1\n([\s\S]*?)\n-->\s*$/
        );
        if (!match) return { text: storedText, attachments: new Map(), warning: null };

        try {
          const manifest = JSON.parse(match[1]);
          if (manifest?.version !== 1 || !Array.isArray(manifest.attachments)) {
            throw new Error("Unsupported attachment manifest");
          }

          const attachments = new Map();
          for (const item of manifest.attachments) {
            if (!item || typeof item.id !== "string"
                || typeof item.type !== "string" || !item.type.startsWith("image/")
                || typeof item.data !== "string") continue;
            attachments.set(item.id, {
              id: item.id,
              type: item.type,
              data: item.data,
              kind: item.kind === "excalidraw" ? "excalidraw" : null,
              blob: null,
              pending: null,
              error: false
            });
          }

          return {
            text: storedText.slice(0, match.index).replace(/\n+$/, ""),
            attachments,
            warning: null
          };
        } catch {
          return {
            text: storedText,
            attachments: new Map(),
            warning: "Attachment data could not be read"
          };
        }
      }

      function referencedAttachmentIds(text) {
        const ids = new Set();
        const pattern = new RegExp(`(?:${attachmentPathPrefixPattern})([a-z\\d-]+)`, "gi");
        for (const match of text.matchAll(pattern)) ids.add(match[1]);
        return ids;
      }

      function revokeAttachmentPreview(fileId, attachmentId) {
        const key = `${fileId}\n${attachmentId}`;
        const url = attachmentPreviewUrls.get(key);
        if (!url) return;
        URL.revokeObjectURL(url);
        attachmentPreviewUrls.delete(key);
        attachmentPreviewReferences.delete(url);
      }

      function releaseAttachmentPreviews(fileId = null) {
        for (const [key, url] of attachmentPreviewUrls) {
          if (!fileId || key.startsWith(`${fileId}\n`)) {
            URL.revokeObjectURL(url);
            attachmentPreviewUrls.delete(key);
            attachmentPreviewReferences.delete(url);
          }
        }
      }

      function preserveStoredTableWidths(value, storedValue) {
        const storedTables = markdownTableBlocks(storedValue);
        const tables = markdownTableBlocks(value);
        let updated = value;
        for (let index = Math.min(storedTables.length, tables.length) - 1;
          index >= 0; index -= 1) {
          const stored = storedTables[index];
          const table = tables[index];
          if (!stored.widths || stored.columnCount !== table.columnCount) continue;
          updated = replaceTableWidthsMetadata(
            updated, table, stored.widths, stored.tableWidth);
        }
        return updated;
      }

      function canonicalEditorText(value, file) {
        let canonical = value;
        for (const [key, url] of attachmentPreviewUrls) {
          if (!key.startsWith(`${file.id}\n`)) continue;
          const id = key.slice(file.id.length + 1);
          canonical = canonical.split(url).join(attachmentPath(id));
        }
        if (file.tableWidthsOutOfSync) {
          if (editor?.getCurrentMode() === "sv") {
            file.tableWidthsOutOfSync = false;
          } else {
            const merged = preserveStoredTableWidths(canonical, file.text);
            if (merged === canonical) file.tableWidthsOutOfSync = false;
            canonical = merged;
          }
        }
        return canonical;
      }

      function setEditorValue(file, value = file.text) {
        editor.setValue(value, true);
        file.tableWidthsOutOfSync = false;
      }

      function pruneUnusedAttachments(file) {
        const referenced = referencedAttachmentIds(file.text);
        for (const id of file.attachments.keys()) {
          if (referenced.has(id)) continue;
          revokeAttachmentPreview(file.id, id);
          file.attachments.delete(id);
        }
        return referenced;
      }

      function serializeFile(file) {
        const referenced = pruneUnusedAttachments(file);
        const attachments = [];
        for (const [id, attachment] of file.attachments) {
          if (!referenced.has(id) || !attachment.data) continue;
          attachments.push({
            id,
            type: attachment.type,
            data: attachment.data,
            ...(attachment.kind === "excalidraw" ? { kind: "excalidraw" } : {})
          });
        }
        if (!attachments.length) return file.text;

        const body = file.text.replace(/\n+$/, "");
        const manifest = JSON.stringify({ version: 1, attachments });
        return `${body}\n\n${attachmentBlockStart}\n${manifest}\n${attachmentBlockEnd}\n`;
      }

      function attachmentIdFromSource(source) {
        if (!source) return null;
        const match = source.match(new RegExp(
          `(?:^|/)(?:${attachmentPathPrefixPattern})([a-z\\d-]+)(?:[?#].*)?$`,
          "i"
        ));
        return match?.[1] || null;
      }

      function attachmentIdForImage(image, file) {
        const source = image.getAttribute("src");
        const previewReference = attachmentPreviewReferences.get(source);
        const previewId = previewReference?.fileId === file.id
          ? previewReference.attachmentId
          : null;
        const candidates = [
          image.dataset.localMarkdownAttachment,
          attachmentImageIds.get(image),
          attachmentIdFromSource(source),
          previewId
        ];
        return candidates.find(id => id && file.attachments.has(id)) || null;
      }

      function excalidrawAttachmentFromEvent(event) {
        const image = event.target.closest?.("img");
        if (!image || !editorElement.contains(image)) return null;
        const file = activeFile();
        const id = file ? attachmentIdForImage(image, file) : null;
        return file?.attachments.get(id)?.kind === "excalidraw" ? { file, id } : null;
      }

      function attachmentBlob(attachment) {
        if (attachment.blob) return attachment.blob;
        const binary = atob(attachment.data);
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) {
          bytes[index] = binary.charCodeAt(index);
        }
        attachment.blob = new Blob([bytes], { type: attachment.type });
        return attachment.blob;
      }

      function refreshAttachmentPreviews() {
        if (!editorReady) return;
        const file = activeFile();
        if (!file || file.builtin || !file.attachments.size) return;
        const images = editorElement.querySelectorAll(
          ".vditor-ir img[src], .vditor-wysiwyg img[src], .vditor-preview img[src]"
        );
        for (const image of images) {
          const id = attachmentIdForImage(image, file);
          const attachment = id ? file.attachments.get(id) : null;
          if (!attachment || activeFile() !== file) continue;

          const key = `${file.id}\n${id}`;
          let url = attachmentPreviewUrls.get(key);
          if (!url) {
            try {
              url = URL.createObjectURL(attachmentBlob(attachment));
              attachmentPreviewUrls.set(key, url);
              attachmentPreviewReferences.set(url, { fileId: file.id, attachmentId: id });
            } catch {
              continue;
            }
          }
          attachmentImageIds.set(image, id);
          image.dataset.localMarkdownAttachment = id;
          const isDrawing = attachment.kind === "excalidraw";
          image.classList.toggle("LocalMarkdown-excalidraw-image", isDrawing);
          if (image.getAttribute("src") !== url) image.src = url;
        }
      }

      function scheduleAttachmentPreviews() {
        clearTimeout(attachmentPreviewTimer);
        attachmentPreviewTimer = setTimeout(() => {
          attachmentPreviewTimer = null;
          refreshAttachmentPreviews();
        }, 0);
      }

      function observeAttachmentPreviews() {
        if (attachmentPreviewObserver || typeof MutationObserver !== "function") return;
        attachmentPreviewObserver = new MutationObserver(() => {
          refreshAttachmentPreviews();
          scheduleTableWidths();
        });
        attachmentPreviewObserver.observe(editorElement, {
          subtree: true,
          childList: true,
          attributes: true,
          attributeFilter: ["src"]
        });
      }

      function readBlobPayload(blob) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.addEventListener("load", () => {
            const result = String(reader.result || "");
            const comma = result.indexOf(",");
            if (comma < 0) reject(new Error("Could not encode image"));
            else resolve({ type: blob.type || "image/png", data: result.slice(comma + 1), blob });
          });
          reader.addEventListener("error", () => reject(reader.error || new Error("Could not read image")));
          reader.readAsDataURL(blob);
        });
      }

      function loadExcalidrawStyles() {
        if (!excalidrawStylesPromise) {
          excalidrawStylesPromise = new Promise((resolve, reject) => {
            const existing = document.querySelector("#LocalMarkdown-excalidraw-styles");
            if (existing?.sheet) {
              resolve();
              return;
            }
            const link = existing || document.createElement("link");
            link.id = "LocalMarkdown-excalidraw-styles";
            link.rel = "stylesheet";
            link.href = "https://esm.sh/@excalidraw/excalidraw@0.18.1/dist/prod/index.css";
            link.addEventListener("load", resolve, { once: true });
            link.addEventListener("error", () => reject(new Error("Could not load Excalidraw styles")), { once: true });
            if (!existing) document.head.append(link);
          }).catch(error => {
            excalidrawStylesPromise = null;
            document.querySelector("#LocalMarkdown-excalidraw-styles")?.remove();
            throw error;
          });
        }
        return excalidrawStylesPromise;
      }

      function loadExcalidrawModules() {
        if (!excalidrawModulesPromise) {
          excalidrawModulesPromise = Promise.all([
            loadExcalidrawStyles(),
            import("react"),
            import("react-dom/client"),
            import("@excalidraw/excalidraw")
          ]).then(([, reactModule, reactDomModule, excalidrawModule]) => ({
            React: reactModule.default || reactModule,
            createRoot: reactDomModule.createRoot,
            Excalidraw: excalidrawModule.Excalidraw,
            exportToSvg: excalidrawModule.exportToSvg,
            loadFromBlob: excalidrawModule.loadFromBlob
          })).catch(error => {
            excalidrawModulesPromise = null;
            throw error;
          });
        }
        return excalidrawModulesPromise;
      }

      function closeDrawingDialog({ focusEditor = true } = {}) {
        drawingSession = null;
        if (drawingRoot) {
          drawingRoot.unmount();
          drawingRoot = null;
        }
        drawingCanvas.replaceChildren();
        drawingStatus.textContent = "";
        drawingLoading.textContent = "Loading Excalidraw…";
        drawingLoading.hidden = false;
        drawingSaveButton.disabled = true;
        drawingSaveButton.textContent = "Insert";
        if (drawingDialog.open) drawingDialog.close();
        if (focusEditor) editor?.focus();
      }

      async function openDrawingDialog(attachmentId = null) {
        if (!editorReady || drawingSession) return;
        captureEditorValue();
        const file = activeFile();
        if (!file || file.builtin || file.welcome) {
          updateStatus("Create or open a Markdown file before drawing");
          return;
        }

        const attachment = attachmentId ? file.attachments.get(attachmentId) : null;
        if (attachmentId && attachment?.kind !== "excalidraw") return;

        const token = {};
        drawingSession = {
          token,
          file,
          editorRange: currentEditorRange(file),
          attachmentId,
          modules: null,
          elements: [],
          appState: { viewBackgroundColor: "#ffffff" },
          files: {}
        };
        drawingSaveButton.textContent = attachmentId ? "Update" : "Insert";
        drawingSaveButton.disabled = true;
        drawingStatus.textContent = attachmentId ? "Opening drawing…" : "Starting a new drawing…";
        drawingLoading.textContent = "Loading Excalidraw…";
        drawingLoading.hidden = false;
        drawingDialog.showModal();

        try {
          const modules = await loadExcalidrawModules();
          let initialData = {
            elements: [],
            appState: { viewBackgroundColor: "#ffffff" },
            files: {},
            scrollToContent: true
          };
          if (attachment) {
            initialData = await modules.loadFromBlob(attachmentBlob(attachment), null, null);
            initialData.scrollToContent = true;
          }
          if (drawingSession?.token !== token) return;

          drawingSession.modules = modules;
          drawingSession.elements = initialData.elements || [];
          drawingSession.appState = initialData.appState || { viewBackgroundColor: "#ffffff" };
          drawingSession.files = initialData.files || {};
          drawingSaveButton.disabled = !drawingSession.elements.some(element => !element.isDeleted);
          drawingStatus.textContent = attachmentId
            ? "Edit the drawing, then select Update"
            : "Draw, then select Insert";

          const { React, createRoot, Excalidraw } = modules;
          drawingRoot = createRoot(drawingCanvas);
          drawingRoot.render(React.createElement(Excalidraw, {
            initialData,
            theme: document.documentElement.dataset.theme === "solarized-dark" ? "dark" : "light",
            autoFocus: true,
            UIOptions: {
              canvasActions: {
                loadScene: false,
                saveToActiveFile: false,
                export: false,
                saveAsImage: false,
                toggleTheme: false
              }
            },
            onChange(elements, appState, files) {
              if (drawingSession?.token !== token) return;
              drawingSession.elements = elements;
              drawingSession.appState = appState;
              drawingSession.files = files;
              drawingSaveButton.disabled = !elements.some(element => !element.isDeleted);
            }
          }));
          drawingLoading.hidden = true;
        } catch (error) {
          console.error("Local Markdown could not load Excalidraw.", error);
          if (drawingSession?.token !== token) return;
          drawingStatus.textContent = "Excalidraw could not be loaded";
          drawingLoading.textContent = "Could not load Excalidraw. Check your internet connection and try again.";
          drawingLoading.hidden = false;
        }
      }

      async function commitDrawing() {
        const current = drawingSession;
        if (!current?.modules || drawingSaveButton.disabled) return;
        const visibleElements = current.elements.filter(element => !element.isDeleted);
        if (!visibleElements.length) return;

        drawingSaveButton.disabled = true;
        drawingStatus.textContent = "Rendering drawing…";
        try {
          const svg = await current.modules.exportToSvg({
            elements: current.elements,
            appState: {
              ...current.appState,
              exportBackground: true,
              exportEmbedScene: true,
              exportWithDarkMode: false
            },
            files: current.files,
            exportPadding: 16
          });
          const svgText = new XMLSerializer().serializeToString(svg);
          const payload = await readBlobPayload(new Blob([svgText], { type: "image/svg+xml" }));
          if (drawingSession !== current || !session.files.includes(current.file)) return;

          const isNew = !current.attachmentId;
          const id = current.attachmentId || createAttachmentId(current.file);
          const before = documentSnapshot(current.file);
          let editorValuePromise = null;
          documentHistoryRecordingDepth += 1;
          try {
            revokeAttachmentPreview(current.file.id, id);
            current.file.attachments.set(id, {
              id,
              type: "image/svg+xml",
              data: payload.data,
              kind: "excalidraw",
              blob: payload.blob,
              pending: null,
              error: false
            });

            if (isNew) {
              if (drawingDialog.open) drawingDialog.close();
              restoreEditorRange(current.editorRange);
              editorValuePromise = waitForEditorHistoryValue(current.file, before.text);
              editor.insertEmptyBlock("afterend");
              editor.insertMD(`\n\n![Excalidraw drawing](${attachmentPath(id)})\n\n`);
              drawingDialog.showModal();
            }
          } finally {
            documentHistoryRecordingDepth -= 1;
          }
          if (isNew) {
            current.file.text = await editorValuePromise;
          }
          closeDrawingDialog({ focusEditor: false });
          current.file.dirty = true;
          renderFiles();
          scheduleAttachmentPreviews();
          scheduleAutoSave(current.file);
          scheduleSessionSave();
          recordDocumentMutation(current.file, before, {
            label: isNew ? "drawing insertion" : "drawing update"
          });
          updateStatus(isNew ? "Drawing embedded in Markdown" : "Drawing updated");
          editor.focus();
        } catch (error) {
          console.error("Local Markdown could not save the drawing.", error);
          if (drawingSession !== current) return;
          drawingStatus.textContent = "Could not render drawing";
          drawingSaveButton.disabled = false;
        }
      }

      function canvasToBlob(canvas, type, quality) {
        return new Promise((resolve, reject) => {
          canvas.toBlob(
            blob => blob ? resolve(blob) : reject(new Error("Could not encode image")),
            type,
            quality
          );
        });
      }

      async function optimizeImageOnMainThread(file) {
        if (["image/gif", "image/svg+xml"].includes(file.type)) return readBlobPayload(file);
        try {
          const bitmap = await createImageBitmap(file);
          const scale = Math.min(1, pastedImageMaxDimension / Math.max(bitmap.width, bitmap.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(bitmap.width * scale));
          canvas.height = Math.max(1, Math.round(bitmap.height * scale));
          canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
          bitmap.close();
          const candidate = await canvasToBlob(canvas, "image/webp", pastedImageWebpQuality);
          const optimized = scale < 1 || candidate.size < file.size * 0.9 ? candidate : file;
          return readBlobPayload(optimized);
        } catch {
          return readBlobPayload(file);
        }
      }

      function getImageWorker() {
        if (imageWorker) return imageWorker;
        if (typeof Worker !== "function" || typeof OffscreenCanvas !== "function") return null;

        const source = `
          const readBlobPayload = blob => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => {
              const result = String(reader.result || "");
              const comma = result.indexOf(",");
              if (comma < 0) reject(new Error("Could not encode image"));
              else resolve({ type: blob.type || "image/png", data: result.slice(comma + 1), blob });
            };
            reader.onerror = () => reject(reader.error || new Error("Could not read image"));
            reader.readAsDataURL(blob);
          });

          const optimize = async (file, maxDimension, quality) => {
            if (["image/gif", "image/svg+xml"].includes(file.type)) return readBlobPayload(file);
            try {
              const bitmap = await createImageBitmap(file);
              const scale = Math.min(1, maxDimension / Math.max(bitmap.width, bitmap.height));
              const canvas = new OffscreenCanvas(
                Math.max(1, Math.round(bitmap.width * scale)),
                Math.max(1, Math.round(bitmap.height * scale))
              );
              canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
              bitmap.close();
              const candidate = await canvas.convertToBlob({ type: "image/webp", quality });
              const optimized = scale < 1 || candidate.size < file.size * 0.9 ? candidate : file;
              return readBlobPayload(optimized);
            } catch {
              return readBlobPayload(file);
            }
          };

          self.onmessage = async event => {
            const { requestId, file, maxDimension, quality } = event.data;
            try {
              const result = await optimize(file, maxDimension, quality);
              self.postMessage({ requestId, result });
            } catch (error) {
              self.postMessage({ requestId, error: error?.message || "Could not process image" });
            }
          };
        `;

        imageWorkerUrl = URL.createObjectURL(new Blob([source], { type: "text/javascript" }));
        imageWorker = new Worker(imageWorkerUrl);
        imageWorker.addEventListener("message", event => {
          const request = imageWorkerRequests.get(event.data.requestId);
          if (!request) return;
          imageWorkerRequests.delete(event.data.requestId);
          clearTimeout(request.timer);
          if (event.data.error) request.reject(new Error(event.data.error));
          else request.resolve(event.data.result);
        });
        imageWorker.addEventListener("error", () => {
          for (const request of imageWorkerRequests.values()) {
            clearTimeout(request.timer);
            request.reject(new Error("Image worker failed"));
          }
          imageWorkerRequests.clear();
          imageWorker?.terminate();
          imageWorker = null;
          if (imageWorkerUrl) URL.revokeObjectURL(imageWorkerUrl);
          imageWorkerUrl = null;
        });
        return imageWorker;
      }

      function optimizeImageInWorker(file) {
        const worker = getImageWorker();
        if (!worker) return optimizeImageOnMainThread(file);
        const requestId = ++imageWorkerRequestId;
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            imageWorkerRequests.delete(requestId);
            reject(new Error("Image processing timed out"));
          }, 30000);
          imageWorkerRequests.set(requestId, { resolve, reject, timer });
          worker.postMessage({
            requestId,
            file,
            maxDimension: pastedImageMaxDimension,
            quality: pastedImageWebpQuality
          });
        }).catch(() => optimizeImageOnMainThread(file));
      }

      async function processPastedAttachment(file, attachment, image) {
        const operation = (async () => {
          const result = await optimizeImageInWorker(image);
          attachment.type = result.type;
          attachment.data = result.data;
          attachment.blob = result.blob;
          attachment.error = false;
          revokeAttachmentPreview(file.id, attachment.id);
          if (activeFile() === file) scheduleAttachmentPreviews();
          file.dirty = true;
          scheduleAutoSave(file);
          scheduleSessionSave();
          return true;
        })().catch(() => {
          attachment.error = true;
          if (activeFile() === file) updateStatus("Could not embed pasted image");
          return false;
        });

        attachment.pending = operation;
        try {
          return await operation;
        } finally {
          if (attachment.pending === operation) attachment.pending = null;
        }
      }

      async function waitForFileAttachments(file) {
        const pending = Array.from(file.attachments.values())
          .map(attachment => attachment.pending)
          .filter(Boolean);
        if (pending.length) await Promise.allSettled(pending);
        const referenced = referencedAttachmentIds(file.text);
        return Array.from(referenced).every(id => {
          const attachment = file.attachments.get(id);
          return attachment?.data && !attachment.error;
        });
      }

      async function pasteEmbeddedImages(files) {
        const images = Array.from(files || []).filter(file => file?.type?.startsWith("image/"));
        if (!images.length || !editorReady) return null;

        const file = activeFile();
        if (!file || file.builtin || file.welcome) {
          updateStatus("Create or open a Markdown file before pasting images");
          return "Create or open a Markdown file before pasting images";
        }

        const before = documentSnapshot(file);
        let attachments;
        let editorValuePromise;
        documentHistoryRecordingDepth += 1;
        try {
          attachments = images.map(image => {
            const id = createAttachmentId(file);
            const attachment = {
              id,
              type: image.type || "image/png",
              data: null,
              blob: image,
              pending: null,
              error: false
            };
            file.attachments.set(id, attachment);
            return { attachment, image };
          });

          editorValuePromise = waitForEditorHistoryValue(file, before.text);
          editor.insertMD(attachments
            .map(({ attachment }) => `![Pasted image](${attachmentPath(attachment.id)})`)
            .join("\n\n"));
          file.text = canonicalEditorText(editor.getValue(), file);
        } finally {
          documentHistoryRecordingDepth -= 1;
        }
        file.text = await editorValuePromise;
        file.dirty = true;
        renderFiles();
        scheduleAttachmentPreviews();
        scheduleAutoSave(file);
        scheduleSessionSave();
        recordDocumentMutation(file, before, {
          label: images.length === 1 ? "image paste" : "image paste batch"
        });
        updateStatus(images.length === 1 ? "Embedding pasted image…" : `Embedding ${images.length} images…`);

        const results = await Promise.all(attachments.map(({ attachment, image }) =>
          processPastedAttachment(file, attachment, image)));

        if (activeFile() === file && results.every(Boolean)) {
          updateStatus(images.length === 1
            ? "Image embedded in Markdown"
            : `${images.length} images embedded in Markdown`);
        }
        renderFiles();
        scheduleAutoSave(file);
        scheduleSessionSave();
        return null;
      }

      function pastedUrlFromText(text) {
        const candidate = String(text || "").trim();
        if (!candidate || /\s/.test(candidate)) return null;
        try {
          const url = new URL(candidate);
          return ["http:", "https:"].includes(url.protocol) ? url : null;
        } catch {
          return null;
        }
      }

      function cleanLinkTitle(value) {
        return String(value || "").replace(/\s+/g, " ").trim().slice(0, 300);
      }

      function decodedUrlSegment(value) {
        try {
          return decodeURIComponent(value);
        } catch {
          return value;
        }
      }

      function urlFilename(url) {
        const segment = url.pathname.split("/").filter(Boolean).at(-1) || "";
        return cleanLinkTitle(decodedUrlSegment(segment));
      }

      function isLikelyFileUrl(url) {
        const extension = urlFilename(url).match(/\.([a-z0-9]{1,12})$/i)?.[1]?.toLowerCase();
        return Boolean(extension && !pastedLinkWebPageExtensions.has(extension));
      }

      function fallbackLinkTitle(url) {
        const filename = urlFilename(url);
        if (/\.pdf$/i.test(filename)) return filename;
        const pageName = filename
          .replace(/\.(?:html?|xhtml)$/i, "")
          .replace(/[-_]+/g, " ");
        if (pageName && !/^index$/i.test(pageName)) return cleanLinkTitle(pageName);
        return url.hostname.replace(/^www\./i, "") || url.href;
      }

      function clipboardLinkTitle(html, url) {
        if (!html) return "";
        const documentFragment = new DOMParser().parseFromString(html, "text/html");
        for (const anchor of documentFragment.querySelectorAll("a[href]")) {
          let href;
          try {
            href = new URL(anchor.getAttribute("href"), url).href;
          } catch {
            continue;
          }
          const title = cleanLinkTitle(anchor.textContent);
          const titleUrl = pastedUrlFromText(title);
          if (href === url.href && title && titleUrl?.href !== url.href) return title;
        }
        return "";
      }

      async function responseTextPrefix(response, byteLimit) {
        if (!response.body?.getReader) return (await response.text()).slice(0, byteLimit);
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let text = "";
        let bytesRead = 0;
        try {
          while (bytesRead < byteLimit) {
            const { value, done } = await reader.read();
            if (done) break;
            const remaining = byteLimit - bytesRead;
            const chunk = value.byteLength > remaining ? value.subarray(0, remaining) : value;
            bytesRead += chunk.byteLength;
            text += decoder.decode(chunk, { stream: bytesRead < byteLimit });
          }
          text += decoder.decode();
        } finally {
          void reader.cancel().catch(() => {});
        }
        return text;
      }

      async function fetchLinkTitle(url) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), pastedLinkTitleTimeout);
        try {
          const response = await fetch(url.href, {
            credentials: "omit",
            referrerPolicy: "no-referrer",
            signal: controller.signal
          });
          if (!response.ok) return "";
          const contentType = response.headers.get("content-type") || "";
          if (contentType && !/\b(?:text\/html|application\/xhtml\+xml)\b/i.test(contentType)) {
            return "";
          }
          const html = await responseTextPrefix(response, pastedLinkTitleByteLimit);
          return cleanLinkTitle(new DOMParser()
            .parseFromString(html, "text/html")
            .querySelector("title")?.textContent);
        } catch {
          return "";
        } finally {
          clearTimeout(timer);
        }
      }

      function hostnameMatches(hostname, candidate) {
        return hostname === candidate || hostname.endsWith(`.${candidate}`);
      }

      function oEmbedRequestUrl(url) {
        const provider = pastedLinkOEmbedProviders.find(candidate =>
          candidate.hosts.some(host => hostnameMatches(url.hostname, host)));
        if (!provider) return null;
        const requestUrl = new URL(provider.endpoint);
        requestUrl.searchParams.set("url", url.href);
        if (provider.format) requestUrl.searchParams.set("format", "json");
        return requestUrl;
      }

      async function fetchOEmbedTitle(url) {
        const requestUrl = oEmbedRequestUrl(url);
        if (!requestUrl) return null;
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), pastedLinkTitleTimeout);
        try {
          const response = await fetch(requestUrl.href, {
            credentials: "omit",
            referrerPolicy: "no-referrer",
            signal: controller.signal
          });
          if (!response.ok) return "";
          const result = await response.json();
          return cleanLinkTitle(result?.title);
        } catch {
          return "";
        } finally {
          clearTimeout(timer);
        }
      }

      async function resolveRemoteLinkTitle(url) {
        const oEmbedTitle = await fetchOEmbedTitle(url);
        if (oEmbedTitle !== null) return oEmbedTitle;
        return fetchLinkTitle(url);
      }

      function markdownLink(title, url) {
        const label = title.replace(/\\/g, "\\\\").replace(/[\[\]]/g, "\\$&");
        const destination = url.href.replace(/</g, "%3C").replace(/>/g, "%3E");
        return `[${label}](<${destination}>)`;
      }

      async function pasteFormattedLink(event) {
        if (!editorReady || Array.from(event.clipboardData?.files || [])
          .some(file => file.type?.startsWith("image/"))) return;

        const url = pastedUrlFromText(event.clipboardData?.getData("text/plain"));
        if (!url) return;

        event.preventDefault();
        event.stopImmediatePropagation();
        const file = activeFile();
        if (!file || file.builtin || file.welcome) {
          updateStatus("Create or open a Markdown file before pasting links");
          return;
        }

        let title = clipboardLinkTitle(event.clipboardData?.getData("text/html"), url);
        const hasOEmbedProvider = Boolean(oEmbedRequestUrl(url));
        if (!title && !hasOEmbedProvider && isLikelyFileUrl(url)) title = urlFilename(url);
        if (!title) {
          updateStatus("Getting link title…");
          title = await resolveRemoteLinkTitle(url);
        }
        if (activeFile() !== file) return;

        markEditorHistoryPending("insertFromPaste", "command");
        editor.insertMD(markdownLink(title || fallbackLinkTitle(url), url));
        updateStatus(title ? "Link pasted with title" : "Link pasted");
      }

      function handleEditorKeydown(event) {
        const surface = activeEditorSurface();
        if (!surface?.contains(event.target) || event.isComposing) return;
        const isMac = /Mac|iPhone|iPad|iPod/.test(navigator.platform);
        const commandKey = isMac ? event.metaKey : event.ctrlKey;
        const key = event.key.toLowerCase();
        const headerRowAction = editorReady && commandKey && !event.altKey
          ? (event.shiftKey && key === "f" ? "row-above"
            : (!event.shiftKey && key === "-" ? "delete-row" : null))
          : null;
        const selectedCell = headerRowAction
          ? tableCellFromNode(getSelection()?.anchorNode)
          : null;
        if (headerRowAction && selectedCell?.tagName === "TH") {
          event.preventDefault();
          event.stopImmediatePropagation();
          if (!updateTableHeaderRow(selectedCell, headerRowAction)) {
            updateStatus("Could not update the table header");
          }
          return;
        }
        const undoShortcut = editorReady && commandKey && !event.shiftKey
          && !event.altKey && key === "z";
        const redoShortcut = editorReady && commandKey && !event.altKey
          && ((event.shiftKey && key === "z") || (!event.shiftKey && key === "y"));
        if (undoShortcut || redoShortcut) {
          event.preventDefault();
          event.stopImmediatePropagation();
          if (redoShortcut) redoDocumentChange();
          else undoDocumentChange();
          return;
        }
        const commandMutation = commandKey && (
          ["=", "-", "j"].includes(key)
          || (event.shiftKey && ["f", "g", "l", "c", "r"].includes(key))
          || (event.altKey && /^[1-6]$/.test(key))
        );
        if (commandMutation) {
          markEditorHistoryPending("", "command");
        }
        if (commandKey || event.altKey || [
          "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown",
          "Home", "End", "PageUp", "PageDown", "Escape"
        ].includes(event.key)) breakDocumentHistoryCoalescing();
      }

      function taskItemCheckbox(item) {
        return Array.from(item.children).find(child =>
          child.matches('input[type="checkbox"]')) || null;
      }

      function taskItemFromEvent(event) {
        return event.target instanceof Element
          ? event.target.closest("li.vditor-task")
          : null;
      }

      function taskItemFromPoint(x, y) {
        const target = document.elementFromPoint(x, y);
        return target instanceof Element ? target.closest("li.vditor-task") : null;
      }

      function isTaskDragHandlePoint(item, event) {
        const checkbox = taskItemCheckbox(item);
        if (!checkbox) return false;
        const rect = checkbox.getBoundingClientRect();
        return event.clientX >= rect.left - 20 && event.clientX <= rect.left - 2
          && event.clientY >= rect.top - 4 && event.clientY <= rect.bottom + 4;
      }

      function clearTaskDropTarget() {
        taskDropTarget?.classList.remove(
          "LocalMarkdown-task-drop-before", "LocalMarkdown-task-drop-after");
        taskDropTarget = null;
        taskDropAfter = false;
      }

      function markTaskDropTarget(item, dropAfter) {
        if (taskDropTarget === item && taskDropAfter === dropAfter) return;
        clearTaskDropTarget();
        taskDropTarget = item;
        taskDropAfter = dropAfter;
        item.classList.add(dropAfter
          ? "LocalMarkdown-task-drop-after"
            : "LocalMarkdown-task-drop-before");
      }

      function setTaskDragHandleItem(item) {
        if (taskDragHandleItem === item) return;
        taskDragHandleItem?.classList.remove("LocalMarkdown-task-handle-hover");
        taskDragHandleItem = item;
        taskDragHandleItem?.classList.add("LocalMarkdown-task-handle-hover");
      }

      function resetTaskDrag() {
        const session = taskPointerDragSession;
        clearTaskDropTarget();
        session?.item.classList.remove("LocalMarkdown-task-dragging");
        if (session?.item.hasPointerCapture?.(session.pointerId)) {
          session.item.releasePointerCapture(session.pointerId);
        }
        taskPointerDragSession = null;
        setTaskDragHandleItem(null);
      }

      function updateTaskDragHandle(event) {
        if (taskPointerDragSession) return;
        const item = taskItemFromEvent(event);
        setTaskDragHandleItem(item?.closest(".vditor-ir, .vditor-wysiwyg")
            && isTaskDragHandlePoint(item, event) ? item : null);
      }

      function startTaskPointerDrag(event) {
        if (event.button !== 0 || taskPointerDragSession) return;
        const item = taskItemFromEvent(event);
        if (!item?.closest(".vditor-ir, .vditor-wysiwyg")
            || !isTaskDragHandlePoint(item, event)) return;
        event.preventDefault();
        event.stopPropagation();
        taskPointerDragSession = {
          item,
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          started: false
        };
        setTaskDragHandleItem(item);
        item.setPointerCapture?.(event.pointerId);
      }

      function moveTaskPointerDrag(event) {
        const session = taskPointerDragSession;
        if (!session) {
          updateTaskDragHandle(event);
          return;
        }
        if (event.pointerId !== session.pointerId) return;
        event.preventDefault();
        event.stopPropagation();
        if (!session.started) {
          const distance = Math.hypot(
            event.clientX - session.startX, event.clientY - session.startY);
          if (distance < 4) return;
          session.started = true;
          session.item.classList.add("LocalMarkdown-task-dragging");
        }

        const target = taskItemFromPoint(event.clientX, event.clientY);
        if (!target || target === session.item
            || target.parentElement !== session.item.parentElement) {
          clearTaskDropTarget();
          return;
        }
        const checkbox = taskItemCheckbox(target);
        if (!checkbox) return;
        const checkboxRect = checkbox.getBoundingClientRect();
        markTaskDropTarget(target, event.clientY >= checkboxRect.top + checkboxRect.height / 2);
      }

      function finishTaskPointerDrag(event, commit = true) {
        const session = taskPointerDragSession;
        if (!session || event.pointerId !== session.pointerId) return;
        event.preventDefault();
        event.stopPropagation();
        const item = session.item;
        const target = taskDropTarget;
        const dropAfter = taskDropAfter;
        const list = item.parentElement;
        const shouldReorder = commit && session.started && target
          && target.parentElement === list;
        resetTaskDrag();
        if (!shouldReorder) return;

        const beforeOrder = Array.from(list.children);
        const reference = dropAfter ? target.nextSibling : target;
        list.insertBefore(item, reference);
        if (beforeOrder.every((child, index) => child === list.children[index])) return;

        captureEditorValue({ label: "task reorder" });
        renderFiles();
        updateStatus("Task reordered");
      }

      function handleEditorViewShortcut(event) {
        const isMac = /Mac|iPhone|iPad|iPod/.test(navigator.platform);
        const commandKey = isMac ? event.metaKey : event.ctrlKey;
        if (!editorReady || !commandKey || !event.altKey || event.shiftKey) return;
        const mode = ({ Digit7: "wysiwyg", Digit8: "ir", Digit9: "sv" })[event.code];
        if (!mode) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        switchEditorMode(mode);
      }

      async function writeText(handle, text) {
        const writable = await handle.createWritable();
        await writable.write(text);
        await writable.close();

      function cancelAutoSave(file) {
        const timer = autoSaveTimers.get(file.id);
        if (timer) clearTimeout(timer);
        autoSaveTimers.delete(file.id);

      async function pickMarkdownFile(file, { reuseLastLocation = true } = {}) {
        if (typeof window.showSaveFilePicker !== "function") {
          updateStatus("Saving local files requires Chrome");
          return null;
        }
        try {
          const options = markdownPickerOptions({
            suggestedName: suggestedFileName(file),
            excludeAcceptAllOption: true

          if (!reuseLastLocation) delete options.startIn;
          return await window.showSaveFilePicker(options);

      async function saveFile(file) {
        if (file.builtin || !file.handle) return false;
        const currentSave = activeSaves.get(file.id);
        if (currentSave) {
          if (!await currentSave) return false;
          return file.dirty ? saveFile(file) : true;
        }

        const operation = (async () => {
          if (!await waitForFileAttachments(file)) return false;
          const text = file.text;
          const storedText = serializeFile(file);
          try {
            await writeText(file.handle, storedText);
            file.name = file.handle.name;
            file.needsPermission = false;
            if (file.text === text) file.dirty = false;
            scheduleSessionSave();
            return true;
          } catch (error) {
            if (["NotAllowedError", "SecurityError"].includes(error?.name)) {
              file.needsPermission = true;
              scheduleSessionSave();
            }
            return false;
          }
        })();

        activeSaves.set(file.id, operation);
        try {
          return await operation;
        } finally {
          activeSaves.delete(file.id);
        }
      }

      function scheduleAutoSave(file) {
        if (file.builtin || !file.handle) return;
        cancelAutoSave(file);
        const timer = setTimeout(async () => {
          autoSaveTimers.delete(file.id);
          if (!session.files.includes(file) || !file.dirty) return;
          if (activeFile() === file) updateStatus("Saving…");
          const saved = await saveFile(file);
          if (activeFile() === file) {
            updateStatus(saved
              ? (file.dirty ? "Saving…" : "Saved")
              : (file.needsPermission ? "File access required" : "Couldn’t save"));
          }
          renderFiles();
          scheduleSessionSave();
          if (saved && file.dirty) scheduleAutoSave(file);
        }, autoSaveDelay);
        autoSaveTimers.set(file.id, timer);
      }

      async function saveActiveFile() {
        captureEditorValue();
        const file = activeFile();
        if (file.builtin || file.welcome) return;

        if (file.handle && !file.needsPermission) {
          if (!file.dirty) {
            updateStatus("Saved");
            return;
          }
          updateStatus("Saving…");
          const saved = await saveFile(file);
          renderFiles();
          updateStatus(saved
            ? (file.dirty ? "Saving…" : "Saved")
            : (file.needsPermission ? "File access required" : "Couldn’t save"));
          scheduleSessionSave();
          if (saved && file.dirty) scheduleAutoSave(file);
          return;
        }

        if (file.handle) {
          updateStatus("Reconnecting…");
          try {
            const permission = typeof file.handle.requestPermission === "function"
              ? await file.handle.requestPermission({ mode: "readwrite" })
              : "granted";
            if (permission !== "granted") {
              file.needsPermission = true;
              updateStatus("File access required");
              scheduleSessionSave();
              return;
            }

            file.needsPermission = false;
            let message = "Saved";
            if (file.dirty) {
              const saved = await saveFile(file);
              message = saved ? "Saved" : "Couldn’t save";
            } else {
              message = await loadFileFromHandle(file) || message;
              if (editorReady && activeFile() === file) setEditorValue(file);
              scheduleAttachmentPreviews();
            }
            renderFiles();
            updateStatus(message);
            scheduleSessionSave();
          } catch {
            file.needsPermission = true;
            updateStatus("Couldn’t reconnect");
            scheduleSessionSave();
          }
          return;
        }

        updateStatus("Choose where to save the file…");
        const previousName = file.name;
        const handle = await pickMarkdownFile(file);
        if (!handle || activeFile() !== file) return;
        file.handle = handle;
        file.name = handle.name;
        file.needsPermission = false;
        cancelAutoSave(file);
        updateStatus("Saving…");
        const saved = await saveFile(file);
        if (!saved) {
          file.handle = null;
          file.name = previousName;
        } else {
          session.lastOpenHandle = handle;
          syncSidebarFileAvailability(file);
        }
        renderFiles();
        updateStatus(saved
          ? (file.dirty ? "Saving…" : "Saved")
          : "Couldn’t save");
        scheduleSessionSave();
        if (saved && file.dirty) scheduleAutoSave(file);
      }

      async function saveActiveFileAs() {
        captureEditorValue();
        const file = activeFile();
        if (file.builtin || file.welcome) return;

        updateStatus("Choose a new file…");
        const handle = await pickMarkdownFile(file, { reuseLastLocation: false });
        if (!handle || activeFile() !== file) return;
        if (!await waitForFileAttachments(file)) {
          updateStatus("Couldn’t prepare the file");
          return;
        }

        const savedText = file.text;
        try {
          await writeText(handle, serializeFile(file));
        } catch {
          updateStatus("Couldn’t save as a new file");
          return;
        }

        cancelAutoSave(file);
        file.handle = handle;
        file.name = handle.name;
        file.needsPermission = false;
        if (file.text === savedText) file.dirty = false;
        session.lastOpenHandle = handle;
        syncSidebarFileAvailability(file);
        renderFiles();
        updateStatus(file.dirty
          ? `Saved as ${file.name} — newer changes not saved`
          : `Saved as ${file.name}`);
        scheduleSessionSave();
        if (file.dirty) scheduleAutoSave(file);
      }

      async function openLocalFile(sectionId = null) {
        if (typeof window.showOpenFilePicker !== "function") {
          updateStatus("Opening local files requires Chrome");
          return;

        let handle;
        try {
          [handle] = await window.showOpenFilePicker(markdownPickerOptions({ multiple: false }));
        } catch (error) {
          if (error?.name === "AbortError") updateStatus();
          else updateStatus("Could not choose file");
          return;
        }

        for (const file of session.files) {
          if (!file.handle || typeof file.handle.isSameEntry !== "function") continue;
          try {
            if (await file.handle.isSameEntry(handle)) {
              captureEditorValue();
              activateFile(file, "File is already open");
              if (sectionId) moveFileToSection(file.id, sectionId);
              return;
            }
          } catch {}
        }

        captureEditorValue();
        updateStatus("Opening Markdown file…");
        try {
          const localFile = await handle.getFile();
          const parsed = parseStoredMarkdown(await localFile.text());
          const file = {
            id: createId(), name: localFile.name, text: parsed.text, handle,
            attachments: parsed.attachments, builtin: false, dirty: false,
            needsPermission: false
          };
          activateFile(file, parsed.warning || "Opened local file");
          if (sectionId) moveFileToSection(file.id, sectionId);
        } catch {
          updateStatus("Could not open file");
        }
