          item.dataset.action = "move-section";
          item.dataset.sectionId = destination.id;
          item.textContent = destination.name;
          fileMoveOptions.append(item);
        }
        fileContextItems = Array.from(
          fileContextMenu.querySelectorAll(".LocalMarkdown-file-context-item"));
      }

      function fileContextActionAvailable(action, target, sectionId = null) {
        const location = workspaceLocationForTarget(target);
        const file = target?.file;
        if (action === "favorite") return Boolean(favoriteKeyForTarget(target));
        if (action === "move-section") {
          return Boolean(isStandaloneSidebarFile(file)
            && (!sectionId || sectionForId(sectionId)));
        }
        if (action === "rename") {
          return Boolean(location || (file && (!file.handle || typeof file.handle.move === "function")));
        }
        if (action === "delete") {
          return Boolean(location || (file && (!file.handle || typeof file.handle.remove === "function")));
        }
        return false;
      }

      function closeFileContextMenu({ restoreFocus = false } = {}) {
        if (fileContextMenu.hidden) return;
        fileContextMenu.hidden = true;
        if (restoreFocus && fileContextTrigger?.isConnected) fileContextTrigger.focus();
        fileContextTarget = null;
        fileContextTrigger = null;
      }

      function closeSectionContextMenu({ restoreFocus = false } = {}) {
        if (sectionContextMenu.hidden) return;
        sectionContextMenu.hidden = true;
        if (restoreFocus && sectionContextTrigger?.isConnected) sectionContextTrigger.focus();
        sectionContextTarget = null;
        sectionContextTrigger = null;
      }

      function openFileContextMenu(event, target, trigger) {
        setNewMenuOpen(false);
        setThemeMenuOpen(false);
        closeSectionContextMenu();
        fileContextTarget = target;
        fileContextTrigger = trigger;
        populateFileMoveOptions(target);
        favoriteContextLabel.textContent = targetIsFavorite(target) ? "Remove from Pinned" : "Pin";
        for (const item of fileContextItems) {
          item.disabled = !fileContextActionAvailable(
            item.dataset.action, target, item.dataset.sectionId || null);
          item.title = item.disabled ? "Open the containing folder to use this action" : "";
        }
        fileContextMenu.setAttribute("aria-label", `Actions for ${targetName(target)}`);
        fileContextMenu.hidden = false;
        const triggerBounds = trigger.getBoundingClientRect();
        const menuBounds = fileContextMenu.getBoundingClientRect();
        const requestedLeft = event.clientX || triggerBounds.left + 12;
        const requestedTop = event.clientY || triggerBounds.top + triggerBounds.height;
        fileContextMenu.style.left = `${Math.max(6, Math.min(requestedLeft, innerWidth - menuBounds.width - 6))}px`;
        fileContextMenu.style.top = `${Math.max(6, Math.min(requestedTop, innerHeight - menuBounds.height - 6))}px`;
        fileContextItems.find(item => !item.disabled)?.focus();
      }

      function openSectionContextMenu(event, section, trigger) {
        setNewMenuOpen(false);
        setThemeMenuOpen(false);
        closeFileContextMenu();
        sectionContextTarget = section;
        sectionContextTrigger = trigger;
        const index = session.sidebar.sections.indexOf(section);
        for (const item of sectionContextItems) {
          const action = item.dataset.action;
          item.disabled = action === "delete" ? section.fileIds.length > 0
            : action === "move-up" ? index <= 0
            : action === "move-down" ? index === session.sidebar.sections.length - 1
            : false;
          item.title = action === "delete" && item.disabled
            ? "Move or close all files first"
            : "";
        }
        sectionContextMenu.setAttribute("aria-label", `Actions for section ${section.name}`);
        sectionContextMenu.hidden = false;
        const triggerBounds = trigger.getBoundingClientRect();
        const menuBounds = sectionContextMenu.getBoundingClientRect();
        const requestedLeft = event.clientX || triggerBounds.left + 12;
        const requestedTop = event.clientY || triggerBounds.top + triggerBounds.height;
        sectionContextMenu.style.left = `${Math.max(6, Math.min(requestedLeft, innerWidth - menuBounds.width - 6))}px`;
        sectionContextMenu.style.top = `${Math.max(6, Math.min(requestedTop, innerHeight - menuBounds.height - 6))}px`;
        sectionContextItems.find(item => !item.disabled)?.focus();
      }

      function attachFileContextMenu(element, target) {
        element.addEventListener("contextmenu", event => {
          event.preventDefault();
          openFileContextMenu(event, target, element);
        });
        element.addEventListener("keydown", event => {
          if (event.key !== "ContextMenu" && !(event.shiftKey && event.key === "F10")) return;
          event.preventDefault();
          openFileContextMenu(event, target, element);
        });
      }

      async function runFileContextAction(action, target, sectionId = null) {
        if (action === "favorite") toggleFavorite(target);
        else if (action === "rename") await renameFileTarget(target);
        else if (action === "delete") await deleteFileTarget(target);
        else if (action === "move-section" && target.file) {
          moveFileToSection(target.file.id, sectionId);
        }
      }

      async function runSectionContextAction(action, section) {
        if (action === "rename") await renameSection(section);
        else if (action === "move-up") moveSectionByOffset(section.id, -1);
        else if (action === "move-down") moveSectionByOffset(section.id, 1);
        else if (action === "delete") deleteSection(section.id);
      }

      function settleFileDialog(value) {
        const resolve = fileDialogResolve;
        fileDialogResolve = null;
        fileDialogMode = null;
        fileDialogSectionId = null;
        if (fileDialog.open) fileDialog.close();
        resolve?.(value);
      }

      function requestFileDialog(mode, name, { dirty = false, sectionId = null } = {}) {
        if (fileDialogResolve) settleFileDialog(null);
        fileDialogMode = mode;
        fileDialogSectionId = sectionId;
        const fileRenaming = mode === "rename";
        const sectionNaming = mode === "create-section" || mode === "rename-section";
        const naming = fileRenaming || sectionNaming;
        fileDialogTitle.textContent = fileRenaming ? "Rename file"
          : mode === "create-section" ? "New section"
          : mode === "rename-section" ? "Rename section"
          : "Delete file?";
        fileDialogMessage.textContent = fileRenaming ? "Enter a new Markdown file name."
          : sectionNaming ? "Sections group open files without moving them on disk."
          : `“${name}” will be permanently deleted.${dirty ? " Unsaved changes will also be lost." : ""}`;
        fileDialogInput.hidden = !naming;
        fileDialogInput.required = naming;
        fileDialogInput.value = naming ? name : "";
        if (sectionNaming) fileDialogInput.maxLength = 80;
        else fileDialogInput.removeAttribute("maxlength");
        fileDialogSubmit.textContent = mode === "create-section" ? "Create"
          : naming ? "Rename" : "Delete";
        fileDialogSubmit.dataset.destructive = String(!naming);
        fileDialog.showModal();
        requestAnimationFrame(() => {
          if (naming) {
            fileDialogInput.focus();
            const selectionEnd = fileRenaming
              ? (name.search(/\.(?:md|markdown)$/i) > 0
                ? name.search(/\.(?:md|markdown)$/i) : name.length)
              : name.length;
            fileDialogInput.setSelectionRange(0, selectionEnd);
          } else {
            fileDialogCancel.focus();
          }
        });
        return new Promise(resolve => { fileDialogResolve = resolve; });
      }

      setTheme(document.documentElement.dataset.theme, { persist: false });

      function setSidebarOpen(open, { persist = true } = {}) {
        const focusToggle = !open && sidebarElement.contains(document.activeElement);
        const focusDismiss = open && mobileSidebarQuery.matches && mainElement.contains(document.activeElement);
        appElement.dataset.sidebar = open ? "open" : "closed";
        sidebarToggle.setAttribute("aria-expanded", String(open));
        sidebarToggle.setAttribute("aria-label", open ? "Hide sidebar" : "Show sidebar");
        sidebarToggle.title = `${open ? "Hide" : "Show"} sidebar (${/Mac|iPhone|iPad|iPod/.test(navigator.platform) ? "⌘⌥B" : "Ctrl+Alt+B"})`;
        sidebarElement.toggleAttribute("inert", !open);
        sidebarElement.setAttribute("aria-hidden", String(!open));
        const mainIsBehindDrawer = open && mobileSidebarQuery.matches;
        mainElement.toggleAttribute("inert", mainIsBehindDrawer);
        mainElement.setAttribute("aria-hidden", String(mainIsBehindDrawer));
        if (focusToggle) sidebarToggle.focus();
        else if (focusDismiss) sidebarDismiss.focus();
        if (persist) {
          try { localStorage.setItem(sidebarStorageKey, open ? "open" : "closed"); } catch {}
        }
      }

      function toggleSidebar() {
        setSidebarOpen(appElement.dataset.sidebar !== "open");
      }

      let storedSidebarState = null;
      try { storedSidebarState = localStorage.getItem(sidebarStorageKey); } catch {}
      setSidebarOpen(storedSidebarState ? storedSidebarState === "open" : !mobileSidebarQuery.matches, { persist: false });
      mobileSidebarQuery.addEventListener("change", () => {
        setSidebarOpen(appElement.dataset.sidebar === "open", { persist: false });
      });

      const exampleText = [

      const createId = () => crypto.randomUUID?.() || `${Date.now()}-${Math.random()}`;
      const example = {
        id: "LocalMarkdown-examples", name: "Markdown examples", text: exampleText,
        handle: null, attachments: new Map(), builtin: true, dirty: false
      };
      const welcome = {
        id: "LocalMarkdown-welcome", name: "", text: "", handle: null,
        attachments: new Map(), builtin: true, welcome: true, dirty: false
      };
      const session = {
        activeId: example.id,
        files: [example],
        workspaces: [],
        favoriteKeys: new Set(),
        sidebar: { pinnedCollapsed: false, sections: [], ungroupedFileIds: [] },
        lastOpenHandle: null
      };

      function activeFile() {
        return session.files.find(file => file.id === session.activeId);
      }

      function isStandaloneSidebarFile(file) {
        if (!file || file.builtin || file.welcome) return false;
        if (!file.workspaceId) return true;
        const workspace = workspaceForId(file.workspaceId);
        return !workspace?.nodesByPath.has(file.workspacePath);
      }

      function sectionForId(sectionId) {
        return session.sidebar.sections.find(section => section.id === sectionId) || null;
      }

      function sectionNameExists(name, exceptId = null) {
        const normalized = name.trim().toLocaleLowerCase();
        return session.sidebar.sections.some(section => section.id !== exceptId
          && section.name.toLocaleLowerCase() === normalized);
      }

      function removeFileFromSidebarLayout(fileId) {
        let changed = false;
        const nextUngrouped = session.sidebar.ungroupedFileIds.filter(id => id !== fileId);
        if (nextUngrouped.length !== session.sidebar.ungroupedFileIds.length) {
          session.sidebar.ungroupedFileIds = nextUngrouped;
          changed = true;
        }
        for (const section of session.sidebar.sections) {
          const nextFileIds = section.fileIds.filter(id => id !== fileId);
          if (nextFileIds.length === section.fileIds.length) continue;
          section.fileIds = nextFileIds;
          changed = true;
        }
        return changed;
      }

      function syncSidebarFileAvailability(file) {
        const assigned = session.sidebar.ungroupedFileIds.includes(file.id)
          || session.sidebar.sections.some(section => section.fileIds.includes(file.id));
        if (!isStandaloneSidebarFile(file)) return removeFileFromSidebarLayout(file.id);
        if (assigned) return false;
        session.sidebar.ungroupedFileIds.push(file.id);
        return true;
      }

      function normalizeSidebarLayout() {
        let changed = false;
        if (!session.sidebar || typeof session.sidebar !== "object") {
          session.sidebar = { pinnedCollapsed: false, sections: [], ungroupedFileIds: [] };
          changed = true;
        }
        if (!Array.isArray(session.sidebar.sections)) {
          session.sidebar.sections = [];
          changed = true;
        }
        if (!Array.isArray(session.sidebar.ungroupedFileIds)) {
          session.sidebar.ungroupedFileIds = [];
          changed = true;
        }

        const eligibleIds = new Set(session.files.filter(isStandaloneSidebarFile).map(file => file.id));
        const seenSectionIds = new Set();
        const seenFileIds = new Set();
        const sections = [];
        for (const candidate of session.sidebar.sections) {
          if (!candidate || typeof candidate.id !== "string" || seenSectionIds.has(candidate.id)
              || typeof candidate.name !== "string" || !candidate.name.trim()) {
            changed = true;
            continue;
          }
          seenSectionIds.add(candidate.id);
          const fileIds = [];
          for (const fileId of Array.isArray(candidate.fileIds) ? candidate.fileIds : []) {
            if (!eligibleIds.has(fileId) || seenFileIds.has(fileId)) {
              changed = true;
              continue;
            }
            seenFileIds.add(fileId);
            fileIds.push(fileId);
          }
          const section = {
            id: candidate.id,
            name: candidate.name.trim(),
            collapsed: Boolean(candidate.collapsed),
            fileIds
          };
          if (section.name !== candidate.name || !Array.isArray(candidate.fileIds)) changed = true;
          sections.push(section);
        }

        const ungroupedFileIds = [];
        for (const fileId of session.sidebar.ungroupedFileIds) {
          if (!eligibleIds.has(fileId) || seenFileIds.has(fileId)) {
            changed = true;
            continue;
          }
          seenFileIds.add(fileId);
          ungroupedFileIds.push(fileId);
        }
        for (const file of session.files) {
          if (!eligibleIds.has(file.id) || seenFileIds.has(file.id)) continue;
          seenFileIds.add(file.id);
          ungroupedFileIds.push(file.id);
          changed = true;
        }
        session.sidebar = {
          pinnedCollapsed: Boolean(session.sidebar.pinnedCollapsed),
          sections,
          ungroupedFileIds
        };
        return changed;
      }

      function sidebarFiles(fileIds) {
        const filesById = new Map(session.files.map(file => [file.id, file]));
        return fileIds.map(id => filesById.get(id)).filter(Boolean);
      }

      async function createSection() {
        const name = await requestFileDialog("create-section", "");
        if (name === null) return;
        const section = { id: createId(), name: name.trim(), collapsed: false, fileIds: [] };
        session.sidebar.sections.push(section);
        renderFiles();
        updateStatus(`Created section ${section.name}`);
        scheduleSessionSave();
      }

      async function renameSection(section) {
        if (!sectionForId(section.id)) return;
        const name = await requestFileDialog("rename-section", section.name, { sectionId: section.id });
        const current = sectionForId(section.id);
        if (!current) return;
        if (name === null || name.trim() === current.name) return;
        current.name = name.trim();
        renderFiles();
        updateStatus(`Renamed section to ${current.name}`);
        scheduleSessionSave();
      }

      function deleteSection(sectionId) {
        const section = sectionForId(sectionId);
        if (!section) return false;
        if (section.fileIds.length) {
          updateStatus("Move or close all files before deleting this section");
          return false;
        }
        session.sidebar.sections = session.sidebar.sections.filter(item => item !== section);
        renderFiles();
        updateStatus(`Deleted section ${section.name}`);
        scheduleSessionSave();
        return true;
      }

      function moveSectionByOffset(sectionId, offset) {
        const sections = session.sidebar.sections;
        const index = sections.findIndex(section => section.id === sectionId);
        const nextIndex = index + offset;
        if (index < 0 || nextIndex < 0 || nextIndex >= sections.length) return;
        const [section] = sections.splice(index, 1);
        sections.splice(nextIndex, 0, section);
        renderFiles();
        scheduleSessionSave();
      }

      function moveSectionRelative(sectionId, targetId, placeAfter) {
        if (sectionId === targetId) return;
        const sections = session.sidebar.sections;
        const index = sections.findIndex(section => section.id === sectionId);
        if (index < 0) return;
        const [section] = sections.splice(index, 1);
        const targetIndex = sections.findIndex(candidate => candidate.id === targetId);
        if (targetIndex < 0) sections.push(section);
        else sections.splice(targetIndex + (placeAfter ? 1 : 0), 0, section);
        renderFiles();
        scheduleSessionSave();
      }

      function moveFileToSection(fileId, sectionId, targetFileId = null, placeAfter = true) {
        const file = session.files.find(candidate => candidate.id === fileId);
        const section = sectionId ? sectionForId(sectionId) : null;
        if (!isStandaloneSidebarFile(file) || (sectionId && !section)) return;
        removeFileFromSidebarLayout(fileId);
        const fileIds = section ? section.fileIds : session.sidebar.ungroupedFileIds;
        const targetIndex = targetFileId ? fileIds.indexOf(targetFileId) : -1;
        if (targetIndex < 0) fileIds.push(fileId);
        else fileIds.splice(targetIndex + (placeAfter ? 1 : 0), 0, fileId);
        renderFiles();
        scheduleSessionSave();
      }

      function createDirectoryNode(handle, name, path = "") {
        return {
          kind: "directory",
          name,
          path,
          handle,
          children: null,
          loading: false,
          loadPromise: null,
          error: null
        };
      }

      function createWorkspace({ id = createId(), name, handle, expanded = [""] }) {
        const root = createDirectoryNode(handle, name || handle?.name || "Folder");
        const workspace = {
          id,
          name: root.name,
          handle,
          root,
          expanded: new Set(Array.isArray(expanded) ? expanded : [""]),
          nodesByPath: new Map([["", root]]),
          needsPermission: false,
          searchIndexed: false,
          indexGeneration: 0,
          indexPromise: null
        };
        return workspace;
      }

      function workspaceForId(id) {
        return session.workspaces.find(workspace => workspace.id === id) || null;
      }

      function workspaceFavoriteKey(workspace, node) {
        return `workspace:${workspace.id}:${node.path}`;
      }

      function workspaceLocationForTarget(target) {
        if (target?.workspace && target.node?.kind === "file") {
          return { workspace: target.workspace, node: target.node };
        }
        const file = target?.file;
        if (!file?.workspaceId || typeof file.workspacePath !== "string") return null;
        const workspace = workspaceForId(file.workspaceId);
        const node = workspace?.nodesByPath.get(file.workspacePath);
        return node?.kind === "file" ? { workspace, node } : null;
      }

      function favoriteKeyForTarget(target) {
        const fileKey = target?.file && !target.file.builtin ? `file:${target.file.id}` : null;
        if (fileKey && session.favoriteKeys.has(fileKey)) return fileKey;
        const location = workspaceLocationForTarget(target);
        if (location) return workspaceFavoriteKey(location.workspace, location.node);
        return fileKey;
      }

      function targetIsFavorite(target) {
        const key = favoriteKeyForTarget(target);
        return Boolean(key && session.favoriteKeys.has(key));
      }

      function targetName(target) {
        return workspaceLocationForTarget(target)?.node.name || target?.file?.name || "file";
      }

      function favoriteTarget(key) {
        if (key.startsWith("file:")) {
          const file = session.files.find(candidate => candidate.id === key.slice(5));
          return file && !file.builtin ? { file } : null;
        }
        if (!key.startsWith("workspace:")) return null;
        for (const workspace of session.workspaces) {
          const prefix = `workspace:${workspace.id}:`;
          if (!key.startsWith(prefix)) continue;
          const node = workspace.nodesByPath.get(key.slice(prefix.length));
          return node?.kind === "file"
            ? { workspace, node, file: openFileForWorkspaceNode(workspace, node) }
            : null;
        }
        return null;
      }

      function favoriteTargets() {
        return Array.from(session.favoriteKeys, favoriteTarget).filter(Boolean);
      }

      async function hydrateFavoriteWorkspaceNodes() {
        const tasks = [];
        for (const key of session.favoriteKeys) {
          if (!key.startsWith("workspace:")) continue;
          for (const workspace of session.workspaces) {
            const prefix = `workspace:${workspace.id}:`;
            if (!key.startsWith(prefix) || workspace.needsPermission) continue;
            const path = key.slice(prefix.length);
            if (!path || workspace.nodesByPath.has(path)) break;
            tasks.push(workspaceNodeAtPath(workspace, path.split("/")).catch(() => null));
            break;
          }
        }
        await Promise.all(tasks);
      }

      function syncWorkspaceSearchText(file, { invalidate = false } = {}) {
        if (!file?.workspaceId || typeof file.workspacePath !== "string") return;
        const node = workspaceForId(file.workspaceId)?.nodesByPath.get(file.workspacePath);
        if (!node || node.kind !== "file") return;
        node.searchText = invalidate ? null : file.text;
        node.searchError = false;
      }

      function openSessionDatabase() {
        if (!sessionDatabasePromise) {
          sessionDatabasePromise = new Promise((resolve, reject) => {
            if (typeof indexedDB === "undefined") {
              reject(new Error("Browser storage is unavailable"));
              return;
            }

            const request = indexedDB.open(sessionDatabaseName, 1);
            request.addEventListener("upgradeneeded", () => {
              if (!request.result.objectStoreNames.contains(sessionStoreName)) {
                request.result.createObjectStore(sessionStoreName);
              }
            });
            request.addEventListener("success", () => {
              const database = request.result;
              database.addEventListener("versionchange", () => database.close());
              resolve(database);
            });
            request.addEventListener("error", () => reject(request.error));
            request.addEventListener("blocked", () => reject(new Error("Browser storage is blocked")));
          });
        }
        return sessionDatabasePromise;
      }

      async function readStoredSession() {
        const database = await openSessionDatabase();
        return new Promise((resolve, reject) => {
          const transaction = database.transaction(sessionStoreName, "readonly");
          const request = transaction.objectStore(sessionStoreName).get(sessionStorageKey);
          request.addEventListener("success", () => resolve(request.result || null));
          request.addEventListener("error", () => reject(request.error));
          transaction.addEventListener("abort", () => reject(transaction.error));
        });
      }

      async function writeStoredSession(snapshot) {
        const database = await openSessionDatabase();
        return new Promise((resolve, reject) => {
          const transaction = database.transaction(sessionStoreName, "readwrite");
          transaction.objectStore(sessionStoreName).put(snapshot, sessionStorageKey);
          transaction.addEventListener("complete", resolve);
          transaction.addEventListener("abort", () => reject(transaction.error));
          transaction.addEventListener("error", () => reject(transaction.error));
        });
      }

      function storedAttachments(file) {
        const referenced = referencedAttachmentIds(file.text);
        return Array.from(file.attachments.values())
          .filter(attachment => referenced.has(attachment.id) && attachment.data)
          .map(attachment => ({
            id: attachment.id,
            type: attachment.type,
            data: attachment.data,
            ...(attachment.kind === "excalidraw" ? { kind: "excalidraw" } : {})
          }));
      }

      function sessionSnapshot() {
        return {
          version: 2,
          activeId: session.activeId,
          lastOpenHandle: session.lastOpenHandle,
          favoriteKeys: Array.from(session.favoriteKeys),
          sidebar: {
            pinnedCollapsed: session.sidebar.pinnedCollapsed,
            sections: session.sidebar.sections.map(section => ({
              id: section.id,
              name: section.name,
              collapsed: section.collapsed,
              fileIds: [...section.fileIds]
            })),
            ungroupedFileIds: [...session.sidebar.ungroupedFileIds]
          },
          fileOrder: session.files
            .filter(file => !file.welcome)
            .map(file => file.id),
          files: session.files
            .filter(file => !file.builtin && !file.welcome)
            .map(file => ({
              id: file.id,
              name: file.name,
              text: file.text,
              handle: file.handle || null,
              workspaceId: file.workspaceId || null,
              workspacePath: file.workspacePath || null,
              dirty: Boolean(file.dirty),
              attachments: storedAttachments(file)
            })),
          workspaces: session.workspaces.map(workspace => ({
            id: workspace.id,
            name: workspace.name,
            handle: workspace.handle,
            expanded: Array.from(workspace.expanded)
          }))
        };
      }

      function persistSessionNow() {
        if (!sessionRestored || !sessionNeedsSave) return sessionWritePromise;
        clearTimeout(sessionSaveTimer);
        sessionSaveTimer = null;
        const snapshot = sessionSnapshot();
        sessionNeedsSave = false;
        sessionWritePromise = sessionWritePromise
          .catch(() => {})
          .then(() => writeStoredSession(snapshot))
          .catch(() => {
            sessionNeedsSave = true;
            console.warn("Local Markdown could not use browser session storage.");
          });
        return sessionWritePromise;
      }

      function scheduleSessionSave() {
        if (!sessionRestored) return;
        sessionNeedsSave = true;
        clearTimeout(sessionSaveTimer);
        sessionSaveTimer = setTimeout(persistSessionNow, sessionSaveDelay);
      }

      function restoredAttachments(items) {
        const attachments = new Map();
        for (const item of Array.isArray(items) ? items : []) {
          if (!item || typeof item.id !== "string"
              || typeof item.type !== "string" || !item.type.startsWith("image/")
              || typeof item.data !== "string") continue;
          attachments.set(item.id, {
            id: item.id,
            type: item.type,
            data: item.data,
            kind: item.kind === "excalidraw" ? "excalidraw" : null,
            blob: null,
            pending: null,
            error: false
          });
        }
        return attachments;
      }

      async function handlePermission(handle, mode) {
        if (!handle || typeof handle.queryPermission !== "function") return null;
        try {
          return await handle.queryPermission({ mode });
        } catch {
          return null;
        }
      }

      function isVisibleDirectoryEntry(name, handle) {
        if (!name || name.startsWith(".")) return false;
        if (handle.kind === "directory") return !ignoredDirectoryNames.has(name);
        return handle.kind === "file" && markdownFilePattern.test(name);
      }

      function compareDirectoryEntries(left, right) {
        if (left.kind !== right.kind) return left.kind === "directory" ? -1 : 1;
        return left.name.localeCompare(right.name, undefined, { numeric: true, sensitivity: "base" });
      }

      async function loadWorkspaceDirectory(workspace, directory) {
        if (directory.children) return directory.children;
        if (directory.loadPromise) return directory.loadPromise;
        directory.loading = true;
        directory.error = null;
        directory.loadPromise = (async () => {
          const children = [];
          for await (const [name, handle] of directory.handle.entries()) {
            if (!isVisibleDirectoryEntry(name, handle)) continue;
            const path = directory.path ? `${directory.path}/${name}` : name;
            const node = handle.kind === "directory"
              ? createDirectoryNode(handle, name, path)
              : { kind: "file", name, path, handle, searchText: null, searchError: false };
            children.push(node);
            workspace.nodesByPath.set(path, node);
          }
          children.sort(compareDirectoryEntries);
          directory.children = children;
          return children;
        })().catch(error => {
          directory.error = error;
          directory.children = [];
          return directory.children;
        }).finally(() => {
          directory.loading = false;
          directory.loadPromise = null;
        });
        return directory.loadPromise;
      }

      function forgetWorkspaceDescendants(workspace, directory) {
        const prefix = directory.path ? `${directory.path}/` : "";
        for (const path of workspace.nodesByPath.keys()) {
          if (path === directory.path) continue;
          if (!prefix || path.startsWith(prefix)) workspace.nodesByPath.delete(path);
        }
        directory.children = null;
        directory.error = null;
        workspace.searchIndexed = false;
        workspace.indexGeneration += 1;
      }

      async function workspaceNodeAtPath(workspace, parts) {
        let directory = workspace.root;
        for (const [index, name] of parts.entries()) {
          let children = await loadWorkspaceDirectory(workspace, directory);
          let node = children.find(child => child.name === name);
          if (!node) {
            forgetWorkspaceDescendants(workspace, directory);
            children = await loadWorkspaceDirectory(workspace, directory);
            node = children.find(child => child.name === name);
          }
          if (!node) return null;
          if (index === parts.length - 1) return node;
          if (node.kind !== "directory") return null;
          directory = node;
        }
        return workspace.root;
      }

      function revealWorkspacePath(workspace, path) {
        workspace.expanded.add("");
        const parts = path.split("/").filter(Boolean);
        for (let index = 1; index < parts.length; index += 1) {
          workspace.expanded.add(parts.slice(0, index).join("/"));
        }
      }

      async function hydrateExpandedWorkspaceDirectory(workspace, directory = workspace.root) {
        if (!workspace.expanded.has(directory.path)) return;
        const children = await loadWorkspaceDirectory(workspace, directory);
        await Promise.all(children
          .filter(child => child.kind === "directory" && workspace.expanded.has(child.path))
          .map(child => hydrateExpandedWorkspaceDirectory(workspace, child)));
      }

      async function refreshRestoredWorkspace(workspace) {
        const writePermission = await handlePermission(workspace.handle, "readwrite");
        workspace.needsPermission = writePermission !== null && writePermission !== "granted";
        if (workspace.needsPermission) return false;
        await hydrateExpandedWorkspaceDirectory(workspace);
        return true;
      }

      async function loadFileFromHandle(file) {
        const diskFile = await file.handle.getFile();
        const parsed = parseStoredMarkdown(await diskFile.text());
        file.name = diskFile.name;
        file.text = parsed.text;
        file.attachments = parsed.attachments;
        file.dirty = false;
        syncWorkspaceSearchText(file);
        return parsed.warning;
      }

      async function refreshRestoredFile(file) {
        if (!file.handle) return false;
        const [readPermission, writePermission] = await Promise.all([
          handlePermission(file.handle, "read"),
          handlePermission(file.handle, "readwrite")
        ]);
        file.needsPermission = writePermission !== null && writePermission !== "granted";
        if (file.dirty || readPermission !== "granted") return false;
        try {
          await loadFileFromHandle(file);
          return true;
        } catch {
          file.needsPermission = true;
          return false;
        }
      }

      async function restoreSession() {
        let storedSession = null;
        try {
          storedSession = await readStoredSession();
        } catch {
          console.warn("Local Markdown could not use browser session storage.");
        }

        if ([1, 2].includes(storedSession?.version) && Array.isArray(storedSession.files)) {
          const restoredFiles = storedSession.files
            .filter(file => file && typeof file.id === "string"
              && typeof file.name === "string" && typeof file.text === "string")
            .map(file => ({
              id: file.id,
              name: file.name,
              text: file.text,
              handle: file.handle || null,
              workspaceId: typeof file.workspaceId === "string" ? file.workspaceId : null,
              workspacePath: typeof file.workspacePath === "string" ? file.workspacePath : null,
              attachments: restoredAttachments(file.attachments),
              builtin: false,
              dirty: Boolean(file.dirty),
              needsPermission: false
            }));

          const restoredWorkspaces = (Array.isArray(storedSession.workspaces)
            ? storedSession.workspaces : [])
            .filter(workspace => workspace && typeof workspace.id === "string"
              && typeof workspace.name === "string" && workspace.handle?.kind === "directory")
            .map(workspace => createWorkspace(workspace));
          session.workspaces = restoredWorkspaces;
          session.favoriteKeys = new Set((Array.isArray(storedSession.favoriteKeys)
            ? storedSession.favoriteKeys : []).filter(key => typeof key === "string"));

          const [refreshedFiles, refreshedWorkspaces] = await Promise.all([
            Promise.all(restoredFiles.map(refreshRestoredFile)),
            Promise.all(restoredWorkspaces.map(refreshRestoredWorkspace))
          ]);
          await hydrateFavoriteWorkspaceNodes();
          for (const file of restoredFiles) syncWorkspaceSearchText(file);
          const availableFiles = [example, ...restoredFiles];
          const filesById = new Map(availableFiles.map(file => [file.id, file]));
          const orderedFiles = [];
          for (const id of Array.isArray(storedSession.fileOrder) ? storedSession.fileOrder : []) {
            const file = filesById.get(id);
            if (!file) continue;
            orderedFiles.push(file);
            filesById.delete(id);
          }
          session.files = [...orderedFiles, ...filesById.values()];
          if (storedSession.version === 2 && storedSession.sidebar
              && typeof storedSession.sidebar === "object") {
            session.sidebar = {
              pinnedCollapsed: Boolean(storedSession.sidebar.pinnedCollapsed),
              sections: Array.isArray(storedSession.sidebar.sections)
                ? storedSession.sidebar.sections : [],
              ungroupedFileIds: Array.isArray(storedSession.sidebar.ungroupedFileIds)
                ? storedSession.sidebar.ungroupedFileIds : []
            };
          } else {
            session.sidebar = {
              pinnedCollapsed: false,
              sections: [],
              ungroupedFileIds: Array.isArray(storedSession.fileOrder)
                ? [...storedSession.fileOrder] : []
            };
            sessionNeedsSave = true;
          }
          if (normalizeSidebarLayout()) sessionNeedsSave = true;
          session.activeId = session.files.some(file => file.id === storedSession.activeId)
            ? storedSession.activeId
            : (restoredFiles[0]?.id || example.id);
          session.lastOpenHandle = storedSession.lastOpenHandle?.kind === "file"
            ? storedSession.lastOpenHandle
            : (activeFile()?.handle || restoredFiles.find(file => file.handle)?.handle || null);
          if (refreshedFiles.some(Boolean) || refreshedWorkspaces.some(Boolean)) {
            sessionNeedsSave = true;
          }
        }

        sessionRestored = true;
        if (sessionNeedsSave) scheduleSessionSave();
        for (const file of session.files) {
          if (!file.builtin && file.dirty && file.handle && !file.needsPermission) {
            scheduleAutoSave(file);
          }
        }
      }

      function captureEditorValue() {
        if (!editorReady) return;
        const file = activeFile();
        const value = canonicalEditorText(editor.getValue(), file);
        if (value === file.text) return;
        file.text = value;
        if (!file.builtin) {
          file.dirty = true;
          scheduleAutoSave(file);
          scheduleSessionSave();
        }
      }

      function updateStatus(message = null) {
        const file = activeFile();
        const filename = file.name || (file.welcome ? "Local Markdown" : "Untitled.md");
        filenameElement.textContent = filename;
        filenameElement.title = filename;
        closeButton.disabled = Boolean(file.builtin || file.welcome);
        saveButton.textContent = file.handle && file.needsPermission ? "Reconnect" : "Save";
        saveButton.hidden = Boolean(file.builtin || file.welcome
          || (file.handle && !file.needsPermission));
        saveCopyButton.hidden = Boolean(file.builtin || file.welcome || !file.needsPermission);
        if (message) statusElement.textContent = message;
        else if (file.welcome) statusElement.textContent = "Open a file or view Examples";
        else if (file.builtin) statusElement.textContent = "Examples";
        else if (file.needsPermission) statusElement.textContent = "Reconnect or save a copy";
        else statusElement.textContent = file.dirty ? "Not saved to disk" : "Saved";
      }

      function renderFiles() {
        filesElement.replaceChildren();
        const query = searchInput.value.trim();
        searchClear.hidden = !query;
        if (query) {
          renderSearchResults(query);
          for (const workspace of session.workspaces) startWorkspaceSearchIndex(workspace);
          return;
        }
        filesElement.setAttribute("aria-label", "Files and folders");
        if (normalizeSidebarLayout()) scheduleSessionSave();
        const favorites = favoriteTargets();
        if (favorites.length) renderPinnedGroup(favorites);
        const ungroupedFiles = sidebarFiles(session.sidebar.ungroupedFileIds);
        const exampleFile = session.files.find(file => file === example);
        const looseFiles = document.createElement("div");
        looseFiles.className = "LocalMarkdown-loose-files";
        attachFileSectionDropZone(looseFiles, null);
        if (exampleFile) appendOpenFileButton(exampleFile, null, looseFiles);
        for (const file of ungroupedFiles) appendOpenFileButton(file, null, looseFiles);
        if (looseFiles.childElementCount) filesElement.append(looseFiles);
        for (const section of session.sidebar.sections) renderTopicSection(section);
        for (const workspace of session.workspaces) renderWorkspace(workspace);
      }

      function renderPinnedGroup(targets) {
        const container = document.createElement("div");
        container.className = "LocalMarkdown-topic-section LocalMarkdown-pinned-section";
        const header = document.createElement("div");
        header.className = "LocalMarkdown-topic-header LocalMarkdown-pinned-header";
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "LocalMarkdown-topic-toggle";
        toggle.setAttribute("aria-expanded", String(!session.sidebar.pinnedCollapsed));
        const filesId = "LocalMarkdown-pinned-files";
        toggle.setAttribute("aria-controls", filesId);
        toggle.title = `${session.sidebar.pinnedCollapsed ? "Expand" : "Collapse"} Pinned`;
        const icon = document.createElement("span");
        icon.className = "LocalMarkdown-group-icon LocalMarkdown-pinned-icon";
        icon.setAttribute("aria-hidden", "true");
        icon.textContent = "★";
        const name = document.createElement("span");
        name.className = "LocalMarkdown-topic-name";
        name.textContent = "Pinned";
        const count = document.createElement("span");
        count.className = "LocalMarkdown-topic-count";
        count.textContent = String(targets.length);
        toggle.append(icon, name, count);
        toggle.addEventListener("click", () => {
          session.sidebar.pinnedCollapsed = !session.sidebar.pinnedCollapsed;
          renderFiles();
          scheduleSessionSave();
        });
        header.append(toggle);
        container.append(header);

        const pinnedFiles = document.createElement("div");
        pinnedFiles.className = "LocalMarkdown-topic-files";
        pinnedFiles.id = filesId;
        pinnedFiles.hidden = session.sidebar.pinnedCollapsed;
        if (!session.sidebar.pinnedCollapsed) {
          for (const target of targets) appendFavoriteButton(target, pinnedFiles);
        }
        container.append(pinnedFiles);
        filesElement.append(container);
      }

      function renderTopicSection(section) {
        const container = document.createElement("div");
        container.className = "LocalMarkdown-topic-section";
        container.dataset.sectionId = section.id;

        const header = document.createElement("div");
        header.className = "LocalMarkdown-topic-header";
        header.draggable = true;
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "LocalMarkdown-topic-toggle";
        toggle.setAttribute("aria-expanded", String(!section.collapsed));
        const filesId = `LocalMarkdown-section-files-${section.id}`;
        toggle.setAttribute("aria-controls", filesId);
        toggle.title = `${section.collapsed ? "Expand" : "Collapse"} ${section.name}`;
        const name = document.createElement("span");
        name.className = "LocalMarkdown-topic-name";
        name.textContent = section.name;
        const count = document.createElement("span");
        count.className = "LocalMarkdown-topic-count";
        count.textContent = String(section.fileIds.length);
        toggle.append(name, count);
        toggle.addEventListener("click", () => {
          section.collapsed = !section.collapsed;
          renderFiles();
          scheduleSessionSave();
        });

        const menu = document.createElement("button");
        menu.type = "button";
        menu.className = "LocalMarkdown-topic-menu-button";
        menu.setAttribute("aria-label", `Actions for section ${section.name}`);
        menu.title = "Section actions";
        menu.textContent = "⋯";
        menu.addEventListener("click", event => openSectionContextMenu(event, section, menu));
        header.addEventListener("contextmenu", event => {
          event.preventDefault();
          openSectionContextMenu(event, section, header);
        });
        header.append(toggle, menu);
        container.append(header);

        const sectionFiles = document.createElement("div");
        sectionFiles.className = "LocalMarkdown-topic-files";
        sectionFiles.id = filesId;
        sectionFiles.hidden = section.collapsed;
        if (!section.collapsed) {
          for (const file of sidebarFiles(section.fileIds)) {
            appendOpenFileButton(file, section.id, sectionFiles);
          }
        }
        container.append(sectionFiles);
        enableSectionReordering(header, container, section);
        attachFileSectionDropZone(container, section.id);
        filesElement.append(container);
      }

      function appendOpenFileButton(file, sectionId = null, container = filesElement) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "LocalMarkdown-file";
        if (file === example) button.id = "LocalMarkdown-examples";
        button.dataset.fileId = file.id;
        const name = document.createElement("span");
        name.className = "LocalMarkdown-file-name";
        name.textContent = file === example
          ? "Examples"
          : file.name;
        button.append(sidebarItemIcon("file"), name);
        appendUnsavedMark(button, !file.builtin && file.dirty);
        if (targetIsFavorite({ file })) appendFavoriteMarker(button);
        button.title = file.builtin ? "Examples" : "Drag to reorder or move to a section";
        button.setAttribute("aria-current", String(file.id === session.activeId));
        button.addEventListener("click", file === example
          ? showExamples
          : () => selectFile(file.id));
        if (!file.builtin) attachFileContextMenu(button, { file });
        if (!file.builtin) enableFileReordering(button, file.id, sectionId);
        container.append(button);
      }

      function appendFavoriteMarker(element) {
        element.dataset.favorite = "true";
        const marker = document.createElement("span");
        marker.className = "LocalMarkdown-favorite-marker";
        marker.title = "Pinned";
        marker.setAttribute("aria-label", "Pinned");
        const icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        icon.setAttribute("viewBox", "0 0 20 20");
        icon.setAttribute("aria-hidden", "true");
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", "m10 2.75 2.1 4.35 4.8.65-3.5 3.35.85 4.75L10 13.55 5.75 15.8l.85-4.7-3.5-3.35 4.8-.65z");
        icon.append(path);
        marker.append(icon);
        element.append(marker);
      }

      function appendUnsavedMark(element, dirty) {
        if (!dirty) return;
        const marker = document.createElement("span");
        marker.className = "LocalMarkdown-unsaved-mark";
        marker.title = "Unsaved changes";
        marker.textContent = "Unsaved";
        element.append(marker);
      }

      function appendFavoriteButton(target, container = filesElement) {
        const location = workspaceLocationForTarget(target);
        const file = location
          ? (target.file || openFileForWorkspaceNode(location.workspace, location.node))
          : target.file;
        const button = document.createElement("button");
        button.type = "button";
        button.className = "LocalMarkdown-file";
        button.title = location ? `${location.workspace.name}/${location.node.path}` : targetName(target);
        button.setAttribute("aria-current", String(file?.id === session.activeId));
        const name = document.createElement("span");
        name.className = "LocalMarkdown-file-name";
        name.textContent = targetName(target);
        button.append(sidebarItemIcon("file"), name);
        appendUnsavedMark(button, file?.dirty);
        button.addEventListener("click", () => {
          if (location) void openWorkspaceFile(location.workspace, location.node);
          else selectFile(file.id);
        });
        attachFileContextMenu(button, { ...target, file });
        container.append(button);
      }

      function sidebarItemIcon(kind, className = "LocalMarkdown-sidebar-item-icon") {
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.classList.add(className);
        svg.dataset.iconKind = kind;
        svg.setAttribute("viewBox", "0 0 20 20");
        svg.setAttribute("aria-hidden", "true");
        svg.setAttribute("focusable", "false");
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", "currentColor");
        path.setAttribute("stroke-width", "1.35");
        path.setAttribute("stroke-linejoin", "round");
        path.setAttribute("d", kind === "directory"
          ? "M2.75 5.25h5l1.5 2h8v8.5h-14.5z"
          : "M4 2.75h7l4 4v10.5H4zM11 2.75v4h4");
        svg.append(path);
        return svg;
      }

      function openFileForWorkspaceNode(workspace, node) {
        return session.files.find(file => file.workspaceId === workspace.id
          && file.workspacePath === node.path) || null;
      }

      function renderWorkspace(workspace) {
        const container = document.createElement("div");
        container.className = "LocalMarkdown-workspace LocalMarkdown-topic-section";
        container.dataset.workspaceId = workspace.id;
        renderWorkspaceDirectory(workspace, workspace.root, 0, container, true);
        filesElement.append(container);
      }

      function renderWorkspaceDirectory(workspace, directory, depth, container, isRoot = false) {
        const row = document.createElement("div");
        row.className = isRoot
          ? "LocalMarkdown-tree-row LocalMarkdown-topic-header LocalMarkdown-workspace-header"
          : "LocalMarkdown-tree-row";
        row.style.setProperty("--tree-depth", String(depth));

        const button = document.createElement("button");
        button.type = "button";
        button.className = isRoot
          ? "LocalMarkdown-tree-item LocalMarkdown-topic-toggle"
          : "LocalMarkdown-tree-item";
        button.dataset.kind = "directory";
        button.dataset.root = String(isRoot);
        button.dataset.workspacePath = directory.path;
        const expanded = workspace.expanded.has(directory.path) && !workspace.needsPermission;
        button.setAttribute("aria-expanded", String(expanded));
        button.title = workspace.needsPermission && isRoot
          ? `Reconnect ${workspace.name}`
          : `${expanded ? "Collapse" : "Expand"} ${directory.name}`;

        const name = document.createElement("span");
        name.className = isRoot
          ? "LocalMarkdown-tree-name LocalMarkdown-topic-name"
          : "LocalMarkdown-tree-name";
        name.textContent = workspace.needsPermission && isRoot
          ? `${directory.name} (Reconnect)`
          : directory.name;
        const icon = sidebarItemIcon("directory", "LocalMarkdown-tree-icon");
        if (isRoot) icon.classList.add("LocalMarkdown-group-icon");
        button.setAttribute("aria-busy", String(directory.loading));
        button.append(icon, name);
        button.addEventListener("click", () => {
          if (workspace.needsPermission && isRoot) void reconnectWorkspace(workspace);
          else void toggleWorkspaceDirectory(workspace, directory);
        });
        row.append(button);

        if (isRoot) {
          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "LocalMarkdown-tree-remove LocalMarkdown-topic-menu-button";
          remove.setAttribute("aria-label", `Remove folder ${workspace.name}`);
          remove.title = "Remove folder from sidebar";
          remove.textContent = "×";
          remove.addEventListener("click", () => removeWorkspace(workspace));
          row.append(remove);
        }
        container.append(row);

        if (!expanded) return;
        if (directory.error) {
          appendWorkspaceEmpty(container, depth + 1, "Could not read folder");
          return;
        }
        if (!directory.children) {
          appendWorkspaceEmpty(container, depth + 1, "Loading…");
          return;
        }
        if (!directory.children.length) {
          appendWorkspaceEmpty(container, depth + 1, "No Markdown files");
          return;
        }
        for (const child of directory.children) {
          if (child.kind === "directory") {
            renderWorkspaceDirectory(workspace, child, depth + 1, container);
          } else {
            renderWorkspaceFile(workspace, child, depth + 1, container);
          }
        }
      }

      function appendWorkspaceEmpty(container, depth, message) {
        const empty = document.createElement("div");
        empty.className = "LocalMarkdown-tree-empty";
        empty.style.marginLeft = `${depth * 13}px`;
        empty.textContent = message;
        container.append(empty);
      }

      function renderWorkspaceFile(workspace, node, depth, container) {
        const openFile = openFileForWorkspaceNode(workspace, node);
        const row = document.createElement("div");
        row.className = "LocalMarkdown-tree-row";
        row.style.setProperty("--tree-depth", String(depth));
        const button = document.createElement("button");
        button.type = "button";
        button.className = "LocalMarkdown-tree-item";
        button.dataset.kind = "file";
        button.dataset.workspacePath = node.path;
        button.title = node.path;
        button.setAttribute("aria-current", String(openFile?.id === session.activeId));
        const name = document.createElement("span");
        name.className = "LocalMarkdown-tree-name";
        name.textContent = node.name;
        button.append(sidebarItemIcon("file", "LocalMarkdown-tree-icon"), name);
        appendUnsavedMark(button, openFile?.dirty);
        if (targetIsFavorite({ workspace, node, file: openFile })) appendFavoriteMarker(button);
        button.addEventListener("click", () => void openWorkspaceFile(workspace, node));
        attachFileContextMenu(button, { workspace, node, file: openFile });
        row.append(button);
        container.append(row);
      }

      async function toggleWorkspaceDirectory(workspace, directory) {
        if (workspace.expanded.has(directory.path)) {
          workspace.expanded.delete(directory.path);
          renderFiles();
          scheduleSessionSave();
          return;
        }
        workspace.expanded.add(directory.path);
        renderFiles();
        await loadWorkspaceDirectory(workspace, directory);
        renderFiles();
        scheduleSessionSave();
      }

      function markWorkspaceAccessRestored(workspace) {
        workspace.needsPermission = false;
        for (const file of session.files) {
          if (file.workspaceId !== workspace.id) continue;
          file.needsPermission = false;
          if (file.dirty) scheduleAutoSave(file);
        }
      }

      async function reconnectWorkspace(workspace) {
        updateStatus(`Reconnecting ${workspace.name}…`);
        try {
          const permission = typeof workspace.handle.requestPermission === "function"
            ? await workspace.handle.requestPermission({ mode: "readwrite" })
            : "granted";
          if (permission !== "granted") {
            updateStatus("Folder access was not restored");
            return;
          }
          markWorkspaceAccessRestored(workspace);
          forgetWorkspaceDescendants(workspace, workspace.root);
          await hydrateExpandedWorkspaceDirectory(workspace);
          renderFiles();
          updateStatus(`Reconnected ${workspace.name}`);
          scheduleSessionSave();
        } catch {
          updateStatus("Could not reconnect folder");
        }
      }

      function removeWorkspace(workspace) {
        for (const file of session.files) {
          if (file.workspaceId !== workspace.id) continue;
          file.workspaceId = null;
          file.workspacePath = null;
          syncSidebarFileAvailability(file);
        }
        const favoritePrefix = `workspace:${workspace.id}:`;
        for (const key of session.favoriteKeys) {
          if (key.startsWith(favoritePrefix)) session.favoriteKeys.delete(key);
        }
        session.workspaces = session.workspaces.filter(item => item !== workspace);
        renderFiles();
        updateStatus(`Removed ${workspace.name} from sidebar`);
        scheduleSessionSave();
      }

      function normalizedSearchText(value) {
        return String(value || "").toLocaleLowerCase();
      }

      function fuzzyNameScore(name, query) {
        const normalizedName = normalizedSearchText(name);
        const normalizedQuery = normalizedSearchText(query);
        const directIndex = normalizedName.indexOf(normalizedQuery);
        if (directIndex !== -1) return directIndex;

        let nameIndex = 0;
        let gapScore = 0;
        for (const character of normalizedQuery) {
          const foundIndex = normalizedName.indexOf(character, nameIndex);
          if (foundIndex === -1) return null;
          gapScore += foundIndex - nameIndex;
          nameIndex = foundIndex + 1;
        }
        return 100 + gapScore;
      }

      function searchableFileText(file) {
        return String(file.text || "")
          .replace(/<!-- LocalMarkdown attachments:v1[\s\S]*?-->/gi, "")
          .replace(/(!?\[[^\]]*\]\()data:image\/[^)]*(\))/gi, "$1$2")
          .replace(new RegExp(`(!?\\[[^\\]]*\\]\\()(?:${attachmentPathPrefixPattern})[^)]*(\\))`, "gi"), "$1$2");
      }

      function contentSearchMatches(file, query, limit = 5) {
        const text = searchableFileText(file);
        const normalizedQuery = normalizedSearchText(query);
        const matches = [];
        let occurrence = 0;
        let hasMore = false;

        for (const [lineIndex, rawLine] of text.split("\n").entries()) {
          const normalizedLine = normalizedSearchText(rawLine);
          const firstMatchIndex = normalizedLine.indexOf(normalizedQuery);
          if (firstMatchIndex === -1) continue;

          if (matches.length >= limit) {
            hasMore = true;
            break;
          }

          const line = rawLine.trim();
          const lineMatchIndex = normalizedSearchText(line).indexOf(normalizedQuery);
          const snippetStart = Math.max(0, lineMatchIndex - 42);
          const snippetEnd = Math.min(line.length, lineMatchIndex + query.length + 58);
          matches.push({
            lineNumber: lineIndex + 1,
            occurrence,
            snippet: `${snippetStart ? "…" : ""}${line.slice(snippetStart, snippetEnd)}${snippetEnd < line.length ? "…" : ""}`
          });

          let lineFromIndex = firstMatchIndex;
          while (lineFromIndex !== -1) {
            occurrence += 1;
            lineFromIndex = normalizedLine.indexOf(
              normalizedQuery,
              lineFromIndex + Math.max(1, normalizedQuery.length)
            );
          }
        }
        return { matches, hasMore };
      }

      function appendHighlightedText(element, value, query) {
        const text = String(value || "");
        const matchIndex = normalizedSearchText(text).indexOf(normalizedSearchText(query));
        if (matchIndex === -1) {
          element.textContent = text;
          return;
        }
        element.append(document.createTextNode(text.slice(0, matchIndex)));
        const mark = document.createElement("mark");
        mark.textContent = text.slice(matchIndex, matchIndex + query.length);
        element.append(mark, document.createTextNode(text.slice(matchIndex + query.length)));
      }

      function workspaceFileNodes(workspace) {
        return Array.from(workspace.nodesByPath.values()).filter(node => node.kind === "file");
      }

      function searchCandidates() {
        const candidates = [];
        const representedOpenFiles = new Set();
        let order = 0;
        for (const workspace of session.workspaces) {
          for (const node of workspaceFileNodes(workspace)) {
            const file = openFileForWorkspaceNode(workspace, node);
            if (file) representedOpenFiles.add(file.id);
            candidates.push({
              id: `${workspace.id}:${node.path}`,
              name: node.name,
              searchName: `${node.name} ${node.path}`,
              path: `${workspace.name}/${node.path}`,
              text: file?.text ?? node.searchText ?? "",
              file,
              workspace,
              node,
              order: order++
            });
          }
        }
        for (const file of session.files) {
          if (file.welcome || representedOpenFiles.has(file.id)) continue;
          const name = file === example ? "Examples" : file.name;
          candidates.push({
            id: file.id,
            name,
            searchName: name,
            path: name,
            text: file.text,
            file,
            workspace: null,
            node: null,
            order: order++
          });
        }
        return candidates;
      }

      async function collectWorkspaceFiles(workspace, directory, files) {
        const children = await loadWorkspaceDirectory(workspace, directory);
        for (const child of children) {
          if (child.kind === "file") files.push(child);
          else await collectWorkspaceFiles(workspace, child, files);
        }
      }

      async function loadWorkspaceSearchText(workspace, node) {
        const openFile = openFileForWorkspaceNode(workspace, node);
        if (openFile) {
          node.searchText = openFile.text;
          node.searchError = false;
          return;
        }
        if (node.searchText !== null) return;
        try {
          const diskFile = await node.handle.getFile();
          node.searchText = markdownTextWithoutAttachments(await diskFile.text());
          node.searchError = false;
        } catch {
          node.searchText = "";
          node.searchError = true;
        }
      }

      async function runWithConcurrency(items, concurrency, operation) {
        let nextIndex = 0;
        const workers = Array.from({ length: Math.min(concurrency, items.length) }, async () => {
          while (nextIndex < items.length) {
            const item = items[nextIndex++];
            await operation(item);
          }
        });
        await Promise.all(workers);
      }

      function requestWorkspaceSearchRender() {
        if (workspaceSearchRenderPending) return;
        workspaceSearchRenderPending = true;
        requestAnimationFrame(() => {
          workspaceSearchRenderPending = false;
          if (searchInput.value.trim()) renderFiles();
        });
      }

      function startWorkspaceSearchIndex(workspace) {
        if (workspace.needsPermission || workspace.searchIndexed || workspace.indexPromise) return;
        const generation = workspace.indexGeneration;
        const indexPromise = (async () => {
          const files = [];
          await collectWorkspaceFiles(workspace, workspace.root, files);
          await runWithConcurrency(files, 4, node => loadWorkspaceSearchText(workspace, node));
          if (workspace.indexGeneration === generation) workspace.searchIndexed = true;
        })().catch(() => {
          if (workspace.indexGeneration === generation) workspace.searchIndexed = true;
        }).finally(() => {
          if (workspace.indexPromise === indexPromise) workspace.indexPromise = null;
          requestWorkspaceSearchRender();
        });
        workspace.indexPromise = indexPromise;
        requestWorkspaceSearchRender();
      }

      function renderSearchResults(query) {
        filesElement.setAttribute("aria-label", `Search results for ${query}`);
        const results = searchCandidates()
          .map(candidate => {
            const contentResults = contentSearchMatches(candidate, query);
            return {
              candidate,
              nameScore: fuzzyNameScore(candidate.searchName, query),
              matches: contentResults.matches,
              hasMoreMatches: contentResults.hasMore
            };
          })
          .filter(result => result.nameScore !== null || result.matches.length)
          .sort((left, right) => {
            if (left.nameScore !== null && right.nameScore === null) return -1;
            if (left.nameScore === null && right.nameScore !== null) return 1;
            if (left.nameScore !== null && right.nameScore !== null
                && left.nameScore !== right.nameScore) return left.nameScore - right.nameScore;
            return left.candidate.order - right.candidate.order;
          });

        const indexing = session.workspaces.some(workspace => workspace.indexPromise);

        if (!results.length) {
          const empty = document.createElement("div");
          empty.className = "LocalMarkdown-search-empty";
          empty.textContent = indexing ? "Searching folder contents…" : "No matching files or content";
          filesElement.append(empty);
          return;
        }

        const summary = document.createElement("div");
        summary.className = "LocalMarkdown-search-summary";
        summary.textContent = `${results.length} matching ${results.length === 1 ? "file" : "files"}`
          + (indexing ? " · searching folders…" : "");
        filesElement.append(summary);

        for (const { candidate, nameScore, matches, hasMoreMatches } of results) {
          const result = document.createElement("div");
          result.className = "LocalMarkdown-search-result";
          const contextTarget = {
            file: candidate.file,
            workspace: candidate.workspace,
            node: candidate.node
          };

          const fileButton = document.createElement("button");
          fileButton.type = "button";
          fileButton.className = "LocalMarkdown-search-file";
          fileButton.title = candidate.path;
          fileButton.setAttribute("aria-current", String(candidate.file?.id === session.activeId));
          const name = document.createElement("span");
          name.className = "LocalMarkdown-search-file-name";
          const displayName = candidate.name;
          if (nameScore !== null) appendHighlightedText(name, displayName, query);
          else name.textContent = displayName;
          fileButton.append(sidebarItemIcon("file"), name);
          appendUnsavedMark(fileButton, candidate.file?.dirty);
          if (targetIsFavorite(contextTarget)) appendFavoriteMarker(fileButton);
          if (matches.length) {
            const count = document.createElement("span");
            count.className = "LocalMarkdown-search-count";
            count.textContent = hasMoreMatches ? `${matches.length}+` : String(matches.length);
            fileButton.append(count);
          }
          fileButton.addEventListener("click", () => void openSearchResult(candidate));
          if (candidate.file !== example) {
            attachFileContextMenu(fileButton, contextTarget);
          }
          result.append(fileButton);

          for (const match of matches) {
            const hit = document.createElement("button");
            hit.type = "button";
            hit.className = "LocalMarkdown-search-hit";
            hit.title = `Open ${displayName} at line ${match.lineNumber}`;
            const line = document.createElement("span");
            line.className = "LocalMarkdown-search-line";
            line.textContent = String(match.lineNumber);
            const snippet = document.createElement("span");
            snippet.className = "LocalMarkdown-search-snippet";
            appendHighlightedText(snippet, match.snippet, query);
            hit.append(line, snippet);
            hit.addEventListener("click", () => void openSearchResult(candidate, match, query));
            result.append(hit);
          }
          filesElement.append(result);
        }
      }

      function nthTextIndex(text, query, occurrence) {
        const normalizedText = normalizedSearchText(text);
        const normalizedQuery = normalizedSearchText(query);
        let fromIndex = 0;
        for (let index = 0; index <= occurrence; index += 1) {
          const matchIndex = normalizedText.indexOf(normalizedQuery, fromIndex);
          if (matchIndex === -1) return -1;
          if (index === occurrence) return matchIndex;
          fromIndex = matchIndex + Math.max(1, normalizedQuery.length);
        }
        return -1;
      }

      function revealSearchMatch(query, occurrence) {
        if (!editorReady) return false;
        const mode = editor.getCurrentMode();
        const root = editor.vditor?.[mode]?.element;
        if (!root) return false;

        const textNodes = [];
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        let node;
        let text = "";
        while ((node = walker.nextNode())) {
          textNodes.push({ node, start: text.length, end: text.length + node.data.length });
          text += node.data;
        }
        const matchIndex = nthTextIndex(text, query, occurrence);
        if (matchIndex === -1) return false;
        const matchEnd = matchIndex + query.length;
        const start = textNodes.find(item => matchIndex >= item.start && matchIndex < item.end);
        const end = textNodes.find(item => matchEnd > item.start && matchEnd <= item.end);
        if (!start || !end) return false;

        const range = document.createRange();
        range.setStart(start.node, matchIndex - start.start);
        range.setEnd(end.node, matchEnd - end.start);
        const selection = getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        root.focus({ preventScroll: true });
        start.node.parentElement?.scrollIntoView({ block: "center", behavior: "smooth" });
        return true;
      }

      async function openSearchResult(candidate, match = null, query = searchInput.value.trim()) {
        captureEditorValue();
        const file = candidate.workspace
          ? await openWorkspaceFile(candidate.workspace, candidate.node, { closeMobileSidebar: false })
          : candidate.file;
        if (!file) return;
        if (file === example) showExamples();
        else if (file.id !== session.activeId) activateFile(file);
        else updateStatus();
        if (mobileSidebarQuery.matches) setSidebarOpen(false);

        requestAnimationFrame(() => requestAnimationFrame(() => {
          if (match && query) {
            const revealed = revealSearchMatch(query, match.occurrence);
            updateStatus(revealed ? `Match in ${file.name || "Examples"}` : `Opened ${file.name || "Examples"}`);
          } else {
            editor?.focus();
          }
        }));
      }

      function dropAfter(button, event) {
        const bounds = button.getBoundingClientRect();
        return event.clientY >= bounds.top + bounds.height / 2;
      }

      function clearSidebarDropTargets() {
        for (const element of filesElement.querySelectorAll(".LocalMarkdown-drop-target")) {
          element.classList.remove("LocalMarkdown-drop-target");
        }
      }

      function markSidebarDropTarget(element) {
        clearSidebarDropTargets();
        element.classList.add("LocalMarkdown-drop-target");
      }

      function enableFileReordering(button, fileId, sectionId) {
        button.draggable = true;
        button.addEventListener("dragstart", event => {
          draggedSidebarItem = { kind: "file", fileId, sectionId };
          button.classList.add("LocalMarkdown-dragging");
          if (event.dataTransfer) {
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData("text/plain", fileId);
          }
        });
        button.addEventListener("dragover", event => {
          if (draggedSidebarItem?.kind !== "file" || draggedSidebarItem.fileId === fileId) return;
          event.preventDefault();
          event.stopPropagation();
          if (event.dataTransfer) event.dataTransfer.dropEffect = "move";
          markSidebarDropTarget(button);
        });
        button.addEventListener("drop", event => {
          if (draggedSidebarItem?.kind !== "file" || draggedSidebarItem.fileId === fileId) return;
          event.preventDefault();
          event.stopPropagation();
          const draggedFileId = draggedSidebarItem.fileId;
          draggedSidebarItem = null;
          clearSidebarDropTargets();
          moveFileToSection(draggedFileId, sectionId, fileId, dropAfter(button, event));
        });
        button.addEventListener("dragend", () => {
          draggedSidebarItem = null;
          clearSidebarDropTargets();
          button.classList.remove("LocalMarkdown-dragging");
        });
      }

      function attachFileSectionDropZone(element, sectionId) {
        element.addEventListener("dragover", event => {
          if (!draggedSidebarItem) return;
          if (draggedSidebarItem.kind === "file"
              && event.target.closest('[data-file-id][draggable="true"]')) return;
          if (draggedSidebarItem.kind === "section" && draggedSidebarItem.sectionId === sectionId) return;
          event.preventDefault();
          if (event.dataTransfer) event.dataTransfer.dropEffect = "move";
          markSidebarDropTarget(element);
        });
        element.addEventListener("drop", event => {
          if (!draggedSidebarItem) return;
          if (draggedSidebarItem.kind === "file"
              && event.target.closest('[data-file-id][draggable="true"]')) return;
          event.preventDefault();
          event.stopPropagation();
          const dragged = draggedSidebarItem;
          draggedSidebarItem = null;
          clearSidebarDropTargets();
          if (dragged.kind === "file") moveFileToSection(dragged.fileId, sectionId);
          else if (sectionId) moveSectionRelative(
            dragged.sectionId, sectionId, dropAfter(element.querySelector(".LocalMarkdown-topic-header"), event));
        });
      }

      function enableSectionReordering(header, container, section) {
        header.addEventListener("dragstart", event => {
          draggedSidebarItem = { kind: "section", sectionId: section.id };
          container.classList.add("LocalMarkdown-dragging");
          if (event.dataTransfer) {
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData("text/plain", section.id);
          }
        });
        header.addEventListener("dragend", () => {
          draggedSidebarItem = null;
          clearSidebarDropTargets();
          container.classList.remove("LocalMarkdown-dragging");
        });
      }

      function activateFile(file, message = null) {
        const previous = activeFile();
        if (previous) releaseAttachmentPreviews(previous.id);
        if (tableResizeSession) finishTableResize(null, false);
        else hideTableResizeHandle();
        hideImageResizer();
        if (!(file.attachments instanceof Map)) file.attachments = new Map();
        if (!session.files.includes(file)) {
          session.files.push(file);
          syncSidebarFileAvailability(file);
        }
        session.activeId = file.id;
        if (file.handle) session.lastOpenHandle = file.handle;
        if (editorReady) setEditorValue(file);
        renderFiles();
        updateStatus(message);
        scheduleAttachmentPreviews();
        scheduleTableWidths();
        scheduleSessionSave();
      }

      function selectFile(id) {
        if (id === session.activeId) return;
        captureEditorValue();
        const file = session.files.find(item => item.id === id);
        if (file) activateFile(file);
      }

      function showExamples() {
        if (activeFile() === example) return;
        captureEditorValue();
        example.text = exampleText;
        example.attachments.clear();
        activateFile(example);
      }

      function updateViewButtons(mode = "ir") {
        for (const button of viewButtons) {
          button.setAttribute("aria-pressed", String(button.dataset.mode === mode));
        }
      }

      function rememberIrScrollPosition() {
        if (!editorReady || editor.getCurrentMode() !== "ir") return;
        const anchor = document.getSelection()?.anchorNode;
        const element = anchor?.nodeType === 1 ? anchor : anchor?.parentElement;
        if (!element?.closest?.('.vditor-ir [data-type="code-block"]')) return;
        const scroller = editorElement.querySelector(".vditor-ir > .vditor-reset");
        irScrollTopBeforeInput = scroller?.scrollTop ?? null;
      }

      function restoreIrScrollPosition() {
        if (irScrollTopBeforeInput === null) return;
        const scrollTop = irScrollTopBeforeInput;
        irScrollTopBeforeInput = null;
        cancelAnimationFrame(irScrollRestoreFrame);
        irScrollRestoreFrame = requestAnimationFrame(() => {
          irScrollRestoreFrame = null;
          const scroller = editorElement.querySelector(".vditor-ir > .vditor-reset");
          if (scroller) scroller.scrollTop = scrollTop;
        });
      }

      function switchEditorMode(mode) {
        if (!editorReady || editor.getCurrentMode() === mode) return;
        captureEditorValue();
        hideTableEdgeTools();
        hideTableResizeHandle();
        hideImageResizer();
        const editModeElement = editor.vditor?.toolbar?.elements?.["edit-mode"];
        const modeButton = editModeElement?.querySelector(`button[data-mode="${mode}"]`);
        if (!modeButton) {
          updateStatus("Could not change editor view");
          return;
        }

        modeButton.click();
        const currentMode = editor.getCurrentMode();
        updateViewButtons(currentMode);
        if (currentMode !== mode) {
          updateStatus("Could not change editor view");
          return;
        }
        scheduleAttachmentPreviews();
        scheduleTableWidths();
        editor.focus();
      }

      function markdownLineRecords(value) {
        const records = [];
        const pattern = /[^\r\n]*(?:\r\n|\n|\r|$)/g;
        for (const match of value.matchAll(pattern)) {
          const raw = match[0];
          if (!raw) break;
          const newline = raw.match(/(?:\r\n|\n|\r)$/)?.[0] || "";
          records.push({
            text: newline ? raw.slice(0, -newline.length) : raw,
            newline,
            start: match.index,
            end: match.index + raw.length
          });
        }
        return records;
      }

      function characterIsEscaped(value, index) {
        let slashCount = 0;
        for (let cursor = index - 1; cursor >= 0 && value[cursor] === "\\"; cursor -= 1) {
          slashCount += 1;
        }
        return slashCount % 2 === 1;
      }

      function markdownTableCells(line) {
        let value = line.trim();
        if (!value || /^ {4}/.test(line)) return null;
        let hasBoundary = false;
        if (value.startsWith("|")) {
          hasBoundary = true;
          value = value.slice(1);
        }
        if (value.endsWith("|") && !characterIsEscaped(value, value.length - 1)) {
          hasBoundary = true;
          value = value.slice(0, -1);
        }

        const cells = [];
