      async function requestedMarkdownName(currentName) {
        const requested = await requestFileDialog("rename", currentName);
        if (requested === null) return null;
        let name = requested.trim();
        if (!name) {
          updateStatus("A file name is required");
          return null;
        }
        if (/[\\/]/.test(name) || name === "." || name === "..") {
          updateStatus("File names cannot contain slashes");
          return null;
        }
        if (!/\.[^.]+$/.test(name)) {
          name += currentName.match(/\.(?:md|markdown)$/i)?.[0] || ".md";
        }
        if (!markdownFilePattern.test(name)) {
          updateStatus("Use a .md or .markdown file name");
          return null;
        }
        return name;
      }

      async function renameFileTarget(target) {
        const file = target.file;
        const currentName = file?.name;
        if (!currentName) return;
        const nextName = await requestedMarkdownName(currentName);
        if (!nextName || nextName === currentName) return;
        if (!file.handle) {
          file.name = nextName;
          renderFiles();
          updateStatus(`Renamed to ${nextName}`);
          scheduleSessionSave();
          return;
        }
        try {
          await file.handle.move(nextName);
          file.name = file.handle.name || nextName;
          renderFiles();
          updateStatus(`Renamed to ${file.name}`);
          scheduleSessionSave();
        } catch {
          updateStatus("Could not rename this file");
        }
      }

      function removeSessionFile(file) {
        if (!file) return;
        const wasActive = file.id === session.activeId;
        cancelAutoSave(file);
        releaseAttachmentPreviews(file.id);
        documentHistories.delete(file.id);
        removeFileFromSidebarLayout(file.id);
        session.files = session.files.filter(candidate => candidate !== file && !candidate.welcome);
        if (!wasActive) return;
        let next = session.files.find(candidate => !candidate.builtin) || session.files[0];
        if (!next) {
          session.files.push(welcome);
          next = welcome;
        }
        activateFile(next);

      async function closeFile(file) {
        if (!file || file.builtin || file.welcome || !session.files.includes(file)) return false;
        const wasActive = activeFile() === file;
        if (wasActive) captureEditorValue();
        if (file.dirty) {
          cancelAutoSave(file);
          if (file.handle) {
            if (wasActive) updateStatus("Saving…");
            await saveFile(file);
          }
        }
        if (file.dirty && !confirm(`Close “${file.name}” without saving?`)) {
          scheduleAutoSave(file);
          if (wasActive) updateStatus();
          return false;
        }

        removeSessionFile(file);
        if (!wasActive) {
          renderFiles();
          updateStatus();
          scheduleSessionSave();
        }
        return true;
      }

      async function deleteFileTarget(target) {

            updateStatus("Could not delete this file");
            return;
          }

        removeSessionFile(file);
        renderFiles();
        updateStatus(`Deleted ${name}`);
        scheduleSessionSave();

        }
        if (event.key === "Escape" && tableResizeSession) {
          event.preventDefault();
          finishTableResize(null, false);
          return;
        }
        if (event.key === "Escape" && !tableResizeHandle.hidden) {
          event.preventDefault();
          hideTableResizeHandle();
          return;
        }
        if (event.key === "Escape" && imageResizeSession) {
          event.preventDefault();
          const resize = imageResizeSession;
          imageResizeSession = null;
          resize.image.style.width = resize.inlineWidth;
          resize.image.style.height = resize.inlineHeight;
          hideImageResizer();
          return;
        }
        if (event.key === "Escape" && !imageResizer.hidden) {
          event.preventDefault();
          hideImageResizer();
          return;
        }
        if (event.key === "Escape" && !fileContextMenu.hidden) {
          event.preventDefault();
          closeFileContextMenu({ restoreFocus: true });
          return;
        }
        if (event.key === "Escape" && !sectionContextMenu.hidden) {
          event.preventDefault();
          closeSectionContextMenu({ restoreFocus: true });
          return;
        }
        const saveShortcut = event.key.toLowerCase() === "s" && !event.altKey && !event.shiftKey
          && (event.metaKey || event.ctrlKey);
        if (saveShortcut) {
          event.preventDefault();
          void saveActiveFile();
          return;
        }
        const sidebarShortcut = event.key.toLowerCase() === "b" && event.altKey
          && (event.metaKey || event.ctrlKey) && !event.shiftKey;
        if (sidebarShortcut) {
          event.preventDefault();
          toggleSidebar();
          return;
        }
        if (event.key === "Escape" && mobileSidebarQuery.matches && appElement.dataset.sidebar === "open") {
          setSidebarOpen(false);
        }
      }, true);

      filesElement.addEventListener("dragover", event => {
        if (!draggedSidebarItem || event.target !== filesElement) return;
        event.preventDefault();
        if (event.dataTransfer) event.dataTransfer.dropEffect = "move";
        markSidebarDropTarget(filesElement);
      });
      filesElement.addEventListener("drop", event => {
        if (!draggedSidebarItem || event.target !== filesElement) return;
        event.preventDefault();
        const dragged = draggedSidebarItem;
        draggedSidebarItem = null;
        clearSidebarDropTargets();
        if (dragged.kind === "file") {
          moveFileToSection(dragged.fileId, null);
          return;
        }
        const section = sectionForId(dragged.sectionId);
        if (!section) return;
        session.sidebar.sections = session.sidebar.sections.filter(item => item !== section);
        session.sidebar.sections.push(section);
        renderFiles();
        scheduleSessionSave();
      });
      openFileButton.addEventListener("click", () => {
        closeFileContextMenu();
        closeSectionContextMenu();
        setNewMenuOpen(false);
        setThemeMenuOpen(false);
        viewPicker.open = false;
        void openLocalFile();
      });
      viewPicker.addEventListener("toggle", () => {
        if (!viewPicker.open) return;
        closeFileContextMenu();
        closeSectionContextMenu();
        setNewMenuOpen(false);
        setThemeMenuOpen(false);
      });
      viewPicker.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          event.preventDefault();
          viewPicker.open = false;
          viewToggle.focus();
          return;
        }
        if (!viewPicker.open || !["ArrowDown", "ArrowUp", "Home", "End"].includes(event.key)) return;
        event.preventDefault();
        const buttons = Array.from(viewButtons).filter(button => !button.disabled);
        const currentIndex = Math.max(0, buttons.indexOf(document.activeElement));
        const nextIndex = event.key === "Home" ? 0
          : event.key === "End" ? buttons.length - 1
          : (currentIndex + (event.key === "ArrowDown" ? 1 : -1) + buttons.length)
            % buttons.length;
        buttons[nextIndex]?.focus();
      });
      for (const button of viewButtons) {
        button.addEventListener("click", () => {
          viewPicker.open = false;
          switchEditorMode(button.dataset.mode);
        });
      }
      for (const tools of tableEdgeTools) {
        tools.addEventListener("pointerdown", event => event.preventDefault());
        tools.addEventListener("keydown", event => {
          const tool = event.target.closest?.("[data-table-action]");
          if (tool && ["Enter", " "].includes(event.key)) {
            event.preventDefault();
            if (tool.getAttribute("aria-disabled") !== "true") {
              runTableAction(tool.dataset.tableAction);
            }
            return;
          }
          if (event.key === "Escape") {
            event.preventDefault();
            hideTableEdgeTools();
            editor.focus();
          }
        });
      }
      for (const tool of tableEdgeHandles) {
        tool.addEventListener("click", () => {
          if (tool.getAttribute("aria-disabled") !== "true") {
            runTableAction(tool.dataset.tableAction);
          }
        });
      }
      tableExportToggle.addEventListener("click", () => {
        setTableExportMenuOpen(tableExportMenu.hidden);
      });
      tableExportToggle.addEventListener("keydown", event => {
        if (event.key === "ArrowDown") {
          event.preventDefault();
          setTableExportMenuOpen(true, { focus: true });
        } else if (event.key === "Escape") {
          event.preventDefault();
          hideTableExportTools();
        }
      });
      tableExportMenu.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          event.preventDefault();
          setTableExportMenuOpen(false);
          tableExportToggle.focus();
          return;
        }
        if (!['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(event.key)) return;
        event.preventDefault();
        const currentIndex = Math.max(0, tableExportActions.indexOf(document.activeElement));
        const nextIndex = event.key === "Home" ? 0
          : event.key === "End" ? tableExportActions.length - 1
          : (currentIndex + (event.key === "ArrowDown" ? 1 : -1)
            + tableExportActions.length) % tableExportActions.length;
        tableExportActions[nextIndex]?.focus();
      });
      for (const button of tableExportActions) {
        button.addEventListener("click", () => void runTableExportAction(
          button.dataset.tableExport));
      }
      tableResizeHandle.addEventListener("pointerdown", startTableResize);
      for (const button of imageAlignButtons) {
        button.addEventListener("pointerdown", event => event.preventDefault());
        button.addEventListener("click", () => {
          const image = selectedImage;
          const alignment = button.dataset.imageAlign;
          if (!image || imageAlignment(image) === alignment) return;
          if (!commitImageAlignment(image, alignment)) {
            updateStatus("Could not align this image");
          }
        });
      }
      for (const handle of imageResizeHandles) {
        handle.addEventListener("pointerdown", startImageResize);
        handle.addEventListener("pointermove", continueImageResize);
        handle.addEventListener("pointerup", event => finishImageResize(event));
        handle.addEventListener("pointercancel", event => finishImageResize(event, false));
      }
      editorElement.addEventListener("beforeinput", event => {
        if (prepareEditorHistoryInput(event)) rememberIrScrollPosition();
      }, true);
      editorElement.addEventListener("input", () => {
        restoreIrScrollPosition();
        hideTableEdgeTools();
        hideTableResizeHandle();
        hideTableExportTools();
        hideImageResizer();
      });
      editorElement.addEventListener("click", handleOutlineNavigation, true);
      editorElement.addEventListener("scroll", handleSplitViewScroll, true);
      editorElement.addEventListener("keydown", handleEditorViewShortcut, true);
      editorElement.addEventListener("keydown", handleEditorKeydown, true);
      editorElement.addEventListener("pointermove", moveTaskPointerDrag, true);
      editorElement.addEventListener("pointerdown", startTaskPointerDrag, true);
      window.addEventListener("pointerup", finishTaskPointerDrag, true);
      window.addEventListener("pointercancel", event =>
        finishTaskPointerDrag(event, false), true);
      editorElement.addEventListener("pointerleave", () => {
        if (!taskPointerDragSession) setTaskDragHandleItem(null);
      });
      editorElement.addEventListener("copy", handleTableCopy, true);
      editorElement.addEventListener("paste", event => void pasteFormattedLink(event), true);
      editorElement.addEventListener("pointerover", event => {
        const image = editableImageFromNode(event.target);
        if (image && image !== selectedImage && !imageResizeSession) showImageResizer(image);
      }, true);
      editorElement.addEventListener("pointerout", event => {
        const image = editableImageFromNode(event.target);
        if (!image || image !== selectedImage) return;
        if (imageResizer.contains(event.relatedTarget)) return;
        hideImageResizerAfterHover();
      }, true);
      imageResizer.addEventListener("pointerleave", hideImageResizerAfterHover);
      editorElement.addEventListener("pointerdown", event => {
        breakDocumentHistoryCoalescing();
        const toolbarType = event.target.closest?.(".vditor-toolbar button")?.dataset.type;
        if (toolbarType && ![
          "history-undo", "history-redo", "draw", "fullscreen",
          "outline", "export", "edit-mode"
        ].includes(toolbarType)) markEditorHistoryPending("", "command");
        if (event.button !== 0) return;
        const image = editableImageFromNode(event.target);
        if (image) showImageResizer(image, true);
      }, true);
      editorElement.addEventListener("click", event => {
        const image = editableImageFromNode(event.target);
        if (!image?.closest("a") || event.metaKey || event.ctrlKey || event.shiftKey) return;
        event.preventDefault();
      }, true);
      editorElement.addEventListener("click", event => {
        const image = editableImageFromNode(event.target);
        if (!image || event.metaKey || event.ctrlKey || event.shiftKey) return;
        event.preventDefault();
        if (image.classList.contains("LocalMarkdown-excalidraw-image")) {
          clearTimeout(imagePreviewTimer);
          imagePreviewTimer = setTimeout(() => openImagePreview(image), 220);
          return;
        }
        openImagePreview(image);
      }, true);
      editorElement.addEventListener("click", event => {
        if (!excalidrawAttachmentFromEvent(event)) return;
        event.preventDefault();
        event.stopImmediatePropagation();
      }, true);
      editorElement.addEventListener("dblclick", event => {
        const attachment = excalidrawAttachmentFromEvent(event);
        if (!attachment) return;
        clearTimeout(imagePreviewTimer);
        imagePreviewTimer = null;
        event.preventDefault();
        event.stopImmediatePropagation();
        void openDrawingDialog(attachment.id);
      }, true);
      drawingCancelButton.addEventListener("click", () => closeDrawingDialog());
      drawingSaveButton.addEventListener("click", () => void commitDrawing());
      drawingDialog.addEventListener("cancel", event => {
        event.preventDefault();
        closeDrawingDialog();
      });
      imagePreviewClose.addEventListener("click", closeImagePreview);
      imagePreviewDialog.addEventListener("click", event => {
        if (event.target === imagePreviewDialog) closeImagePreview();
      });
      imagePreviewDialog.addEventListener("cancel", event => {
        event.preventDefault();
        closeImagePreview();
      });

      addEventListener("beforeunload", event => {
        captureEditorValue();
        void persistSessionNow();
        if (!session.files.some(file => !file.builtin && file.dirty)) return;
        event.preventDefault();
        event.returnValue = "";
      });

      addEventListener("pagehide", () => {
        captureEditorValue();
        void persistSessionNow();
      });

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState !== "hidden") return;
        captureEditorValue();
        void persistSessionNow();
      });

      await restoreSession();
      renderFiles();
      updateStatus();

      const toolbarIconPaths = {
        emoji: '<circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/>',
        headings: '<path d="M6 4v16M18 4v16M6 12h12"/>',
        bold: '<path d="M6 4h8a4 4 0 0 1 0 8H6zM6 12h9a4 4 0 0 1 0 8H6z"/>',
        italic: '<path d="M19 4h-9M14 20H5M15 4 9 20"/>',
        strike: '<path d="M16 4H9a3 3 0 0 0-2.83 4M14 12a4 4 0 0 1 0 8H6M4 12h16"/>',
        link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
        list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
        "ordered-list": '<path d="M10 6h11M10 12h11M10 18h11M4 6h1v4M4 10h2M6 18H4c0-1 2-2 2-3s-.75-1.5-2-1.5"/>',
        check: '<path d="M10 6h11M10 12h11M10 18h11M3 6l1 1 2-2M3 12l1 1 2-2M3 18l1 1 2-2"/>',
        outdent: '<path d="M3 5h18M10 12h11M10 19h11M3 12l4-3v6Z"/>',
        indent: '<path d="M3 5h18M10 12h11M10 19h11M7 12l-4-3v6Z"/>',
        quote: '<path d="M3 21c3 0 7-1 7-8V5a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h3c0 3-1 4-4 4v4ZM14 21c3 0 7-1 7-8V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h3c0 3-1 4-4 4v4Z"/>',
        line: '<path d="M5 12h14"/>',
        code: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="m10 8-4 4 4 4M14 8l4 4-4 4"/>',
        "inline-code": '<path d="m8 9-3 3 3 3M16 9l3 3-3 3M14 5l-4 14"/>',
        "insert-before": '<path d="M5 4h14M12 20V8M7 13l5-5 5 5"/>',
        "insert-after": '<path d="M5 20h14M12 4v12M7 11l5 5 5-5"/>',
        upload: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21M16 3v6M13 6h6"/>',
        table: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>',
        draw: '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/>',
        undo: '<path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-2"/>',
        redo: '<path d="m15 14 5-5-5-5M20 9H10a6 6 0 0 0 0 12h2"/>',
        fullscreen: '<path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>',
        outline: '<path d="M3 5h18M3 12h12M3 19h8M17 16l4 3-4 3"/>',
        export: '<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>'
      };

      function toolbarIcon(name) {
        const paths = toolbarIconPaths[name];
        if (!paths) return "";
        return `<svg class="LocalMarkdown-toolbar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${paths}</svg>`;
      }

      const toolbarTips = {
        "ordered-list": "Numbered list",
        line: "Horizontal rule",
        upload: "Insert image"
      };

      function toolbarControl(name, tipPosition = "n") {
        return {
          name,
          tipPosition,
          icon: toolbarIcon(name),
          ...(toolbarTips[name] ? { tip: toolbarTips[name] } : {})
        };
      }

      function historyToolbarControl(direction) {
        const isRedo = direction === "redo";
        const isMac = /Mac|iPhone|iPad|iPod/.test(navigator.platform);
        const shortcut = isRedo
          ? (isMac ? "⌘⇧Z" : "Ctrl+Shift+Z / Ctrl+Y")
          : (isMac ? "⌘Z" : "Ctrl+Z");
        return {
          name: `history-${direction}`,
          tip: `${isRedo ? "Redo" : "Undo"} (${shortcut})`,
          tipPosition: "nw",
          icon: toolbarIcon(direction),
          click() {
            if (isRedo) redoDocumentChange();
            else undoDocumentChange();
          }
        };
      }

      function drawingToolbarControl() {
        return {
          name: "draw",
          tip: "Draw with Excalidraw",
          tipPosition: "n",
          icon: toolbarIcon("draw"),
          click() {
            void openDrawingDialog();
          }
        };
      }

      const emojiMap = {
        red_circle: "🔴", orange_circle: "🟠", yellow_circle: "🟡", green_circle: "🟢",
        check_mark: "✅", warning: "⚠️", x: "❌", exclamation: "❗",
        "+1": "👍", fire: "🔥", target: "🎯", pin: "📌",
        tada: "🎉", bulb: "💡", eyes: "👀", thinking: "🤔",

        blush: "😊", slightly_smiling_face: "🙂", upside_down_face: "🙃",

        yum: "😋", stuck_out_tongue: "😛", zany_face: "🤪",
        raised_eyebrow: "🤨", neutral_face: "😐", expressionless: "😑",
        unamused: "😒", roll_eyes: "🙄", grimacing: "😬", relieved: "😌",
        pensive: "😔", sleepy: "😪", sleeping: "😴", drooling_face: "🤤",
        mask: "😷", thermometer_face: "🤒", hot_face: "🥵", cold_face: "🥶",
        sunglasses: "😎", nerd_face: "🤓", monocle_face: "🧐", confused: "😕",
        worried: "😟", frowning: "☹️", open_mouth: "😮", flushed: "😳",
        pleading_face: "🥺", cry: "😢", sob: "😭", scream: "😱",
        angry: "😠", rage: "😡", exploding_head: "🤯", party_face: "🥳",
        heart: "❤️", orange_heart: "🧡", yellow_heart: "💛", green_heart: "💚",
        blue_heart: "💙", purple_heart: "💜", broken_heart: "💔", sparkles: "✨",
        hundred: "💯", confetti_ball: "🎊", "-1": "👎", ok_hand: "👌",
        victory_hand: "✌️",
        crossed_fingers: "🤞", love_you_gesture: "🤟", call_me_hand: "🤙",
        clap: "👏", raised_hands: "🙌", open_hands: "👐", palms_up: "🤲",
        handshake: "🤝", pray: "🙏", muscle: "💪", wave: "👋",
        point_up: "☝️", point_right: "👉", point_left: "👈", point_down: "👇",
        brain: "🧠", speech_balloon: "💬", thought_balloon: "💭", question: "❓",
        link: "🔗",
        memo: "📝", books: "📚", calendar: "📅", chart_up: "📈",
        chart_down: "📉", trophy: "🏆", medal: "🏅",
        gift: "🎁", bell: "🔔", lock: "🔒", unlock: "🔓",
        key: "🔑", gear: "⚙️", hammer_and_wrench: "🛠️", magnifying_glass: "🔍",
        laptop: "💻", phone: "📱", camera: "📷", hourglass: "⏳",
        coffee: "☕", pizza: "🍕", cake: "🎂", seedling: "🌱",
        sun: "☀️", moon: "🌙", star: "⭐", rainbow: "🌈", earth: "🌍",
        rocket: "🚀", airplane: "✈️", car: "🚗", house: "🏠"
      };

      updateViewButtons(initialEditorMode);
      editor = new Vditor("LocalMarkdown-editor", {
        cdn: vditorCdn,
        mode: initialEditorMode,
        value: activeFile().text,
        height: "100%",
        minHeight: 200,
        hint: { emoji: emojiMap },
        toolbar: [
          toolbarControl("emoji", "ne"), toolbarControl("headings", "ne"),
          toolbarControl("bold", "ne"), toolbarControl("italic", "ne"),
          toolbarControl("strike", "ne"), toolbarControl("link"), "|",
          toolbarControl("list"), toolbarControl("ordered-list"), toolbarControl("check"),
          toolbarControl("outdent"), toolbarControl("indent"), "|",
          toolbarControl("quote"), toolbarControl("line"), toolbarControl("code"),
          toolbarControl("inline-code"), toolbarControl("insert-before"),
          toolbarControl("insert-after"), "|", toolbarControl("upload"),
          toolbarControl("table"), drawingToolbarControl(), "|",
          historyToolbarControl("undo"), historyToolbarControl("redo"), "|",
          toolbarControl("fullscreen", "nw"),
          toolbarControl("outline", "nw"), toolbarControl("export", "nw"),
          { name: "edit-mode", className: "LocalMarkdown-internal-edit-mode" }
        ],
        customWysiwygToolbar() {},
        cache: { enable: false },
        counter: { enable: false },
        outline: { enable: false, position: "right" },
        preview: {
          actions: [],
          theme: {
            current: document.documentElement.dataset.theme === "solarized-dark" ? "dark" : "light"
          },
          hljs: {
            style: document.documentElement.dataset.theme === "white"
              ? "github"
              : `base16/${document.documentElement.dataset.theme}`
          }
        },
        resize: { enable: false },
        upload: {
          multiple: true,
          handler: pasteEmbeddedImages
        },
        theme: "classic",
        lang: "en_US",
        placeholder: "Write Markdown…",
        input(value) {
          const file = activeFile();
          const canonical = canonicalEditorText(value, file);
          const transactionInput = resolveEditorHistoryValue(file, canonical);
          const synchronizeHistory = !transactionInput
            && consumeEditorHistorySynchronization(file);
          if (canonical === file.text) return;
          const before = documentSnapshot(file, { captureSelection: false });
          const wasDirty = file.dirty;
          file.text = canonical;
          if (!file.builtin) {
            file.dirty = true;
            scheduleAutoSave(file);
            scheduleSessionSave();
          }
          if (transactionInput) {
            if (pendingEditorHistoryInput?.fileId === file.id) pendingEditorHistoryInput = null;
          } else if (synchronizeHistory) synchronizeDocumentHistoryPresent(file, canonical);
          else recordDocumentMutation(file, before, editorHistoryDetails(file));
          if (!wasDirty && file.dirty) renderFiles();
          updateStatus();
          scheduleAttachmentPreviews();
        },
        after() {
          editorReady = true;
          setTheme(document.documentElement.dataset.theme, { persist: false });
          for (const button of viewButtons) button.disabled = false;
          updateViewButtons(editor.getCurrentMode());
          observeAttachmentPreviews();
          setEditorValue(activeFile());
          documentHistoryFor(activeFile());
          updateDocumentHistoryControls();
          updateStatus();
          scheduleAttachmentPreviews();
          scheduleTableWidths();
          observeOutline();
        }
      });

      addEventListener("unload", () => {
        attachmentPreviewObserver?.disconnect();
        outlineObserver?.disconnect();
        cancelAnimationFrame(irScrollRestoreFrame);
        cancelAnimationFrame(outlineRefreshFrame);
        cancelAnimationFrame(tableWidthRefreshFrame);
        releaseAttachmentPreviews();
        imageWorker?.terminate();
        if (imageWorkerUrl) URL.revokeObjectURL(imageWorkerUrl);
      });
    })();
  </script>
